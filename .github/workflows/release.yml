# Publica los instaladores cuando se sube una etiqueta "v1.2.3" (o "v1.2.3-beta.1" → prelanzamiento).
#
#   1. Sube la versión en Punto-Ventas/build.gradle (version = '1.2.3'), commit.
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# La etiqueta DEBE coincidir con la versión de build.gradle (si no, el flujo se detiene antes de compilar).
# Instaladores obligatorios: Windows x64 (.exe) y macOS Apple Silicon (.dmg). Opcionales (pueden fallar sin
# detener la publicación): Windows x86 de 32 bits y macOS Intel. El programa elige el suyo por el nombre del
# archivo (ActualizacionService.elegirActivo), así que NO cambiar la convención:
#   PuntoDeVenta-<versión>-windows-x64.exe · -windows-x86.exe · -macos-arm64.dmg · -macos-x64.dmg
#
# Seguridad (docs/publicar.md):
#  - Solo se dispara con etiquetas v*: en GitHub conviene una regla (ruleset) para que solo el dueño pueda crear
#    etiquetas v*. Nada de pull_request_target ni workflow_dispatch con entradas que lleguen a un shell.
#  - permissions mínimos: lectura en todo; escritura de contenidos solo en el trabajo que crea la release.
#  - Acciones fijadas por SHA completo (el comentario dice la versión). Para subirlas: cambiar el SHA y el comentario.
#  - No se ejecuta nada que venga de fuera (ni del cuerpo de la release ni de entradas); sin "curl | sh".
#  - Se publica SHA256SUMS.txt con las sumas de todos los instaladores.
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: Punto-Ventas

jobs:
  version:
    name: Comprobar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.datos.outputs.version }}
      prerelease: ${{ steps.datos.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: La etiqueta debe coincidir con build.gradle
        id: datos
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE=$(sed -n "s/^version = '\(.*\)'.*/\1/p" build.gradle | head -1)
          echo "Etiqueta: $TAG  ·  build.gradle: $GRADLE"
          if [ "$TAG" != "$GRADLE" ]; then
            echo "::error::La etiqueta v$TAG no coincide con version = '$GRADLE' en Punto-Ventas/build.gradle"
            exit 1
          fi
          case "$TAG" in
            *[!0-9A-Za-z.-]*) echo "::error::Versión con caracteres no permitidos: $TAG"; exit 1 ;;
          esac
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  windows-x64:
    name: Windows x64 (exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: WiX Toolset 3 en el PATH
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { "WiX ya está en el PATH"; exit 0 }
          if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) {
            "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "WiX encontrado en $env:WIX"; exit 0
          }
          choco install wixtoolset --version 3.14.1 -y --no-progress
          "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Pruebas
        run: .\gradlew.bat test --no-daemon
      - name: Instalador
        run: .\gradlew.bat jpackageTask --no-daemon
      - name: Renombrar
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Get-ChildItem build\installer\*.exe | Rename-Item -NewName "PuntoDeVenta-$env:VERSION-windows-x64.exe"
          Get-ChildItem build\installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-windows-x64
          path: Punto-Ventas/build/installer/*.exe
          if-no-files-found: error

  windows-x86:
    # 32 bits: JavaFX 17.0.8 (último con artefacto win-x86) + runtime de un JDK 17 de 32 bits. Frágil: puede fallar sin detener la publicación.
    name: Windows x86 (exe, opcional)
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: JDK 17 de 32 bits (solo para jpackage)
        id: jdkx86
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: x86
      - name: JDK 17 de 64 bits (para Gradle; queda como JAVA_HOME)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: WiX Toolset 3 en el PATH
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) { "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8; exit 0 }
          choco install wixtoolset --version 3.14.1 -y --no-progress
          "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Instalador de 32 bits
        env:
          JDK_X86: ${{ steps.jdkx86.outputs.path }}
        run: .\gradlew.bat jpackageTask -x test --no-daemon -PjavafxVersion=17.0.8 -PjavafxPlatform=win-x86 "-PjdkJpackage=$env:JDK_X86"
      - name: Renombrar
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Get-ChildItem build\installer\*.exe | Rename-Item -NewName "PuntoDeVenta-$env:VERSION-windows-x86.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-windows-x86
          path: Punto-Ventas/build/installer/*.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon (dmg)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Pruebas
        run: ./gradlew test --no-daemon
      - name: Instalador
        run: ./gradlew jpackageTask --no-daemon
      - name: Renombrar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for f in build/installer/*.dmg; do mv "$f" "build/installer/PuntoDeVenta-$VERSION-macos-arm64.dmg"; done
          ls -la build/installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-macos-arm64
          path: Punto-Ventas/build/installer/*.dmg
          if-no-files-found: error

  macos-x64:
    # Macs con Intel. Si GitHub retira el runner "macos-15-intel" este trabajo falla y la publicación sigue sin él.
    name: macOS Intel (dmg, opcional)
    needs: version
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Instalador
        run: ./gradlew jpackageTask -x test --no-daemon
      - name: Renombrar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for f in build/installer/*.dmg; do mv "$f" "build/installer/PuntoDeVenta-$VERSION-macos-x64.dmg"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-macos-x64
          path: Punto-Ventas/build/installer/*.dmg
          if-no-files-found: error

  release:
    name: Crear release en GitHub
    needs: [version, windows-x64, macos-arm64, windows-x86, macos-x64]
    # Los dos obligatorios deben haber salido bien; los opcionales pueden haber fallado
    if: ${{ always() && needs.version.result == 'success' && needs.windows-x64.result == 'success' && needs.macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # el único trabajo que escribe en el repositorio (crea la release y sube los archivos)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: instalador-*
          path: instaladores
          merge-multiple: true
      - name: Sumas SHA-256
        working-directory: instaladores
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Punto de Venta ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: instaladores/*
