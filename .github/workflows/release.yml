# Publica los instaladores cuando se sube una etiqueta "v1.2.3" (o "v1.2.3-beta.1" → prelanzamiento).
#
#   1. Sube la versión en Punto-Ventas/build.gradle (version = '1.2.3'), commit.
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# La etiqueta DEBE coincidir con la versión de build.gradle (si no, el flujo se detiene antes de compilar).
# Instaladores obligatorios: Windows x64 (.exe) y macOS Apple Silicon (.dmg). Opcionales (pueden fallar sin
# detener la publicación): Windows x86 de 32 bits y macOS Intel. El programa elige el suyo por el nombre del
# archivo (ActualizacionService.elegirActivo), así que NO cambiar la convención:
#   PuntoDeVenta-<versión>-windows-x64.exe · -windows-x86.exe · -macos-arm64.dmg · -macos-x64.dmg
#   · -linux-x64.deb · -linux-x64.rpm · -linux-x64.tar.gz (Linux también es opcional)
# Si existe el secreto TAP_TOKEN, al final se actualiza el cask de Homebrew en Minepacman/homebrew-tap.
#
# Seguridad (docs/publicar.md):
#  - Solo se dispara con etiquetas v*: en GitHub conviene una regla (ruleset) para que solo el dueño pueda crear
#    etiquetas v*. Nada de pull_request_target ni workflow_dispatch con entradas que lleguen a un shell.
#  - permissions mínimos: lectura en todo; escritura de contenidos solo en el trabajo que crea la release.
#  - Acciones fijadas por SHA completo (el comentario dice la versión). Para subirlas: cambiar el SHA y el comentario.
#  - No se ejecuta nada que venga de fuera (ni del cuerpo de la release ni de entradas); sin "curl | sh".
#  - Se publica SHA256SUMS.txt con las sumas de todos los instaladores, y cada archivo lleva una attestation de
#    procedencia de GitHub (actions/attest-build-provenance; se comprueba con `gh attestation verify <archivo>
#    --repo Minepacman/Punto-Ventas`). Solo el trabajo "release" tiene id-token/attestations: write.
#  - El nombre visible del programa es "Caja Libre" (util/Marca); los archivos conservan el prefijo técnico
#    PuntoDeVenta-<versión>-… (el buscador de actualizaciones no mira el prefijo, pero el cask de Homebrew y el
#    PKGBUILD de AUR sí lo usan).
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: Punto-Ventas

jobs:
  version:
    name: Comprobar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.datos.outputs.version }}
      prerelease: ${{ steps.datos.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: La etiqueta debe coincidir con build.gradle
        id: datos
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          GRADLE=$(sed -n "s/^version = '\(.*\)'.*/\1/p" build.gradle | head -1)
          echo "Etiqueta: $TAG  ·  build.gradle: $GRADLE"
          if [ "$TAG" != "$GRADLE" ]; then
            echo "::error::La etiqueta v$TAG no coincide con version = '$GRADLE' en Punto-Ventas/build.gradle"
            exit 1
          fi
          case "$TAG" in
            *[!0-9A-Za-z.-]*) echo "::error::Versión con caracteres no permitidos: $TAG"; exit 1 ;;
          esac
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  windows-x64:
    name: Windows x64 (exe)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: WiX Toolset 3 en el PATH
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { "WiX ya está en el PATH"; exit 0 }
          if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) {
            "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            "WiX encontrado en $env:WIX"; exit 0
          }
          choco install wixtoolset --version 3.14.1 -y --no-progress
          "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Pruebas
        run: .\gradlew.bat test --no-daemon
      - name: Anotar pruebas fallidas
        if: failure()
        run: python ../.github/scripts/anotar-pruebas.py build/test-results
      - name: Instalador
        run: .\gradlew.bat jpackageTask --no-daemon
      - name: Renombrar
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Get-ChildItem build\installer\*.exe | Rename-Item -NewName "PuntoDeVenta-$env:VERSION-windows-x64.exe"
          Get-ChildItem build\installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-windows-x64
          path: Punto-Ventas/build/installer/*.exe
          if-no-files-found: error

  windows-x86:
    # 32 bits: JavaFX 17.0.8 (último con artefacto win-x86) + runtime de un JDK 17 de 32 bits. Frágil: puede fallar sin detener la publicación.
    name: Windows x86 (exe, opcional)
    needs: version
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: JDK 17 de 32 bits (solo para jpackage)
        id: jdkx86
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          architecture: x86
      - name: JDK 17 de 64 bits (para Gradle; queda como JAVA_HOME)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: WiX Toolset 3 en el PATH
        shell: pwsh
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) { exit 0 }
          if ($env:WIX -and (Test-Path "$env:WIX\bin\candle.exe")) { "$env:WIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8; exit 0 }
          choco install wixtoolset --version 3.14.1 -y --no-progress
          "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Instalador de 32 bits
        env:
          JDK_X86: ${{ steps.jdkx86.outputs.path }}
        run: .\gradlew.bat jpackageTask -x test --no-daemon -PjavafxVersion=17.0.8 -PjavafxPlatform=win-x86 "-PjdkJpackage=$env:JDK_X86"
      - name: Renombrar
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          Get-ChildItem build\installer\*.exe | Rename-Item -NewName "PuntoDeVenta-$env:VERSION-windows-x86.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-windows-x86
          path: Punto-Ventas/build/installer/*.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon (dmg)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Pruebas
        run: ./gradlew test --no-daemon
      - name: Instalador
        run: ./gradlew jpackageTask --no-daemon
      - name: Renombrar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for f in build/installer/*.dmg; do mv "$f" "build/installer/PuntoDeVenta-$VERSION-macos-arm64.dmg"; done
          ls -la build/installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-macos-arm64
          path: Punto-Ventas/build/installer/*.dmg
          if-no-files-found: error

  macos-x64:
    # Macs con Intel. Si GitHub retira el runner "macos-15-intel" este trabajo falla y la publicación sigue sin él.
    name: macOS Intel (dmg, opcional)
    needs: version
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Instalador
        run: ./gradlew jpackageTask -x test --no-daemon
      - name: Renombrar
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for f in build/installer/*.dmg; do mv "$f" "build/installer/PuntoDeVenta-$VERSION-macos-x64.dmg"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-macos-x64
          path: Punto-Ventas/build/installer/*.dmg
          if-no-files-found: error

  linux-x64:
    # Se construye en Ubuntu 24.04: el .deb hereda las dependencias de ese sistema (libgtk-3-0t64, etc.), así que
    # instala en Ubuntu 24.04+ / Debian 13+ / Mint 22+. Para distribuciones más viejas y para las que no usan
    # deb/rpm está el .tar.gz portable (lleva su propio runtime de Java). Opcional: puede fallar sin detener la publicación.
    name: Linux x64 (deb, rpm y tar.gz, opcional)
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Herramientas de empaquetado (fakeroot para deb, rpmbuild para rpm)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fakeroot rpm
          fakeroot -v && rpmbuild --version
      - name: Pruebas (sin pantalla; las que necesitan el toolkit de JavaFX se omiten solas)
        run: ./gradlew test --no-daemon
      - name: Paquete deb
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew jpackageTask --no-daemon
          mkdir -p build/publicar
          for f in build/installer/*.deb; do mv "$f" "build/publicar/PuntoDeVenta-$VERSION-linux-x64.deb"; done
          dpkg-deb --info "build/publicar/PuntoDeVenta-$VERSION-linux-x64.deb"
      - name: Paquete rpm (opcional)
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew jpackageTask -x test --no-daemon -PlinuxType=rpm
          for f in build/installer/*.rpm; do mv "$f" "build/publicar/PuntoDeVenta-$VERSION-linux-x64.rpm"; done
      - name: Portable tar.gz (opcional)
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew jpackageTask -x test --no-daemon -PlinuxType=tar.gz
          for f in build/installer/*.tar.gz; do mv "$f" "build/publicar/PuntoDeVenta-$VERSION-linux-x64.tar.gz"; done
      - name: Resumen
        run: ls -la build/publicar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instalador-linux-x64
          path: Punto-Ventas/build/publicar/*
          if-no-files-found: error

  release:
    name: Crear release en GitHub
    needs: [version, windows-x64, macos-arm64, windows-x86, macos-x64, linux-x64]
    # Los dos obligatorios deben haber salido bien; los opcionales pueden haber fallado
    if: ${{ always() && needs.version.result == 'success' && needs.windows-x64.result == 'success' && needs.macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write       # el único trabajo que escribe en el repositorio (crea la release y sube los archivos)
      id-token: write       # token OIDC para firmar las attestations de procedencia (Sigstore, vía GitHub)
      attestations: write   # guardar las attestations en el repositorio
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: instalador-*
          path: instaladores
          merge-multiple: true
      # Código fuente con nombre propio (GitHub agrega además sus "Source code" automáticos, que no se pueden quitar
      # ni renombrar) y una guía de descarga al inicio de las notas para que nadie baje el archivo equivocado.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
      - name: Código fuente y guía de descarga
        working-directory: .
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git -C repo archive --format=zip --prefix="PuntoDeVenta-$VERSION-codigo-fuente/" -o "$PWD/instaladores/PuntoDeVenta-$VERSION-codigo-fuente.zip" HEAD
          {
            echo "## ¿Cuál archivo descargo?"
            echo
            echo "| Tu computadora | Archivo |"
            echo "|---|---|"
            echo "| Windows 10/11 (la mayoría) | \`PuntoDeVenta-$VERSION-windows-x64.exe\` |"
            echo "| Windows de 32 bits (PCs muy viejas) | \`PuntoDeVenta-$VERSION-windows-x86.exe\` |"
            echo "| Mac con chip Apple (M1, M2, M3…) | \`PuntoDeVenta-$VERSION-macos-arm64.dmg\` |"
            echo "| Mac con procesador Intel | \`PuntoDeVenta-$VERSION-macos-x64.dmg\` |"
            echo "| Ubuntu / Debian / Mint | \`PuntoDeVenta-$VERSION-linux-x64.deb\` |"
            echo "| Fedora / openSUSE | \`PuntoDeVenta-$VERSION-linux-x64.rpm\` |"
            echo "| Otro Linux | \`PuntoDeVenta-$VERSION-linux-x64.tar.gz\` |"
            echo
            echo "Los archivos **\"Source code\"** y \`codigo-fuente.zip\` son el código del programa para programadores: **no los necesitas para usarlo**."
            echo "Si tu programa ya está instalado, ábrelo y usa *Acerca de → Buscar actualizaciones*."
            echo
            echo "**Caja Libre es gratuito.** Descárgalo solo de esta página o del sitio oficial <https://minepacman.github.io/Punto-Ventas/>;"
            echo "nadie más vende copias, «claves» ni soporte oficial. La única cuenta de donación es la publicada en el sitio oficial"
            echo "(firmada en \`claves/donacion.pdvd\`); antes de transferir, revisa que tu banco muestre como beneficiario a **Elias Oziel Sánchez Fernández**."
            echo "Cada archivo trae su suma en \`SHA256SUMS.txt\` y una attestation de procedencia de GitHub:"
            echo "\`gh attestation verify <archivo> --repo Minepacman/Punto-Ventas\`."
            echo
          } > guia-descarga.md
          cat guia-descarga.md
      - name: Sumas SHA-256
        working-directory: instaladores
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Attestation de procedencia (Sigstore, gratis en repos públicos): prueba que cada archivo salió de este
      # flujo, en este repositorio y en este commit. Se verifica con: gh attestation verify <archivo> --repo Minepacman/Punto-Ventas
      - name: Attestations de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: instaladores/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Caja Libre ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: guia-descarga.md
          fail_on_unmatched_files: true
          files: instaladores/*

      # ── Homebrew (macOS): actualiza el cask de Minepacman/homebrew-tap con las sumas de esta release ──
      # Solo si existe el secreto TAP_TOKEN (PAT de grano fino con "Contents: write" SOLO sobre homebrew-tap) y la
      # versión es final. Sin el secreto no pasa nada; si falla, la release ya está publicada y no se deshace.
      - name: ¿Actualizar el tap de Homebrew?
        id: tap
        working-directory: .
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          if [ -n "$TAP_TOKEN" ] && [ "$PRERELEASE" != "true" ]; then
            echo "activo=true" >> "$GITHUB_OUTPUT"
          else
            echo "activo=false" >> "$GITHUB_OUTPUT"
            echo "Sin secreto TAP_TOKEN o es prelanzamiento: el cask de Homebrew no se toca (docs/publicar.md)."
          fi
      - name: Clonar el tap
        if: steps.tap.outputs.activo == 'true'
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Minepacman/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: homebrew-tap
      - name: Cask punto-de-venta con la versión y sumas nuevas
        if: steps.tap.outputs.activo == 'true'
        continue-on-error: true
        working-directory: homebrew-tap
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash scripts/actualizar-cask.sh "$VERSION" --sumas "$GITHUB_WORKSPACE/instaladores/SHA256SUMS.txt"
          git config user.name "Minepacman"
          git config user.email "142938186+Minepacman@users.noreply.github.com"
          git add Casks/punto-de-venta.rb
          if git diff --cached --quiet; then echo "El cask ya estaba en $VERSION"; exit 0; fi
          git commit -m "punto-de-venta $VERSION"
          git push
