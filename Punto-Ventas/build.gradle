plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot'       version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.openjfx.javafxplugin'       version '0.1.0' apply false
}

// Es buena práctica usar minúsculas para el group
group = 'me.eliassanchezfernandez'
// ÚNICA fuente de verdad de la versión: de aquí salen version.properties (util/VersionApp, lo que ve el
// usuario y el User-Agent del buscador de actualizaciones), el manifiesto del jar y --app-version de
// jpackage. Para publicar: subir este número, hacer commit y etiquetar "v" + versión (ver docs/publicar.md).
version = '1.0.0'
description = 'Punto-de-venta'
ext.repositorioUrl = 'https://github.com/Minepacman/Punto-Ventas'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

// Java 17 + JavaFX 17: la línea 17 es la última con soporte de Windows 10/11 de 32 bits en JavaFX.
// OJO: OpenJFX publicó el artefacto win-x86 SOLO hasta 17.0.2 y en 17.0.6-17.0.8; de 17.0.9 en
// adelante no existe. El plugin de JavaFX 0.1.0 no conoce la plataforma win-x86, así que para el
// instalador de 32 bits se declaran los jars a mano:
//   gradlew.bat jpackageTask -x test -PjavafxVersion=17.0.8 -PjavafxPlatform=win-x86 -PjdkJpackage=C:\ruta\jdk-17-x86
// (Gradle corre con un JDK de 64 bits; el JDK 17 de 32 bits solo lo usa jpackage para el runtime).
def javafxVersion = project.findProperty('javafxVersion') ?: '17.0.10'
def javafxPlataforma = project.findProperty('javafxPlatform')
if (javafxPlataforma) {
    dependencies {
        ['base', 'graphics', 'controls', 'fxml'].each {
            implementation "org.openjfx:javafx-$it:$javafxVersion:$javafxPlataforma"
        }
    }
} else {
    apply plugin: 'org.openjfx.javafxplugin'
    javafx {
        version = javafxVersion
        modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
    }
}

// Herramientas del desarrollador (claves de donador): compilan contra main pero NO van en el jar ni en el instalador
sourceSets {
    herramientas {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    herramientasImplementation.extendsFrom implementation
    herramientasRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // Spring Boot dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter'

    // Seguridad: solo usamos BCrypt para las contraseñas (login propio en JavaFX,
    // no hace falta el starter web de Spring Security)
    implementation 'org.springframework.security:spring-security-crypto'

    // Database dependencies: SQLite (una sola caja) y PostgreSQL (varias cajas contra un servidor en la red local)
    runtimeOnly 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.4.Final'
    runtimeOnly 'org.postgresql:postgresql'

    // mDNS (Bonjour/Zeroconf): nombre local "mitienda.local" para el acceso móvil. Apache-2.0, Java puro
    implementation 'org.jmdns:jmdns:3.5.9'

    // JavaFX dependencies
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'

    // Lombok dependencies
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // (Se quitaron commons-lang3 y jasperreports: no se usan en el código y jasperreports arrastraba
    //  unos 30 jars / 80 MB al instalador. Si algún día se imprime con Jasper, volver a agregarlo.)

    // JSON del servicio de clima (Open-Meteo); versión administrada por el BOM de Spring Boot
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Código QR del acceso móvil (Nayuki QR Code generator, MIT, ~50 KB, sin dependencias)
    implementation 'io.nayuki:qrcodegen:1.8.0'

    // Báscula por puerto serial (RS-232 / USB-serial). ~0.9 MB con los nativos de Windows x86/x64, macOS y Linux.
    // Solo se carga cuando el administrador configura una báscula.
    implementation 'com.fazecast:jSerialComm:2.10.4'

    // Exportar tablas a .xlsx (Excel): escritor mínimo (~115 KB + opczip ~27 KB), sin Apache POI
    implementation 'org.dhatim:fastexcel:0.18.4'

    // Exportar tablas a PDF (~2 MB). Se prefirió a imprimir a una "impresora PDF" porque no
    // depende de que el equipo tenga una y se puede probar sin interfaz gráfica.
    implementation 'com.github.librepdf:openpdf:1.3.32'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // La herramienta del desarrollador se prueba (libro, emisión, revocación) aunque no vaya en el instalador
    testImplementation sourceSets.herramientas.output
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PostgreSQL embebido SOLO para las pruebas con etiqueta "postgres" (./gradlew testPostgres):
    // descarga un binario de PostgreSQL para el sistema actual la primera vez; no instala nada en el equipo.
    testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
    testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8:14.22.0'
    // zonky usa commons-compress 1.28, que necesita commons-lang3 >= 3.17; el BOM de Spring Boot fija 3.13 (solo pruebas)
    testImplementation 'org.apache.commons:commons-lang3:3.17.0'
}

// El código fuente y las pruebas están en UTF-8 (acentos, ñ, emojis). Sin esto, compilar en Windows
// (Java 17 usa cp1252 por defecto) corrompe los textos.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// La versión llega al programa por version.properties (expandido aquí) y por el manifiesto del jar
tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('version.properties') {
        expand(version: project.version)
    }
}
tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'PuntoDeVenta', 'Implementation-Version': project.version)
    }
}

// ── Claves de donador (solo el desarrollador; ver docs/donadores.md) ────────────────────────
// Todas corren HerramientaDonadores (source set "herramientas", nunca en el instalador) y reciben sus
// datos como propiedades -Pnombre=valor. El libro y las llaves viven en ~/.puntodeventa-desarrollador.
def tareaDonadores = { String nombre, String comando, String descripcion, List<List<String>> propiedades ->
    tasks.register(nombre, JavaExec) {
        group = 'donadores'
        description = descripcion
        classpath = sourceSets.herramientas.runtimeClasspath
        mainClass = 'me.eliassanchezfernandez.puntodeventa.herramientas.HerramientaDonadores'
        def lista = [comando]
        propiedades.each { par ->
            def valor = project.findProperty(par[0])
            if (valor != null && !valor.toString().isEmpty()) lista += ['--' + par[1], valor.toString()]
        }
        args lista
    }
}
tareaDonadores('crearLlavesDonador', 'crear-llaves', 'Crea el par de llaves Ed25519 en ~/.puntodeventa-desarrollador (una sola vez)', [])
tareaDonadores('emitirClaveDonador', 'emitir',
        'Emite una clave PDV2 (vence en -Pmeses=12): -Pdonador="Abarrotes Lupita" [-Pnivel=basico|plus|patrocinador] [-Pmonto=300] [-PfechaPago=2026-11-12] [-Prastreo=…] [-Pcontacto=+52…]',
        [['donador', 'donador'], ['nivel', 'nivel'], ['meses', 'meses'], ['monto', 'monto'], ['fechaPago', 'fecha-pago'],
         ['rastreo', 'rastreo'], ['contacto', 'contacto']])
tareaDonadores('generarClaveDonador', 'emitir', 'Alias de emitirClaveDonador',
        [['donador', 'donador'], ['nivel', 'nivel'], ['meses', 'meses'], ['monto', 'monto'], ['fechaPago', 'fecha-pago'],
         ['rastreo', 'rastreo'], ['contacto', 'contacto']])
tareaDonadores('renovarClaveDonador', 'renovar', 'Renueva una clave (mismo id y nombre): -Pid=ABCD2345 [-Pmeses=12] [-Pnivel=…] [-Pmonto=…] [-PfechaPago=…] [-Prastreo=…]',
        [['id', 'id'], ['meses', 'meses'], ['nivel', 'nivel'], ['monto', 'monto'], ['fechaPago', 'fecha-pago'], ['rastreo', 'rastreo']])
tareaDonadores('revocarClaveDonador', 'revocar', 'Anota una clave como revocada en el libro: -Pid=ABCD2345 -Pmotivo="…" (luego publicarRevocaciones)',
        [['id', 'id'], ['motivo', 'motivo']])
tareaDonadores('buscarDonador', 'buscar', 'Busca en el libro: -Ptexto="Lupita" | -Pid=ABCD2345 | -Pinstalacion=7F3A-91C2 (sin nada: todo)',
        [['texto', 'texto'], ['id', 'id'], ['instalacion', 'instalacion']])
tareaDonadores('verificarClaveDonador', 'verificar', 'Coteja una clave o un mensaje de soporte pegado contra el libro: -Pclave="PDV2.…" | -Ptexto="…"',
        [['clave', 'clave'], ['texto', 'texto']])
tareaDonadores('registrarSoporte', 'registrar-soporte', 'Anota una atención: -Pid=ABCD2345 [-Pinstalacion=7F3A-91C2] [-Pversion=1.0.3] [-Pnota="…"]',
        [['id', 'id'], ['instalacion', 'instalacion'], ['version', 'version'], ['nota', 'nota']])
tasks.register('publicarRevocaciones', JavaExec) {
    group = 'donadores'
    description = 'Escribe claves/revocadas.pdvr (lista firmada de claves revocadas) en la raíz del repositorio; luego commit y push'
    classpath = sourceSets.herramientas.runtimeClasspath
    mainClass = 'me.eliassanchezfernandez.puntodeventa.herramientas.HerramientaDonadores'
    args 'publicar-revocaciones', '--salida', rootProject.file('../claves/revocadas.pdvr').absolutePath
}

// Opciones de la JVM pensadas para PCs de 2-4 GB de RAM y disco duro (también las usa jpackage)
def jvmOpciones = [
        '-Xms64m', '-Xmx384m',
        '-XX:+UseSerialGC',
        '-XX:TieredStopAtLevel=1',
        '-XX:MaxMetaspaceSize=128m',
        '-Dfile.encoding=UTF-8',
        // límites del servidor web local (acceso móvil)
        '-Dsun.net.httpserver.maxReqTime=10',
        '-Dsun.net.httpserver.maxRspTime=30',
        '-Dsun.net.httpserver.maxConnections=64'
]

application {
    mainClass = 'me.eliassanchezfernandez.puntodeventa.Launcher'
    applicationDefaultJvmArgs = jvmOpciones
}

springBoot {
    mainClass = 'me.eliassanchezfernandez.puntodeventa.Launcher'
}

tasks.named('test') {
    // La suite normal corre contra SQLite; las pruebas contra PostgreSQL (@Tag("postgres")) y contra el
    // sandbox real de Facturama (@Tag("sandbox")) van aparte
    useJUnitPlatform { excludeTags 'postgres', 'sandbox' }
    defaultCharacterEncoding = 'UTF-8'
}

// Prueba opcional contra apisandbox.facturama.mx. Requiere las variables de entorno
// FACTURAMA_SANDBOX_USER y FACTURAMA_SANDBOX_PASS (nunca se guardan credenciales en el código).
tasks.register('sandboxTest', Test) {
    group = 'verification'
    description = 'Prueba de timbrado, descarga y cancelación contra el sandbox de Facturama (requiere credenciales en el entorno)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'sandbox'
    }
    defaultCharacterEncoding = 'UTF-8'
}

// Pruebas contra PostgreSQL (esquema, ventas concurrentes, cortes por caja, migración SQLite → servidor):
//   ./gradlew testPostgres
// Levanta un PostgreSQL embebido (zonky) en una carpeta temporal y lo apaga al terminar.
tasks.register('testPostgres', Test) {
    group = 'verification'
    description = 'Pruebas con etiqueta "postgres" contra un PostgreSQL embebido temporal'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postgres' }
    defaultCharacterEncoding = 'UTF-8'
    shouldRunAfter tasks.named('test')
}

// ── Instalador nativo (jpackage) ─────────────────────────────────────────────────────────────
// Se empaquetan los jars SUELTOS (build/install/<proyecto>/lib) con Launcher como clase principal,
// no el jar "gordo" de Spring Boot: arranca más rápido y los natives de JavaFX/SQLite quedan accesibles.
//   macOS:    ./gradlew jpackageTask            -> build/installer/PuntoDeVenta-1.0.0.dmg
//   Windows:  gradlew.bat jpackageTask          -> build/installer/PuntoDeVenta-1.0.0.exe
//             gradlew.bat jpackageTask -PwinType=msi
// jpackage SOLO construye para el sistema donde corre; en Windows hace falta WiX Toolset 3.x en el PATH.
// Los iconos salen de packaging/icono (los genera packaging/icono/GeneradorIcono.java).
// El UUID de actualización de Windows es FIJO: así una versión nueva reemplaza a la anterior en vez de
// instalarse al lado. No cambiarlo nunca.
ext.winUpgradeUuid = '56ef728e-9b2b-48ab-909a-1687f6bfcf0a'
tasks.register('jpackageTask') {
    group = 'distribution'
    description = 'Crea el instalador nativo del sistema actual con jpackage (dmg / exe / msi)'
    dependsOn 'installDist'

    doLast {
        def os = System.getProperty('os.name').toLowerCase()
        def esWindows = os.contains('win')
        def esMac = os.contains('mac')
        def lib = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
        def destino = layout.buildDirectory.dir('installer').get().asFile
        destino.deleteDir()

        // jpackage del JDK 17 del toolchain, o del JDK que se indique (-PjdkJpackage=..., p. ej. uno de 32 bits)
        def jdkJpackage = project.findProperty('jdkJpackage')
        def jdkRuta = jdkJpackage ? file(jdkJpackage)
                : javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }.get().metadata.installationPath.asFile
        def jpackage = new File(jdkRuta, "bin/jpackage" + (esWindows ? '.exe' : '')).absolutePath

        // jpackage exige x.y.z numérico: "1.1.0-beta.1" → "1.1.0"
        def versionNumerica = (project.version.toString() =~ /^\d+\.\d+\.\d+/)[0]
        def icono = file(esMac ? 'packaging/icono/PuntoDeVenta.icns' : 'packaging/icono/PuntoDeVenta.ico')
        def licencia = rootProject.file('../LICENSE')

        def args = [jpackage,
                '--input', lib.absolutePath,
                '--dest', destino.absolutePath,
                '--name', 'PuntoDeVenta',
                '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', 'me.eliassanchezfernandez.puntodeventa.Launcher',
                '--app-version', versionNumerica,
                '--vendor', 'Elias Sanchez',
                '--copyright', '2026 Elias Oziel Sanchez Fernandez - GPLv3',
                '--description', 'Punto de venta para abarrotes',
                '--about-url', repositorioUrl]
        if (icono.exists()) args += ['--icon', icono.absolutePath]
        if (licencia.exists()) args += ['--license-file', licencia.absolutePath]
        jvmOpciones.each { args += ['--java-options', it] }
        if (esMac) {
            args += ['--type', 'dmg', '--mac-package-identifier', 'me.eliassanchezfernandez.puntodeventa',
                     '--mac-package-name', 'PuntoDeVenta']
        } else if (esWindows) {
            args += ['--type', (project.findProperty('winType') ?: 'exe'),
                     '--win-menu', '--win-shortcut', '--win-per-user-install', '--win-dir-chooser',
                     '--win-upgrade-uuid', winUpgradeUuid]
        } else {
            args += ['--type', 'app-image']
        }
        logger.lifecycle("jpackage: " + args.join(' '))
        def proceso = new ProcessBuilder(args).inheritIO().start()
        if (proceso.waitFor() != 0) throw new GradleException('jpackage falló (en Windows revisa que WiX 3.x esté en el PATH)')
    }
}
