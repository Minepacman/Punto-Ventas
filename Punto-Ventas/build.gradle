plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot'       version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.openjfx.javafxplugin'       version '0.1.0'
}

// Es buena práctica usar minúsculas para el group
group = 'me.eliassanchezfernandez'
version = '0.0.1-SNAPSHOT'
description = 'Punto-de-venta'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

javafx {
    // Java 17 + JavaFX 17: la línea 17 es la última con soporte de Windows 10/11 de 32 bits en JavaFX.
    // OJO: OpenJFX publicó el artefacto win-x86 SOLO hasta 17.0.2 y en 17.0.6-17.0.8; de 17.0.9 en
    // adelante no existe. Para el instalador de 32 bits: -PjavafxVersion=17.0.8 y Gradle con un JDK 17 de 32 bits.
    version = project.findProperty('javafxVersion') ?: '17.0.10'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

dependencies {
    // Spring Boot dependencies
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter'

    // Seguridad: solo usamos BCrypt para las contraseñas (login propio en JavaFX,
    // no hace falta el starter web de Spring Security)
    implementation 'org.springframework.security:spring-security-crypto'

    // Database dependencies
    runtimeOnly 'org.xerial:sqlite-jdbc:3.45.3.0'
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.4.4.Final'

    // JavaFX dependencies
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'

    // Lombok dependencies
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // (Se quitaron commons-lang3 y jasperreports: no se usan en el código y jasperreports arrastraba
    //  unos 30 jars / 80 MB al instalador. Si algún día se imprime con Jasper, volver a agregarlo.)

    // JSON del servicio de clima (Open-Meteo); versión administrada por el BOM de Spring Boot
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Código QR del acceso móvil (Nayuki QR Code generator, MIT, ~50 KB, sin dependencias)
    implementation 'io.nayuki:qrcodegen:1.8.0'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// El código fuente y las pruebas están en UTF-8 (acentos, ñ, emojis). Sin esto, compilar en Windows
// (Java 17 usa cp1252 por defecto) corrompe los textos.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Opciones de la JVM pensadas para PCs de 2-4 GB de RAM y disco duro (también las usa jpackage)
def jvmOpciones = [
        '-Xms64m', '-Xmx384m',
        '-XX:+UseSerialGC',
        '-XX:TieredStopAtLevel=1',
        '-XX:MaxMetaspaceSize=128m',
        '-Dfile.encoding=UTF-8',
        // límites del servidor web local (acceso móvil)
        '-Dsun.net.httpserver.maxReqTime=10',
        '-Dsun.net.httpserver.maxRspTime=30',
        '-Dsun.net.httpserver.maxConnections=64'
]

application {
    mainClass = 'me.eliassanchezfernandez.puntodeventa.Launcher'
    applicationDefaultJvmArgs = jvmOpciones
}

springBoot {
    mainClass = 'me.eliassanchezfernandez.puntodeventa.Launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    defaultCharacterEncoding = 'UTF-8'
}

// ── Instalador nativo (jpackage) ─────────────────────────────────────────────────────────────
// Se empaquetan los jars SUELTOS (build/install/<proyecto>/lib) con Launcher como clase principal,
// no el jar "gordo" de Spring Boot: arranca más rápido y los natives de JavaFX/SQLite quedan accesibles.
//   macOS:    ./gradlew jpackageTask            -> build/installer/PuntoDeVenta-1.0.0.dmg
//   Windows:  gradlew.bat jpackageTask          -> build/installer/PuntoDeVenta-1.0.0.exe
//             gradlew.bat jpackageTask -PwinType=msi
// jpackage SOLO construye para el sistema donde corre; en Windows hace falta WiX Toolset 3.x en el PATH.
tasks.register('jpackageTask') {
    group = 'distribution'
    description = 'Crea el instalador nativo del sistema actual con jpackage (dmg / exe / msi)'
    dependsOn 'installDist'

    doLast {
        def os = System.getProperty('os.name').toLowerCase()
        def esWindows = os.contains('win')
        def esMac = os.contains('mac')
        def lib = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
        def destino = layout.buildDirectory.dir('installer').get().asFile
        destino.deleteDir()

        def jdk17 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }.get()
        def jpackage = jdk17.metadata.installationPath.file("bin/jpackage" + (esWindows ? '.exe' : '')).asFile.absolutePath

        def args = [jpackage,
                '--input', lib.absolutePath,
                '--dest', destino.absolutePath,
                '--name', 'PuntoDeVenta',
                '--main-jar', tasks.jar.archiveFileName.get(),
                '--main-class', 'me.eliassanchezfernandez.puntodeventa.Launcher',
                '--app-version', '1.0.0',
                '--vendor', 'Elias Sanchez',
                '--description', 'Punto de venta para abarrotes']
        jvmOpciones.each { args += ['--java-options', it] }
        if (esMac) {
            args += ['--type', 'dmg']
        } else if (esWindows) {
            args += ['--type', (project.findProperty('winType') ?: 'exe'),
                     '--win-menu', '--win-shortcut', '--win-per-user-install', '--win-dir-chooser']
        } else {
            args += ['--type', 'app-image']
        }
        logger.lifecycle("jpackage: " + args.join(' '))
        def proceso = new ProcessBuilder(args).inheritIO().start()
        if (proceso.waitFor() != 0) throw new GradleException('jpackage falló (en Windows revisa que WiX 3.x esté en el PATH)')
    }
}
