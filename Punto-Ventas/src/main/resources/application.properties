# ──────────────────────────────────────────────────
#  Abarrotes POS – Configuración principal
# ──────────────────────────────────────────────────

# Nombre de la aplicación
spring.application.name=PuntoDeVenta

# ── Base de datos SQLite ──────────────────────────
# Valor de reserva (p. ej. al ejecutar PuntoDeVentaApp directo desde el IDE): ./datos.db en la carpeta de trabajo.
# Al arrancar con Launcher, RutasApp.prepararUrl() fija spring.datasource.url ANTES de Spring:
#   - Windows %APPDATA%\PuntoDeVenta\datos.db, macOS ~/Library/Application Support/PuntoDeVenta/datos.db,
#     otros ~/.puntodeventa/datos.db (la carpeta de instalación no es escribible sin ser administrador);
#   - o ./datos.db si ya existe en la carpeta de trabajo (desarrollo / instalación anterior): se sigue usando, sin mover ni copiar.
# Una URL explícita (SPRING_DATASOURCE_URL, -Dspring.datasource.url o --spring.datasource.url) manda sobre todo lo anterior.
spring.datasource.url=jdbc:sqlite:datos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialecto SQLite para Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Crea / actualiza las tablas al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Lotes de escritura y orden de sentencias (menos viajes al disco en recálculos y altas masivas)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# No mantener abierta la sesión de JPA durante toda la petición (la app no es web)
spring.jpa.open-in-view=false

# ── Pool y ajustes de SQLite (PCs con disco duro y poca RAM) ──
# SQLite admite un solo escritor: un pool chico basta. Los pragmas se aplican a CADA conexión.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
spring.datasource.hikari.data-source-properties.busy_timeout=10000
spring.datasource.hikari.data-source-properties.cache_size=-8000
spring.datasource.hikari.data-source-properties.temp_store=MEMORY
spring.datasource.hikari.data-source-properties.foreign_keys=true

# Sin banner de Spring en el arranque
spring.main.banner-mode=off

# ── Configuración del negocio ─────────────────────
app.nombre-tienda=Mi Tienda
app.moneda=MXN
app.version=1.0.0
