# ──────────────────────────────────────────────────
#  Abarrotes POS – Configuración principal
# ──────────────────────────────────────────────────

# Nombre de la aplicación
spring.application.name=PuntoDeVenta

# ── Base de datos ──────────────────────────────────
# Valor de reserva (p. ej. al ejecutar PuntoDeVentaApp directo desde el IDE): ./datos.db en la carpeta de trabajo.
# Al arrancar con Launcher, RutasApp.prepararUrl() fija spring.datasource.* ANTES de Spring según la
# configuración local de la caja (conexion.properties en la carpeta de datos del usuario, ver ConexionLocal):
#   - "Una sola caja": SQLite en Windows %APPDATA%\PuntoDeVenta\datos.db, macOS ~/Library/Application Support/PuntoDeVenta/datos.db,
#     otros ~/.puntodeventa/datos.db; o ./datos.db si ya existe en la carpeta de trabajo (desarrollo / instalación
#     anterior): se sigue usando, sin mover ni copiar.
#   - "Varias cajas": jdbc:postgresql://servidor:5432/base con usuario y contraseña, driver org.postgresql.Driver y
#     dialecto PostgreSQLDialect.
# Una URL explícita (SPRING_DATASOURCE_URL, -Dspring.datasource.url o --spring.datasource.url) manda sobre todo lo
# anterior; el driver y el dialecto se deducen de ella.
spring.datasource.url=jdbc:sqlite:datos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialecto SQLite para Hibernate (en modo "varias cajas" el Launcher lo cambia a PostgreSQLDialect)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Crea / actualiza las tablas al arrancar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Lotes de escritura y orden de sentencias (menos viajes al disco en recálculos y altas masivas)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# No mantener abierta la sesión de JPA durante toda la petición (la app no es web)
spring.jpa.open-in-view=false

# ── Pool de conexiones ──
# El tamaño del pool y los pragmas de SQLite (WAL, busy_timeout, foreign_keys...) o los ajustes de PostgreSQL
# los aplica AjustesPoolPorDialecto según el motor en uso; aquí solo iría lo que se quiera forzar a mano.

# Sin banner de Spring en el arranque
spring.main.banner-mode=off

# ── Configuración del negocio ─────────────────────
app.nombre-tienda=Mi Tienda
app.moneda=MXN
app.version=1.0.0
