<!--
  ============================================================================
  Caja Libre - Interfaz web MÓVIL (archivo único: HTML + CSS + JS)
  ----------------------------------------------------------------------------
  - Lo sirve el programa de escritorio (ServidorMovilService) en la red local.
  - Sin dependencias externas ni CDNs: funciona sin internet, solo en la LAN.
  - LOGIN, SESIÓN y DATOS (estadísticas, ventas, inventario, ajustes,
    proveedores con su agenda de entrega/preventa, avisos de la campana) son
    reales: el objeto `api` (sección 3) llama con fetch() a /api/* y el servidor
    vuelve a comprobar los permisos del usuario en cada petición. SOLO la lectura
    del ticket del proveedor (OCR) sigue siendo un DEMO (objeto `ocr`).
  - NOTIFICACIONES (objeto `notificaciones`, sección 11c): Web Push con el service
    worker /sw.js. Solo funcionan con la página abierta por HTTPS (con la «llave» =
    certificado de la tienda instalada en el teléfono). El asistente (sección 11d,
    tarjeta de arriba en Ajustes, QR «#/avisos» del escritorio) lleva paso a paso:
    llave -> página segura (la sesión pasa con un código de un uso) -> [iPhone:
    pantalla de inicio] -> permiso -> prueba. Todo lo demás funciona igual por HTTP.
  - Seguridad: todo texto dinámico se inserta con textContent/createTextNode
    (función h()), nunca con innerHTML.
  ============================================================================
-->
<style>
/* ===== Paleta (misma que el escritorio: css/app.css) ===== */
:root {
  --bg: #F3F5F8;  --surface: #FFFFFF;  --surface-alt: #F7F8FA;  --inset: #ECEFF3;
  --border: #D3D9E0;  --border-subtle: #E4E8ED;
  --text: #1E2631;  --muted: #5A6472;  --subtle: #8A939F;
  --accent: #2F6CAD;  --accent-hover: #285E98;  --accent-text: #285E98;
  --accent-subtle: #EAF1F9;  --on-accent: #FFFFFF;  --ring: rgba(47,108,173,.35);
  --danger: #B23A43;  --danger-text: #A1343C;  --danger-subtle: #FBF0F1;
  --success: #2E7A55; --success-text: #276A49; --success-subtle: #EDF6F1;
  --warning: #B0731C; --warning-text: #8A5A14; --warning-subtle: #FCF5E9;
  --shadow: 0 1px 2px rgba(20,30,45,.06), 0 4px 14px rgba(20,30,45,.06);
  --radius: 16px;
  --fs: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --bg: #11161D; --surface: #1A212B; --surface-alt: #202833; --inset: #252E3A;
    --border: #334050; --border-subtle: #2A3541;
    --text: #E8EDF3; --muted: #A5B0BD; --subtle: #7F8B99;
    --accent: #5B9BDB; --accent-hover: #74AAE2; --accent-text: #8DBAE8;
    --accent-subtle: #1F3248; --on-accent: #0E1620; --ring: rgba(91,155,219,.45);
    --danger: #E0666F; --danger-text: #F08C94; --danger-subtle: #3A2327;
    --success: #4DB383; --success-text: #75CBA2; --success-subtle: #1F3329;
    --warning: #D9A24C; --warning-text: #E8BC78; --warning-subtle: #382E1C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-tema="oscuro"] {
  --bg: #11161D; --surface: #1A212B; --surface-alt: #202833; --inset: #252E3A;
  --border: #334050; --border-subtle: #2A3541;
  --text: #E8EDF3; --muted: #A5B0BD; --subtle: #7F8B99;
  --accent: #5B9BDB; --accent-hover: #74AAE2; --accent-text: #8DBAE8;
  --accent-subtle: #1F3248; --on-accent: #0E1620; --ring: rgba(91,155,219,.45);
  --danger: #E0666F; --danger-text: #F08C94; --danger-subtle: #3A2327;
  --success: #4DB383; --success-text: #75CBA2; --success-subtle: #1F3329;
  --warning: #D9A24C; --warning-text: #E8BC78; --warning-subtle: #382E1C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
}
:root[data-texto="grande"] { --fs: 18px; }

/* ===== Base ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: var(--fs); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4; -webkit-text-size-adjust: 100%;
  min-height: 100vh; min-height: 100dvh;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.oculto { display: none !important; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

/* ===== Botones y campos (objetivos táctiles grandes, >= 48px) ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 52px; padding: 0 1.25rem; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-weight: 600;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
a.btn { text-decoration: none; }   /* enlaces con aspecto de botón (p. ej. "Llamar" con tel:) */
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn-primario { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primario:hover { background: var(--accent-hover); }
.btn-peligro { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-suave { background: var(--accent-subtle); border-color: transparent; color: var(--accent-text); }
.btn-block { width: 100%; }
.campo { display: grid; gap: .35rem; }
.campo > label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.entrada {
  width: 100%; min-height: 52px; padding: 0 1rem; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface); font-size: 1rem;
}
.entrada:focus { outline: 3px solid var(--ring); border-color: var(--accent); }
.con-boton { display: flex; gap: .5rem; }
.con-boton .entrada { flex: 1; }
.icono-btn { min-width: 52px; padding: 0; }

/* ===== Estructura de la app ===== */
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.cabecera {
  position: sticky; top: 0; z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: calc(env(safe-area-inset-top) + .6rem) 1rem .6rem;
  display: flex; align-items: center; gap: .75rem;
}
.cabecera h1 { font-size: 1.15rem; flex: 1; }
.cab-logo { width: 32px; height: 32px; border-radius: 9px; flex: none; display: block; }
.cab-titulos { flex: 1; min-width: 0; display: grid; }
.cab-titulos h1 { flex: none; }
.cab-negocio { font-size: .74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.btn-icono-cab { position: relative; width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; background: none; color: var(--accent-text); display: grid; place-items: center; cursor: pointer; }
.btn-icono-cab:hover { background: var(--accent-subtle); }
/* Campana de avisos: globo con el número de pendientes (se oculta en cero) */
.globo { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff;
  font-size: .68rem; font-weight: 800; line-height: 18px; text-align: center; font-variant-numeric: tabular-nums; pointer-events: none; }
.aviso-grupo { display: grid; gap: .4rem; }
.aviso-grupo + .aviso-grupo { margin-top: .4rem; }
.aviso-grupo .seccion-t { display: flex; align-items: center; gap: .4rem; margin-bottom: .1rem; }
.aviso-item { display: flex; align-items: center; gap: .5rem; min-width: 0; }
.aviso-item .aviso-ir { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: .6rem; padding: .6rem .6rem; border: 0; border-radius: 12px;
  background: var(--surface-alt); color: inherit; text-align: left; cursor: pointer; min-height: 52px; }
.aviso-item .aviso-ir[disabled] { cursor: default; opacity: 1; pointer-events: none; }
.aviso-item .ico-tipo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--accent-subtle); color: var(--accent-text); }
.aviso-item.alta .ico-tipo { background: var(--danger-subtle); color: var(--danger-text); }
.aviso-item.info .ico-tipo { background: var(--warning-subtle); color: var(--warning-text); }
.aviso-item .cuerpo { flex: 1; min-width: 0; }
.aviso-item .t { font-weight: 650; overflow-wrap: anywhere; line-height: 1.3; }
.aviso-item .d { font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; margin-top: .1rem; }
.aviso-x { width: 40px; height: 40px; flex: none; border: 0; border-radius: 10px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.aviso-x:hover { background: var(--inset); }
/* Iconos SVG en línea (ver ICONOS en el script): heredan el color del texto */
.ico-svg { display: block; flex: none; }
.pastilla {
  font-size: .7rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap;
  padding: .2rem .55rem; border-radius: 999px; background: var(--warning-subtle); color: var(--warning-text);
}
.vista { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 1rem 1rem calc(96px + env(safe-area-inset-bottom)); }
.vista > * + * { margin-top: 1rem; }
/* Columna de bloques de una vista. minmax(0, 1fr): un nombre largo sin espacios en una fila
   no ensancha la columna (con la pista `auto` el mínimo sería el texto completo y la página se saldría). */
.pila { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface);
  border-top: 1px solid var(--border-subtle); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-int { display: flex; width: 100%; max-width: 760px; }
.nav button {
  flex: 1; min-width: 0; min-height: 64px; padding: 0 2px; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: clamp(.6rem, .45rem + .8vw, .72rem); font-weight: 600; color: var(--muted);   /* cinco pestañas caben a 320 px */
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.nav button .ico { display: grid; place-items: center; line-height: 1; }
.nav button .ico svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent-text); }
.nav button[aria-current="page"] .ico { transform: translateY(-1px); }
.nav button[aria-current="page"] .ico svg { stroke-width: 2.4; }

/* ===== Tarjetas, listas, etiquetas ===== */
.tarjeta { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem; }
.titulo { font-size: 1.35rem; font-weight: 700; }
.sub { color: var(--muted); font-size: .9rem; }
.seccion-t { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .6rem; }
.rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.kpi { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--shadow); }
.kpi .e { font-size: .78rem; font-weight: 600; color: var(--muted); }
.kpi .v { font-size: 1.45rem; font-weight: 750; margin-top: .15rem; font-variant-numeric: tabular-nums; }
.kpi.grande { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.kpi.grande .e { color: inherit; opacity: .85; }
.kpi.grande .v { font-size: 2rem; }
.var { font-size: .8rem; font-weight: 700; margin-top: .15rem; display: inline-flex; align-items: center; gap: .3rem; }
.var.sube { color: var(--success-text); } .var.baja { color: var(--danger-text); }
.kpi.grande .var { color: inherit; opacity: .95; }
.segmentos { display: flex; background: var(--inset); border-radius: 14px; padding: 4px; gap: 4px; }
.segmentos button { flex: 1; min-height: 44px; border: 0; border-radius: 11px; background: none; font-weight: 650; color: var(--muted); cursor: pointer; }
.segmentos button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.fila { display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 14px; width: 100%; text-align: left; cursor: pointer; }
.fila + .fila { margin-top: .5rem; }
.fila .cuerpo { flex: 1; min-width: 0; }
.fila .t { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .d { font-size: .82rem; color: var(--muted); }
.fila .der { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.fila .miniatura { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 10px; object-fit: contain; background: #fff; border: 1px solid var(--border-subtle); }
.foto-detalle { display: block; width: min(60vw, 220px); height: min(60vw, 220px); margin: 0 auto .5rem; object-fit: contain; background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius); }
.insignia { display: inline-block; font-size: .7rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; background: var(--inset); color: var(--muted); }
.insignia.ok { background: var(--success-subtle); color: var(--success-text); }
.insignia.aviso { background: var(--warning-subtle); color: var(--warning-text); }
.insignia.mal { background: var(--danger-subtle); color: var(--danger-text); }
.barra { height: 10px; border-radius: 999px; background: var(--inset); overflow: hidden; margin-top: .35rem; }
.barra > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.top-item + .top-item { margin-top: .9rem; }
.top-item .l { display: flex; justify-content: space-between; gap: .5rem; font-size: .95rem; font-weight: 600; }
.top-item .l span:last-child { font-variant-numeric: tabular-nums; }
.horas { display: flex; align-items: flex-end; gap: 3px; height: 130px; }
.horas .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.horas .col i { width: 100%; min-height: 3px; border-radius: 5px 5px 2px 2px; background: var(--accent); opacity: .45; }
.horas .col.pico i { opacity: 1; }
.horas-et { display: flex; gap: 3px; margin-top: .3rem; }
.horas-et span { flex: 1; text-align: center; font-size: .62rem; color: var(--subtle); }
.vacio { text-align: center; color: var(--muted); padding: 2rem 1rem; }
.cargando { display: grid; place-items: center; padding: 3rem 1rem; color: var(--muted); gap: .75rem; }
.rueda { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--inset); border-top-color: var(--accent); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .rueda { animation-duration: 2.4s; } .barra > i { transition: none; } }
.aviso-err { background: var(--danger-subtle); color: var(--danger-text); border-radius: 12px; padding: .75rem 1rem; font-size: .92rem; font-weight: 600; }
.aviso-ok { background: var(--success-subtle); color: var(--success-text); border-radius: 12px; padding: .75rem 1rem; font-weight: 600; }

/* ===== Login ===== */
.login { flex: 1; display: grid; place-items: center; padding: 1.5rem 1rem; }
.login-caja { width: 100%; max-width: 420px; display: grid; gap: 1.1rem; }
.logo { display: block; width: 72px; height: 72px; border-radius: 18px; margin: 0 auto; box-shadow: var(--shadow); }
.login h1 { text-align: center; font-size: 1.6rem; }
.login .sub { text-align: center; }

/* ===== Hoja inferior (modal) ===== */
.velo { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,24,.55); display: flex; align-items: flex-end; justify-content: center; }
.hoja {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow: auto; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
  display: grid; gap: 1rem; animation: sube .22s ease;
}
@keyframes sube { from { transform: translateY(30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
.hoja h2 { font-size: 1.25rem; }
.acciones { display: grid; gap: .6rem; }
.acciones.dos { grid-template-columns: 1fr 1fr; }
.linea { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid var(--border-subtle); font-variant-numeric: tabular-nums; }
.linea:last-child { border-bottom: 0; }
.linea .n { min-width: 0; }
.linea .s { font-size: .8rem; color: var(--muted); }
.total-fila { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; padding-top: .6rem; }

/* ===== Interruptor ===== */
.fila-conf { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border-subtle); }
.fila-conf:last-child { border-bottom: 0; }
.fila-conf .t { font-weight: 650; } .fila-conf .d { font-size: .82rem; color: var(--muted); }
.interruptor { position: relative; width: 56px; height: 32px; border-radius: 999px; border: 0; background: var(--border); cursor: pointer; flex: none; transition: background .15s; }
.interruptor::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.interruptor[aria-checked="true"] { background: var(--accent); }
.interruptor[aria-checked="true"]::after { transform: translateX(24px); }

/* ===== Proveedores: semana, visitas y selector de días ===== */
.semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.sem-dia { min-height: 72px; padding: .4rem 0 .35rem; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--surface-alt);
  display: grid; justify-items: center; align-content: start; gap: 2px; cursor: pointer; min-width: 0; color: inherit; }
.sem-dia .sem-n { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
.sem-dia .sem-f { font-size: 1.05rem; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.sem-dia .sem-m { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 16px; align-items: center; }
.sem-dia .sem-m span { display: inline-flex; align-items: center; gap: 1px; font-size: .62rem; font-weight: 700; padding: 0 3px; border-radius: 6px;
  background: var(--accent-subtle); color: var(--accent-text); line-height: 15px; }
.sem-dia .sem-m span.pre { background: var(--warning-subtle); color: var(--warning-text); }
.sem-dia.hoy { border-color: var(--accent); }
.sem-dia.hoy .sem-n, .sem-dia.hoy .sem-f { color: var(--accent-text); }
.sem-dia[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.sem-dia[aria-pressed="true"] .sem-n, .sem-dia[aria-pressed="true"] .sem-f { color: var(--on-accent); }
.sem-dia[aria-pressed="true"] .sem-m span { background: rgba(255,255,255,.25); color: var(--on-accent); }
.sem-detalle { margin-top: .8rem; display: grid; gap: .4rem; min-width: 0; overflow-wrap: anywhere; }
.sem-titulo { font-weight: 700; }
.visita { display: flex; align-items: center; gap: .6rem; padding: .5rem .6rem; border-radius: 10px; background: var(--surface-alt); border: 0;
  width: 100%; text-align: left; cursor: pointer; color: inherit; min-height: 44px; }
.visita .ico-tipo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--accent-subtle); color: var(--accent-text); }
.visita.pre .ico-tipo { background: var(--warning-subtle); color: var(--warning-text); }
.visita .n { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.visita .q { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.leyenda { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-top: .8rem; font-size: .78rem; color: var(--muted); }
.leyenda span { display: inline-flex; align-items: center; gap: .3rem; }
.dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dia-chip { min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-weight: 650; font-size: .8rem;
  padding: 0; display: grid; place-items: center; color: var(--muted); }
button.dia-chip { cursor: pointer; }
.dia-chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dia-chip.pre.on { background: var(--warning); border-color: var(--warning); color: #fff; }
.dias.lectura .dia-chip { min-height: 34px; font-size: .74rem; }
textarea.entrada { min-height: 88px; padding: .7rem 1rem; resize: vertical; line-height: 1.35; }
.prox { display: flex; justify-content: space-between; gap: .75rem; padding: .5rem 0; border-bottom: 1px solid var(--border-subtle); }
.prox:last-child { border-bottom: 0; }
.prox .q { color: var(--muted); }
.nota { font-size: .8rem; color: var(--muted); }

/* ===== Escaneo de ticket ===== */
.tomar { display: grid; place-items: center; gap: .6rem; text-align: center; padding: 2rem 1rem; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.tomar .grande { color: var(--accent-text); }
.previa { width: 100%; max-height: 340px; object-fit: contain; border-radius: 14px; background: var(--inset); }
.entrada-oculta { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.paso { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-weight: 600; }

/* ===== Recorrido guiado (tutorial) ===== */
.tuto-velo { position: fixed; inset: 0; z-index: 40; }
.tuto-foco { position: fixed; border-radius: 16px; box-shadow: 0 0 0 9999px rgba(10,16,24,.62); outline: 2px solid var(--accent); outline-offset: 3px; transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease; pointer-events: none; }
.tuto-foco.sin { outline: 0; }
.tuto-tarjeta { position: fixed; left: 12px; right: 12px; max-width: 440px; margin: 0 auto; background: var(--surface); color: var(--text);
  border-radius: 20px; padding: 1rem 1rem .9rem; box-shadow: 0 12px 40px rgba(0,0,0,.35); display: grid; gap: .75rem; max-height: calc(100dvh - 24px); overflow: auto; }
.tuto-tarjeta.centro { top: 50%; transform: translateY(-50%); }
.tuto-cab { display: flex; align-items: center; gap: .6rem; }
.tuto-cab .tuto-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--accent-subtle); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.tuto-cab h2 { flex: 1; font-size: 1.1rem; min-width: 0; }
.tuto-cerrar { width: 40px; height: 40px; flex: none; border: 0; background: none; color: var(--muted); border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
.tuto-texto { color: var(--muted); font-size: .95rem; }
.tuto-pie { display: flex; align-items: center; gap: .5rem; }
.tuto-paso { flex: 1; font-size: .78rem; color: var(--subtle); display: grid; gap: .3rem; }
.tuto-puntos { display: flex; gap: 4px; }
.tuto-puntos i { width: 6px; height: 6px; border-radius: 3px; background: var(--border); transition: width .2s; }
.tuto-puntos i.act { background: var(--accent); width: 16px; }
.tuto-pie .btn { min-height: 44px; padding: 0 .9rem; }
@media (min-width: 1024px) { .tuto-tarjeta { left: calc(232px + 12px); } }

/* ===== Asistente «Recibir avisos en este teléfono» ===== */
.asistente { display: grid; gap: .9rem; }
.asistente .seccion-t { margin-bottom: 0; }
.asis-progreso { display: grid; gap: .35rem; }
.asis-progreso .txt { font-size: .82rem; font-weight: 700; color: var(--accent-text); }
.asis-barra { display: flex; gap: 4px; }
.asis-barra i { flex: 1; height: 6px; border-radius: 3px; background: var(--inset); }
.asis-barra i.hecho { background: var(--accent); }
.asis-barra i.act { background: var(--accent); opacity: .5; }
.asis-cab { display: flex; align-items: center; gap: .8rem; }
.asis-cab h2 { font-size: 1.2rem; line-height: 1.25; min-width: 0; }
.asis-ico { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; background: var(--accent-subtle); color: var(--accent-text); }
.asis-ico.ok { background: var(--success-subtle); color: var(--success-text); }
.asis-ico.mal { background: var(--warning-subtle); color: var(--warning-text); }
.asis-cuerpo { display: grid; gap: .75rem; font-size: 1.02rem; }
.asis-pasos { margin: 0; padding-left: 1.4rem; display: grid; gap: .5rem; }
.asis-pasos li { padding-left: .2rem; }
.asis-tecla { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--accent-subtle); color: var(--accent-text); vertical-align: middle; }
/* Ruta en Ajustes dibujada como una lista de ajustes del teléfono */
.ruta { display: grid; border: 1px solid var(--border-subtle); border-radius: 14px; overflow: hidden; background: var(--surface-alt); }
.ruta > div { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .6rem .85rem; font-weight: 600; border-top: 1px solid var(--border-subtle); min-width: 0; }
.ruta > div:first-child { border-top: 0; }
.ruta > div span { min-width: 0; overflow-wrap: anywhere; }
.ruta > div svg { color: var(--subtle); }
.ruta > div.fin { background: var(--accent-subtle); color: var(--accent-text); }
.ruta > div.fin svg { color: var(--accent-text); }
.asis-icono-inicio { display: grid; justify-items: center; gap: .3rem; font-size: .8rem; font-weight: 600; color: var(--muted); }
.asis-icono-inicio img { border-radius: 13px; box-shadow: var(--shadow); }
.asis-ayuda { border-top: 1px solid var(--border-subtle); padding-top: .6rem; }
.asis-ayuda summary { display: flex; align-items: center; gap: .5rem; min-height: 44px; cursor: pointer; font-weight: 650; color: var(--accent-text); list-style: none; }
.asis-ayuda summary::-webkit-details-marker { display: none; }
.asis-ayuda[open] summary { margin-bottom: .4rem; }
.asis-ayuda .asis-pasos { font-size: .95rem; }
.asis-ayuda .nota { margin-top: .6rem; }

/* ===== Aviso emergente ===== */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; max-width: 92vw;
  background: #222B36; color: #fff; padding: .75rem 1.1rem; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); }

/* ===== Responsivo (mobile-first: lo de arriba es teléfono vertical; aquí se amplía) ===== */
html, body { overflow-x: clip; }
.cabecera h1 { font-size: clamp(1.05rem, 0.9rem + 1vw, 1.5rem); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titulo { font-size: clamp(1.2rem, 1.05rem + 1vw, 1.6rem); }
.kpi .v { font-size: clamp(1.25rem, 1rem + 1.6vw, 1.7rem); overflow-wrap: anywhere; }
.kpi.grande .v { font-size: clamp(1.7rem, 1.3rem + 2.4vw, 2.4rem); }
.login h1 { font-size: clamp(1.4rem, 1.2rem + 1.2vw, 1.9rem); }
.cabecera { padding-left: calc(1rem + env(safe-area-inset-left)); padding-right: calc(1rem + env(safe-area-inset-right)); }
.vista { max-width: 760px; padding-left: calc(1rem + env(safe-area-inset-left)); padding-right: calc(1rem + env(safe-area-inset-right)); }
.nav { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
.campo, .rejilla > *, .fila .cuerpo, .linea .n { min-width: 0; }
.entrada[type="date"] { min-width: 0; text-align: left; }
.top-item .l span:first-child, .linea .n, .previa { overflow-wrap: anywhere; min-width: 0; }
.segmentos button { min-width: 0; padding: 0 .3rem; font-size: clamp(.8rem, .72rem + .6vw, 1rem); }
.fila .der { white-space: nowrap; }
.interruptor::before { content: ""; position: absolute; inset: -8px -4px; }   /* zona táctil >= 44px */
.lista-rej { display: block; }
.estrecho { max-width: 640px; }

@media (hover: hover) {
  .fila:hover { background: var(--accent-subtle); border-color: var(--accent); }
  .btn:hover:not(.btn-primario):not(.btn-peligro) { background: var(--inset); }
  .nav button:hover { color: var(--accent-text); }
}

/* Teléfono apaisado: poca altura, se compacta barra y modales */
@media (orientation: landscape) and (max-height: 520px) {
  .nav button { min-height: 48px; grid-auto-flow: column; gap: .4rem; font-size: .8rem; }
  .nav button .ico svg { width: 20px; height: 20px; }
  .vista { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  .cabecera { padding-top: calc(env(safe-area-inset-top) + .3rem); padding-bottom: .3rem; }
  .hoja { max-height: 96dvh; padding-top: .9rem; }
  .login { align-items: start; padding: .75rem 1rem; }
  .login-caja { gap: .7rem; }
  .logo { width: 48px; height: 48px; border-radius: 12px; }
  .toast { bottom: calc(70px + env(safe-area-inset-bottom)); }
  .previa { max-height: 60dvh; }
}

@media (min-width: 600px) {
  .velo { align-items: center; padding: 1rem; }
  .hoja { border-radius: 24px; max-height: 90dvh; overscroll-behavior: contain; }
  .r4 { grid-template-columns: repeat(4, 1fr); }
  .kpi .v { font-size: clamp(1.4rem, 1rem + 1.2vw, 1.9rem); }
}
@media (min-width: 700px) {
  .lista-rej { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; align-items: stretch; }
  .lista-rej > :not(.fila) { grid-column: 1 / -1; }
  .lista-rej .fila { margin-top: 0; }
}
@media (min-width: 768px) {
  .vista { max-width: 980px; padding-top: 1.5rem; }
  .nav-int { max-width: 980px; }
  .vista > * + * { margin-top: 1.25rem; }
}

@media (min-width: 1024px) {
  #app { padding-left: 232px; }
  .nav { top: 0; right: auto; bottom: 0; width: 232px; border-top: 0; border-right: 1px solid var(--border-subtle);
    justify-content: flex-start; padding: 1.25rem .75rem calc(1rem + env(safe-area-inset-bottom)) calc(.75rem + env(safe-area-inset-left)); }
  .nav-int { flex-direction: column; max-width: none; gap: .25rem; }
  .nav button { flex: none; display: flex; justify-content: flex-start; align-items: center; gap: .75rem;

  .nav button .ico { width: 1.6rem; }
  .nav button .ico svg { width: 22px; height: 22px; }

  .nav button[aria-current="page"] .ico { transform: none; }
  .vista { max-width: 1180px; padding-bottom: 2rem; padding-left: 2rem; padding-right: 2rem; }
  .cabecera { padding-left: 2rem; padding-right: 2rem; }
  .toast { bottom: 24px; left: calc(50% + 116px); }

  .vista-int { grid-template-columns: 1fr 1fr; align-items: start; }
  .vista-int > .rejilla { grid-column: 1 / -1; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .vista-int > .rejilla > .kpi { grid-column: auto !important; }

  .vista-int > .rejilla > .kpi:nth-child(4) { grid-column: 1 / -1 !important; }
  .cfg { grid-template-columns: 1fr 1fr; align-items: start; }
  .cfg > .tarjeta:first-child, .cfg > .btn { grid-column: 1 / -1; }
  .cfg > .btn { justify-self: start; min-width: 240px; }
}
@media (min-width: 1280px) {
  .lista-rej { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

}

 * Icono SVG en línea. Decorativo por defecto (aria-hidden); con `etiqueta` es
 * un icono con significado propio (role="img" + <title>), p. ej. solo en un botón.
 */
function icono(nombre, { tamano = 24, etiqueta = null, clase = '' } = {}) {
  const trazos = ICONOS[nombre] || [];
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(tamano));
  svg.setAttribute('height', String(tamano));
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('class', 'ico-svg' + (clase ? ' ' + clase : ''));
  svg.setAttribute('focusable', 'false');
  if (etiqueta) {
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', etiqueta);
    const t = document.createElementNS(SVG_NS, 'title');
    t.textContent = etiqueta;
    svg.append(t);
  } else {
    svg.setAttribute('aria-hidden', 'true');
  }
  for (const d of trazos) {
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', d);
    svg.append(p);
  }
  return svg;
}

/** Hoja inferior modal. cerrable=false obliga a elegir una opción. */
function hoja(contenido, { cerrable = true } = {}) {
  const previo = document.activeElement;
  const velo = h('div', { class: 'velo' });
  const panel = h('div', { class: 'hoja', role: 'dialog', 'aria-modal': 'true' }, contenido);
  velo.append(panel);
  const cerrar = () => { velo.remove(); document.removeEventListener('keydown', alTecla); if (previo && previo.focus) previo.focus(); };
  const alTecla = e => { if (e.key === 'Escape' && cerrable) cerrar(); };
  if (cerrable) velo.addEventListener('click', e => { if (e.target === velo) cerrar(); });
  document.addEventListener('keydown', alTecla);
  document.body.append(velo);
  const primero = panel.querySelector('input, select, button');
  if (primero) primero.focus();
  return { cerrar, panel };
}

/** Pide la contraseña otra vez en una hoja; devuelve el texto o null si se cancela */
function pedirClave() {
  return new Promise(resolver => {
    const msg = h('div', { class: 'oculto', role: 'alert' });
    const campo = h('input', { class: 'entrada', type: 'password', autocomplete: 'current-password', 'aria-label': 'Contraseña' });
    let listo = false;
    const terminar = valor => { if (listo) return; listo = true; q.cerrar(); resolver(valor); };
    const ok = h('button', { class: 'btn btn-primario', type: 'button', onclick: () => {
      if (!campo.value) { msg.className = 'aviso-err'; msg.textContent = 'Escribe tu contraseña.'; return; }
      terminar(campo.value);
    } }, 'Confirmar');
    const no = h('button', { class: 'btn', type: 'button', onclick: () => terminar(null) }, 'Cancelar');
    const q = hoja([h('h2', null, 'Confirma tu contraseña'),
      h('p', { class: 'sub' }, 'Para mantener la sesión siempre abierta escribe tu contraseña otra vez.'),
      campo, msg, h('div', { class: 'acciones dos' }, no, ok)], { cerrable: false });
    campo.addEventListener('keydown', e => { if (e.key === 'Enter') ok.click(); });
  });
}

function interruptor(activo, alCambiar, etiqueta) {
  const b = h('button', { class: 'interruptor', type: 'button', role: 'switch', 'aria-checked': String(!!activo), 'aria-label': etiqueta });
  b.addEventListener('click', async () => {
    const nuevo = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', String(nuevo));
    try { await alCambiar(nuevo); } catch (e) { b.setAttribute('aria-checked', String(!nuevo)); }
  });
  return b;
}

/* ============================================================================
   2. CAPA `api`  (ÚNICO punto de acceso a datos; todo con fetch() al servidor)
      - 401 -> evento 'sesion-terminada' (vuelve al inicio de sesión).
      - 403 -> ErrorApi con el mensaje "Sin permiso ..." (no se cierra la sesión).
      - Sin red -> ErrorApi(0, 'SIN_CONEXION') y las vistas ofrecen "Reintentar".
   ============================================================================ */
class ErrorApi extends Error {
  constructor(estado, codigo, mensaje) { super(mensaje); this.estado = estado; this.codigo = codigo; }
}

const sesionLocal = {   // lo único que se guarda en el teléfono: el token y su caducidad (informativa)
  leer() { try { return JSON.parse(almacen.get('pv.sesion')); } catch (e) { return null; } },
  guardar(token, expira, permanente) { almacen.set('pv.sesion', JSON.stringify({ token, expira, permanente })); },
  borrar() { almacen.del('pv.sesion'); },
};

async function peticion(metodo, ruta, cuerpo, { conToken = true } = {}) {
  const cab = { 'Accept': 'application/json' };
  if (cuerpo !== undefined) cab['Content-Type'] = 'application/json';
  const s = sesionLocal.leer();
  if (conToken && s && s.token) cab['Authorization'] = 'Bearer ' + s.token;
  let r, datos = null;
  // 503 OCUPADO: la computadora ya atiende otras consultas pesadas; se reintenta solo, con pausa creciente
  for (let intento = 0; ; intento++) {
    try {
      r = await fetch(ruta, { method: metodo, headers: cab, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo), cache: 'no-store' });
    } catch (e) {
      throw new ErrorApi(0, 'SIN_CONEXION', 'No hay conexión con el servidor. Revisa que estés en la misma red Wi-Fi.');
    }
    datos = null;
    try { datos = await r.json(); } catch (e) { /* sin cuerpo JSON */ }
    if (r.status !== 503 || !datos || datos.codigo !== 'OCUPADO' || intento >= 4) break;
    await new Promise(listo => setTimeout(listo, 700 * (intento + 1) + Math.random() * 300));
  }
  if (!r.ok) {
    const err = new ErrorApi(r.status, datos && datos.codigo, (datos && datos.error) || 'Error ' + r.status);
    if (r.status === 401 && err.codigo === 'SESION_INVALIDA') document.dispatchEvent(new CustomEvent('sesion-terminada'));
    throw err;
  }
  return datos;
}

const api = {
  /* ---------- Autenticación (REAL) ---------- */
  login: (usuario, contrasena, recordar = false) =>
    peticion('POST', '/api/login', { usuario, contrasena, recordar }, { conToken: false }),
  sesion: () => peticion('GET', '/api/sesion'),
  recordar: (recordar, contrasena) => peticion('POST', '/api/sesion/recordar', { recordar, contrasena }),
  logout: () => peticion('POST', '/api/logout', {}),
  /** Código de un solo uso para pasar la sesión a la página segura ('seguro' -> {url}) o al icono de inicio ('inicio' -> {manifiesto}) */
  traspaso: destino => peticion('POST', '/api/sesion/traspaso', { destino }),
  /** Canjea el código (la sesión «se muda» aquí): devuelve la sesión con su token nuevo */
  canjear: codigo => peticion('POST', '/api/sesion/canjear', { codigo }, { conToken: false }),

  /* ---------- Recorrido guiado: la marca "ya lo vi" vive en la BD, por usuario ---------- */
  tutorial: () => peticion('GET', '/api/tutorial'),                              // -> { visto }
  tutorialVisto: (visto = true) => peticion('POST', '/api/tutorial/visto', { visto }),

  /* ---------- Datos de negocio (REALES) ---------- */

  /** periodo: 'dia' | 'semana' | 'mes'. Devuelve totales, comparación, top y franjas del día. */
  async estadisticas(periodo) {
    const d = await peticion('GET', '/api/estadisticas?periodo=' + encodeURIComponent(periodo));
    const c = d.comparacion;
    return {
      periodo, desde: d.desde, hasta: d.hasta,
      total: d.totales.total, tickets: d.totales.transacciones, promedio: d.totales.ticketPromedio,
      ganancia: d.gananciaVisible ? d.ganancia : null,
      variacion: c && c.variacionPct != null ? c.variacionPct / 100 : null,
      top: d.top.map(t => ({ nombre: t.descripcion, unidad: t.unidad || 'pza', cantidad: t.piezas, importe: t.importe })),
      franjas: d.franjas,
    };
  },

  /** desde/hasta: 'AAAA-MM-DD' (inclusive; máximo 93 días). Por páginas de 50, más recientes primero. */
  async ventas({ desde, hasta, pagina = 0 }) {
    const d = await peticion('GET', '/api/ventas?desde=' + encodeURIComponent(desde) + '&hasta=' + encodeURIComponent(hasta)
      + '&pagina=' + pagina);
    const r = d.ventas.map(v => ({
      id: v.id, folio: v.folio || String(v.id), fecha: new Date(v.fecha), cajero: v.cajero, pago: v.formaPago,
      cancelada: v.cancelada, total: v.total, devuelto: v.devuelto || 0,
      // `importe` ya trae descuento/promoción/mayoreo aplicados (cantidad × precio no cuadraría con el total)
      lineas: v.lineas.map(l => ({ nombre: l.descripcion, unidad: l.unidad || 'pza', cantidad: l.cantidad, precio: l.precio,
        importe: l.importe != null ? l.importe : l.cantidad * l.precio, devuelta: l.devuelta || 0 })),
    }));
    r.truncado = d.truncado; r.totalReal = d.total;
    r.hayMas = !!d.hayMas;
    r.totales = d.totales || { ventas: d.total, canceladas: 0, importe: r.filter(v => !v.cancelada).reduce((s, v) => s + v.total, 0) };
    return r;
  },

  async inventario(q = '') {
    const d = await peticion('GET', '/api/inventario?q=' + encodeURIComponent(q));
    const r = d.productos.map(p => ({
      id: p.id, codigo: p.codigo || '', nombre: p.descripcion, depto: p.departamento || '',
      precio: p.precio, costo: p.costo, stock: p.existencia, minimo: p.minimo, unidad: p.unidad,
      imagen: !!p.imagen, caducidad: !!p.caducidad,
    }));
    r.truncado = d.truncado; r.totalReal = d.total;
    return r;
  },

  /**
   * Foto del producto (o su miniatura) como URL de objeto (blob:). Las imágenes van con el
   * mismo token Bearer que el resto de la API, así que no se pueden poner directo en <img src>;
   * se bajan con fetch y se recuerdan en memoria. Devuelve null si no tiene o falla.
   */
  async imagenUrl(id, mini = false) {
    const clave = id + (mini ? ':m' : ':g');
    if (api._imagenes.has(clave)) return api._imagenes.get(clave);
    const s = sesionLocal.leer();
    let url = null;
    try {
      const r = await fetch('/api/productos/' + encodeURIComponent(id) + '/imagen' + (mini ? '?mini=1' : ''),
        { headers: s && s.token ? { 'Authorization': 'Bearer ' + s.token } : {} });
      if (r.ok) url = URL.createObjectURL(await r.blob());
    } catch (e) { /* sin red: sin foto */ }
    if (api._imagenes.size > 300) api._imagenes.clear();
    api._imagenes.set(clave, url);
    return url;
  },
  _imagenes: new Map(),

  /** Agenda de proveedores: hoy (según la computadora), permisos y la lista con días, próxima visita y nota media (si puede verla) */
  proveedores: () => peticion('GET', '/api/proveedores'),
  /** "Quién me debe": clientes con saldo (fiado), solo lectura */
  saldosClientes: () => peticion('GET', '/api/clientes/saldos'),
  /** Crea (sin id) o edita (con id) un proveedor: {id?, nombre, telefono, contacto, diasEntrega:[1..7], diasPreventa:[1..7], notas} */
  guardarProveedor: datos => peticion('POST', '/api/proveedores/guardar', datos),

  /** "Por caducar": {dias, lotes:[{id, productoId, producto, codigo, unidad, fecha:'AAAA-MM-DD', estimado, dias, caducado}]} */
  caducidades: () => peticion('GET', '/api/caducidades'),

  /** Avisos del día (campana): {hoy, total, avisos:[{id, tipo, tipoEtiqueta, prioridad, icono, titulo, detalle, accion}]}. El servidor los guarda 5 min. */
  avisos: () => peticion('GET', '/api/avisos'),

  /* ---------- Notificaciones push (solo tienen sentido abierta la página por HTTPS) ---------- */
  pushClave: () => peticion('GET', '/api/push/clave'),                                   // -> { clave } (VAPID pública, base64url)
  pushSuscribir: datos => peticion('POST', '/api/push/suscribir', datos),              // {endpoint, keys:{p256dh, auth}} -> { ok, suscripcion }
  pushDesuscribir: endpoint => peticion('POST', '/api/push/desuscribir', { endpoint }),
  pushEstado: endpoint => peticion('POST', '/api/push/estado', { endpoint }),          // -> preferencias; 404 si el servidor no la conoce
  pushPreferencias: datos => peticion('POST', '/api/push/preferencias', datos),        // {endpoint, activa, proveedores, stock, horaPico, caducidad, silencioDesde, silencioHasta}
  pushPrueba: endpoint => peticion('POST', '/api/push/prueba', { endpoint }),          // -> { ok, detalle }

  /** tipo: 'ENTRADA' (+), 'SALIDA' (-, merma) o 'CONTEO' (fija la existencia exacta) */
  async ajustarStock({ id, tipo, cantidad, motivo, proveedor, caducidad }) {
    const t = tipo === 'ENTRADA' ? 'entrada' : tipo === 'SALIDA' ? 'merma' : 'ajuste';
    const generico = ['ENTRADA', 'SALIDA', 'CONTEO'].includes(motivo);
    const texto = motivo && !generico ? motivo
      : t === 'entrada' ? 'Entrada registrada desde el móvil'
      : t === 'merma' ? 'Merma registrada desde el móvil' : 'Conteo físico desde el móvil';
    const d = await peticion('POST', '/api/inventario/ajuste', { productoId: id, tipo: t, cantidad, motivo: texto, proveedor,
      caducidad: t === 'entrada' && caducidad ? caducidad : undefined });
    return { id: d.producto.id, stock: d.producto.existencia };
  },

  /** Entradas de mercancía de un ticket: UNA petición real por línea; devuelve lo aplicado y lo que falló. */
  async aplicarTicket(lineas) {
    const fallidas = [];
    let aplicadas = 0;
    for (const l of lineas) {
      try {
        await api.ajustarStock({ id: l.pid, tipo: 'ENTRADA', cantidad: l.cantidad,
          motivo: 'Entrada por ticket de proveedor (móvil)', proveedor: 'Ticket de proveedor (móvil)' });
        aplicadas++;
      } catch (e) {
        if (e.estado === 401) throw e;
        fallidas.push({ nombre: l.nombre, mensaje: e.message });
      }
    }
    return { aplicadas, fallidas };
  },
};

/* ----------------------------------------------------------------------------
   GANCHO DE OCR  (DEMO: la lectura de la foto NO es real)
   ----------------------------------------------------------------------------
   Contrato: extraerLineas(archivoImagen: File) -> Promise<Array<{
       pid, nombre, unidad, cantidad, costo }>>
   HOY: ignora la imagen e inventa líneas de EJEMPLO con productos reales del
   inventario (los de menor existencia). Nada se aplica sin que el usuario
   marque cada línea. MAÑANA: enviar la foto al servidor y devolver sus líneas. */
const ocr = {
  async extraerLineas(archivoImagen) {
    await espera(1400);   // simula el tiempo de lectura
    const productos = (await api.inventario('')).slice(0, 4);
    const cantidades = [24, 48, 20, 12];
    return productos.map((p, i) => ({ pid: p.id, nombre: p.nombre, unidad: p.unidad, cantidad: cantidades[i], costo: p.costo || 0 }));
  },
};

/* ============================================================================
   3. ESTADO DE SESIÓN Y ARRANQUE
   ============================================================================ */
const raiz = document.getElementById('app');
const E = { sesion: null, vista: 'estadisticas', desfase: 0, temporizador: null, periodo: 'dia' };

/**
 * "#/inventario?buscar=Coca" -> { id: 'inventario', opciones: { buscar: 'Coca' } }. Lo usan el arranque,
 * el cambio de hash y las notificaciones (al tocarlas abren la sección del aviso). Solo se aceptan las
 * opciones que entienden las vistas, recortadas.
 */
function rutaDeHash(hash) {
  const h = String(hash || '').replace(/^[^#]*#\/?/, '');
  const q = h.indexOf('?');
  const id = (q < 0 ? h : h.slice(0, q)).slice(0, 30);
  const opciones = {};
  if (q >= 0) {
    for (const [k, v] of new URLSearchParams(h.slice(q + 1))) {
      if (k === 'proveedorId') { const n = Number(v); if (Number.isFinite(n) && n > 0) opciones.proveedorId = n; }
      else if (k === 'filtro' || k === 'buscar') opciones[k] = String(v).slice(0, 60);
    }
  }
  return { id, opciones };
}

function reciente(s) {   // guarda en el teléfono lo que dice el SERVIDOR
  E.sesion = s;
  E.desfase = (s.ahora || Date.now()) - Date.now();
  const actual = sesionLocal.leer() || {};
  sesionLocal.guardar(s.token || actual.token, s.expira, s.permanente);
}

function cerrarLocal(mensaje) {
  sesionLocal.borrar();
  E.sesion = null;
  clearInterval(E.temporizador);
  E.tutorialComprobado = false;
  avisos.reiniciar();
  notificaciones.reiniciar();
  document.querySelectorAll('.velo, .tuto-velo').forEach(v => v.remove());
  pantallaLogin(mensaje);
}

document.addEventListener('sesion-terminada', () => {
  if (E.sesion || sesionLocal.leer()) cerrarLocal('Tu sesión terminó. Inicia sesión de nuevo.');
});

async function arrancar() {
  // "#/avisos" (QR del escritorio) o "#traspaso=…&ir=avisos" (viene de la página normal o del icono de inicio):
  // se limpia la dirección (el código no debe quedarse a la vista ni en el historial) y se va a Ajustes.
  const especial = pasosAvisos.leerHash(location.hash);
  if (especial.traspaso || especial.avisos || location.hash.startsWith('#traspaso=')) {
    history.replaceState(null, '', '#/config');
    E.abrirAvisos = especial.avisos;
  }
  let s = sesionLocal.leer();
  if ((!s || !s.token) && especial.traspaso) {
    raiz.replaceChildren(cargando('Entrando…'));
    try {
      reciente(await api.canjear(especial.traspaso));
      entrarAlSistema();
      return;
    } catch (e) {
      return pantallaLogin(e.estado === 401 || e.estado === 429
        ? 'Escribe tu usuario y contraseña una vez más para terminar de activar los avisos.' : e.message);
    }
  }
  if (!s || !s.token) return pantallaLogin();
  // Comprobación local rápida; la decisión real la toma el servidor.
  if (s.expira && s.expira <= Date.now() + E.desfase) return cerrarLocal('Tu sesión terminó. Inicia sesión de nuevo.');
  raiz.replaceChildren(cargando('Verificando sesión…'));
  try {
    reciente(await api.sesion());
    entrarAlSistema();
  } catch (e) {
    if (e.estado === 401) return;                      // ya manejado por 'sesion-terminada'
    raiz.replaceChildren(h('div', { class: 'login' }, h('div', { class: 'login-caja' },
      h('div', { class: 'aviso-err', role: 'alert' }, e.message),
      h('button', { class: 'btn btn-primario btn-block', onclick: arrancar }, 'Reintentar'))));
  }
}

/** Revalida contra el servidor (permisos al día, caducidad). Devuelve false si ya no hay sesión. */
async function revalidar() {
  try { reciente(await api.sesion()); return true; }
  catch (e) { return e.estado !== 401; }   // sin red o error del servidor: no se cierra la sesión; 401 ya mostró el login
}

   ============================================================================ */
function pantallaLogin(mensaje) {
  const error = h('div', { class: mensaje ? 'aviso-err' : 'oculto', role: 'alert' }, mensaje || '');
  const usuario = h('input', { class: 'entrada', id: 'usuario', type: 'text', enterkeyhint: 'next', autocomplete: 'username',
    autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', required: true });
  const clave = h('input', { class: 'entrada', id: 'clave', type: 'password', enterkeyhint: 'go', autocomplete: 'current-password', required: true });
  const ver = h('button', { class: 'btn icono-btn', type: 'button', 'aria-label': 'Mostrar contraseña', 'aria-pressed': 'false' }, icono('ojo'));
  ver.addEventListener('click', () => {
    const visible = clave.type === 'password';
    clave.type = visible ? 'text' : 'password';
    ver.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
    ver.setAttribute('aria-pressed', String(visible));
    ver.replaceChildren(icono(visible ? 'ojoCerrado' : 'ojo'));
  });
  const entrar = h('button', { class: 'btn btn-primario btn-block', type: 'submit' }, 'Entrar');
  const form = h('form', { class: 'login-caja', novalidate: true },
    logoApp('logo', 72),
    h('div', null, h('h1', null, 'Caja Libre'), h('p', { class: 'sub' }, E.abrirAvisos
      ? 'Inicia sesión para activar los avisos en este teléfono'
      : 'Acceso móvil · inicia sesión con tu usuario')),
    error,
    h('div', { class: 'campo' }, h('label', { for: 'usuario' }, 'Usuario'), usuario),
    h('div', { class: 'campo' }, h('label', { for: 'clave' }, 'Contraseña'), h('div', { class: 'con-boton' }, clave, ver)),
    entrar);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const u = usuario.value.trim();
    if (!u || !clave.value) { mostrar('Escribe tu usuario y contraseña.'); return; }
    entrar.disabled = true; entrar.textContent = 'Entrando…';
    try {
      const claveUsada = clave.value;   // solo en memoria, para confirmar «mantener abierta»; se descarta al terminar
      const s = await api.login(u, claveUsada, false);
      clave.value = '';
      reciente(s);
      await preguntarMantener(claveUsada);
      entrarAlSistema();
    } catch (e) {
      mostrar(e.message);
      entrar.disabled = false; entrar.textContent = 'Entrar';
    }
  });
  function mostrar(t) { error.className = 'aviso-err'; error.textContent = t; }
  raiz.replaceChildren(h('div', { class: 'login' }, form));
  usuario.focus();
}

/** Pregunta obligatoria tras entrar: Sí = sin caducidad, No = 48 horas */
function preguntarMantener(claveUsada) {
  return new Promise(resolver => {
    const msg = h('div', { class: 'oculto', role: 'alert' });
    const elegir = async permanente => {
      si.disabled = no.disabled = true;
      try {
        if (permanente) reciente(await api.recordar(true, claveUsada));   // por defecto el servidor ya la dejó en 48 h
        h1.cerrar(); resolver();
      } catch (e) {
        msg.className = 'aviso-err'; msg.textContent = e.message; si.disabled = no.disabled = false;
        if (e.estado === 401) { h1.cerrar(); resolver(); }
      }
    };
    const si = h('button', { class: 'btn btn-primario', type: 'button', onclick: () => elegir(true) }, 'Sí, mantenerla abierta');
    const no = h('button', { class: 'btn', type: 'button', onclick: () => elegir(false) }, 'No, que dure 48 horas');
    const h1 = hoja([
      h('h2', null, '¿Mantener la sesión siempre abierta?'),
      h('p', { class: 'sub' }, 'Si eliges Sí, este teléfono no volverá a pedir tu contraseña mientras lo uses al menos una vez cada 60 días o hasta que cierres sesión. Si eliges No, la sesión se cerrará sola a las 48 horas.'),
      msg, h('div', { class: 'acciones' }, si, no),
    ], { cerrable: false });
  });
}

function entrarAlSistema() {

  }

  avisos.cargar();                                 // al entrar; después cada 10 min mientras la página esté visible

document.addEventListener('visibilitychange', () => { if (!document.hidden && E.sesion) { vigilar(); avisos.cargarSiToca(); } });
window.addEventListener('hashchange', () => {
  const r = rutaDeHash(location.hash);
  if (E.sesion && permitidas().some(s => s.id === r.id) && (r.id !== E.vista || Object.keys(r.opciones).length)) irA(r.id, r.opciones);
});

async function vigilar() {
  if (!E.sesion) return;
  if (E.sesion.expira && E.sesion.expira <= Date.now() + E.desfase) return cerrarLocal('Tu sesión terminó. Inicia sesión de nuevo.');
  await revalidar();   // si el servidor dice 401, 'sesion-terminada' cierra todo
  if (E.sesion) {
    pintarNav();
    if (!permitidas().some(s => s.id === E.vista)) irA(permitidas()[0].id);   // le quitaron un permiso
  }
}

function pintarNav() {
  vaciar(contNav);
  for (const s of permitidas()) {
    contNav.append(h('button', { type: 'button', 'data-id': s.id, 'aria-current': s.id === E.vista ? 'page' : null, onclick: () => irA(s.id) },
      h('span', { class: 'ico', 'aria-hidden': 'true' }, icono(s.icono)), s.etiqueta));
  }
}

/**
 * Cada cambio de sección vuelve a validar la sesión EN EL SERVIDOR (guardia de ruta).
 * `opciones` las recibe la vista (p. ej. un aviso abre Inventario ya filtrado o un proveedor concreto).
 */
async function irA(id, opciones = {}) {
  contVista.replaceChildren(cargando());
  if (!(await revalidar())) return;            // 401 => ya se mostró el login
  const s = permitidas().find(x => x.id === id);
  if (!s) {
    contVista.replaceChildren(h('div', { class: 'vacio' }, 'No tienes permiso para ver esta sección.'));
    return;
  }
  E.vista = id;
  history.replaceState(null, '', '#/' + id);
  tituloCab.textContent = s.titulo;
  pintarNav();
  try {
    contVista.replaceChildren(await s.vista(opciones || {}));
  } catch (e) {
    if (e.estado === 401) return;
    contVista.replaceChildren(h('div', { class: 'aviso-err', role: 'alert' }, e.message));
  }
  window.scrollTo(0, 0);
}

/* ============================================================================
   8. VISTA: HISTORIAL DE VENTAS  (requiere VER_HISTORIAL)

async function vistaHistorial() {
  const hoy = claveDia(new Date());
  const desde = h('input', { class: 'entrada', type: 'date', id: 'desde', value: hoy, max: hoy });
  const hasta = h('input', { class: 'entrada', type: 'date', id: 'hasta', value: hoy, max: hoy });
  const lista = h('div', { class: 'lista-rej' });
  const resumen = h('p', { class: 'sub' });

  const atajo = (t, f) => h('button', { class: 'btn btn-suave', type: 'button', onclick: () => { f(); cargar(); } }, t);
  const ayer = () => claveDia(sumarDias(new Date(), -1));
  const filtros = h('section', { class: 'tarjeta', style: 'display:grid;gap:.8rem' },
    h('div', { class: 'rejilla' },
      h('div', { class: 'campo' }, h('label', { for: 'desde' }, 'Desde'), desde),
      h('div', { class: 'campo' }, h('label', { for: 'hasta' }, 'Hasta'), hasta)),
    h('div', { class: 'rejilla r4' },
      atajo('Hoy', () => { desde.value = hasta.value = hoy; }),
      atajo('Ayer', () => { desde.value = hasta.value = ayer(); }),
      atajo('Últimos 7 días', () => { desde.value = claveDia(sumarDias(new Date(), -6)); hasta.value = hoy; }),
      atajo('Este mes', () => { const n = new Date(); desde.value = claveDia(new Date(n.getFullYear(), n.getMonth(), 1)); hasta.value = hoy; })));
  desde.addEventListener('change', cargar); hasta.addEventListener('change', cargar);

  let consulta = 0;              // cambia con cada filtro: descarta respuestas de una búsqueda anterior
  let pagina = 0;
  let vistos = new Set();       // ids ya pintados (si entran ventas nuevas entre páginas no se repiten)

  const filaVenta = v => h('button', { class: 'fila', type: 'button', onclick: () => detalleVenta(v) },
    h('div', { class: 'cuerpo' },
      h('div', { class: 't' }, 'Folio ' + v.folio, v.cancelada ? h('span', { class: 'insignia mal', style: 'margin-left:.5rem' }, 'Cancelada')
        : (v.devuelto > 0 ? h('span', { class: 'insignia', style: 'margin-left:.5rem' }, 'Con devolución') : null)),
      h('div', { class: 'd' }, fechaHora(v.fecha) + ' · ' + v.pago + ' · ' + v.cajero)),
    h('div', { class: 'der' }, dinero(v.total)));

  function botonMas(miConsulta) {
    const b = h('button', { class: 'btn btn-suave', type: 'button', style: 'width:100%;margin-top:.8rem' }, 'Cargar más');
    b.onclick = async () => {
      b.disabled = true; b.textContent = 'Cargando…';
      try {
        const ventas = await api.ventas({ desde: desde.value, hasta: hasta.value, pagina: pagina + 1 });
        if (miConsulta !== consulta) return;
        pagina++;
        b.remove();
        pintar(ventas, miConsulta);
      } catch (e) {
        if (miConsulta !== consulta || e.estado === 401) return;
        b.disabled = false; b.textContent = 'No se pudo cargar. Toca para reintentar';
      }
    };
    return b;
  }

  function pintar(ventas, miConsulta) {
    const nuevas = ventas.filter(v => !vistos.has(v.id));
    nuevas.forEach(v => vistos.add(v.id));
    lista.append(...nuevas.map(filaVenta));
    if (ventas.hayMas) lista.append(botonMas(miConsulta));
  }

  async function cargar() {
    if (!desde.value || !hasta.value) return;
    const miConsulta = ++consulta;
    if ((new Date(hasta.value) - new Date(desde.value)) / 86400000 + 1 > 93) { lista.replaceChildren(h('div', { class: 'aviso-err' }, 'El rango máximo es de 93 días.')); return; }
    if (desde.value > hasta.value) { lista.replaceChildren(h('div', { class: 'aviso-err' }, 'La fecha inicial no puede ser posterior a la final.')); return; }
    lista.replaceChildren(cargando());
    resumen.textContent = '';
    try {
      const ventas = await api.ventas({ desde: desde.value, hasta: hasta.value, pagina: 0 });
      if (miConsulta !== consulta) return;
      pagina = 0; vistos = new Set();
      // Totales del rango completo (calculados en la computadora), no solo de lo cargado
      const t = ventas.totales;
      resumen.textContent = t.ventas + ' venta(s) · ' + dinero(t.importe) + ' (sin canceladas)';
      if (!ventas.length) { lista.replaceChildren(h('div', { class: 'vacio' }, 'No hay ventas en ese rango.')); return; }
      lista.replaceChildren();
      pintar(ventas, miConsulta);
    } catch (e) { if (miConsulta === consulta && e.estado !== 401) lista.replaceChildren(errorConReintento(e, cargar)); }
  }
  cargar();
  return h('div', { class: 'pila' }, filtros, resumen, lista);
}

   ============================================================================ */
/** Miniatura de la lista: se baja solo cuando la fila entra en pantalla (hasta 200 filas por búsqueda) */
const observadorMiniaturas = ('IntersectionObserver' in window) ? new IntersectionObserver(entradas => {
  for (const e of entradas) {
    if (!e.isIntersecting) continue;
    observadorMiniaturas.unobserve(e.target);
    cargarMiniatura(e.target);
  }
}, { rootMargin: '200px' }) : null;
function cargarMiniatura(img) {
  api.imagenUrl(img.dataset.id, true).then(u => { if (u) img.src = u; else img.remove(); });
}
function miniaturaProducto(id) {
  const img = h('img', { class: 'miniatura', alt: '', 'data-id': id });
  if (observadorMiniaturas) observadorMiniaturas.observe(img); else cargarMiniatura(img);
  return img;
}
/** opciones: {filtro: 'todos'|'bajo'|'agotado'|'caducar', buscar: texto} (las manda un aviso de la campana) */
async function vistaInventario(opciones = {}) {
  let texto = typeof opciones.buscar === 'string' ? opciones.buscar.slice(0, 60) : '';
  let productos = await api.inventario(texto.trim());
  let filtro = ['todos', 'bajo', 'agotado', 'caducar'].includes(opciones.filtro) ? opciones.filtro : 'todos', pendiente = null, secuencia = 0;
  const lista = h('div', { class: 'lista-rej' });
  const busca = h('input', { class: 'entrada', type: 'search', inputmode: 'search', enterkeyhint: 'search', placeholder: 'Buscar producto o código', 'aria-label': 'Buscar producto', autocomplete: 'off', value: texto });
  const chips = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Filtrar' });
  const estado = p => p.stock <= 0 ? ['Agotado', 'mal'] : p.stock <= p.minimo ? ['Stock bajo', 'aviso'] : ['En existencia', 'ok'];

  function pintar() {
    vaciar(chips);
    for (const [k, t] of [['todos', 'Todos'], ['bajo', 'Stock bajo'], ['agotado', 'Agotados'], ['caducar', 'Por caducar']]) {
      chips.append(h('button', { type: 'button', 'aria-pressed': String(filtro === k), onclick: () => { filtro = k; pintar(); } }, t));
    }
    if (filtro === 'caducar') { pintarCaducidades(); return; }
    const vis = productos.filter(p =>
      filtro === 'todos' || (filtro === 'agotado' ? p.stock <= 0 : p.stock <= p.minimo));
    vaciar(lista);
    if (!vis.length) { lista.append(h('div', { class: 'vacio' }, 'No hay productos con ese filtro.')); return; }
    for (const p of vis) {
      const [et, clase] = estado(p);
      lista.append(h('button', { class: 'fila', type: 'button', onclick: () => hojaAjuste(p, pintar) },
        p.imagen ? miniaturaProducto(p.id) : null,
        h('div', { class: 'cuerpo' }, h('div', { class: 't' }, p.nombre), h('div', { class: 'd' }, p.depto + ' · mín. ' + num(p.minimo))),
        h('div', { class: 'der' }, num(p.stock) + ' ' + p.unidad, h('div', null, h('span', { class: 'insignia ' + clase }, et)))));
    }
  }
  /** Lo que caduca pronto (o ya caducó): la cantidad es un estimado que calcula la computadora */
  async function pintarCaducidades() {
    const mia = ++secuencia;
    lista.replaceChildren(cargando());
    try {
      const d = await api.caducidades();
      if (mia !== secuencia || filtro !== 'caducar') return;
      const t = texto.trim().toLowerCase();
      const vis = d.lotes.filter(l => !t || l.producto.toLowerCase().includes(t) || (l.codigo || '').includes(t));
      vaciar(lista);
      lista.append(h('p', { class: 'sub' }, 'Caduca en los próximos ' + d.dias + ' días o ya caducó. La cantidad es aproximada.'));
      if (!vis.length) { lista.append(h('div', { class: 'vacio' }, 'Nada por caducar.')); return; }
      for (const l of vis) {
        const cuando = l.dias < 0 ? (l.dias === -1 ? 'Caducó ayer' : 'Caducó hace ' + (-l.dias) + ' días')
          : l.dias === 0 ? 'Caduca hoy' : l.dias === 1 ? 'Caduca mañana' : 'Caduca en ' + l.dias + ' días';
        const f = fechaIso(l.fecha);
        lista.append(h('div', { class: 'fila' },
          h('div', { class: 'cuerpo' }, h('div', { class: 't' }, l.producto),
            h('div', { class: 'd' }, 'Caduca el ' + f.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }))),
          h('div', { class: 'der' }, '~' + num(l.estimado) + ' ' + l.unidad,
            h('div', null, h('span', { class: 'insignia ' + (l.caducado ? 'mal' : 'aviso') }, cuando)))));
      }
    } catch (e) { if (mia === secuencia && e.estado !== 401) lista.replaceChildren(errorConReintento(e, pintarCaducidades)); }
  }
  async function buscar() {   // la búsqueda la hace el servidor (hasta 200 productos por consulta)
    const mia = ++secuencia;
    lista.replaceChildren(cargando());
    try {
      const nuevos = await api.inventario(texto.trim());
      if (mia !== secuencia) return;   // llegó una búsqueda más reciente
      productos = nuevos;
      if (filtro === 'caducar') { pintarCaducidades(); return; }
      pintar();
      if (productos.truncado) lista.append(h('p', { class: 'sub', style: 'text-align:center;margin-top:.8rem' },
        'Hay ' + productos.totalReal + ' productos; se muestran los primeros ' + productos.length + '. Escribe más letras para acotar.'));
    } catch (e) { if (mia === secuencia && e.estado !== 401) lista.replaceChildren(errorConReintento(e, buscar)); }
  }
  busca.addEventListener('input', () => { texto = busca.value; clearTimeout(pendiente); pendiente = setTimeout(buscar, 300); });
  pintar();
  return h('div', { class: 'pila' }, busca, chips, lista);
}

  const campoCad = producto.caducidad ? h('div', { class: 'campo' }, h('label', { for: 'caduca' }, 'Caduca el (opcional)'), cad) : null;
  const err = h('div', { class: 'oculto', role: 'alert' });

  const pintarSeg = () => {
    vaciar(seg);
    for (const [k, t] of tipos) seg.append(h('button', { type: 'button', 'aria-pressed': String(tipo === k), onclick: () => { tipo = k; pintarSeg(); } }, t));
    etCant.textContent = tipo === 'CONTEO' ? 'Existencia contada (' + producto.unidad + ')' : 'Cantidad (' + producto.unidad + ')';
    if (campoCad) campoCad.classList.toggle('oculto', tipo !== 'ENTRADA');
  };
  pintarSeg();
  const v = hoja([...info, seg, h('div', { class: 'campo' }, etCant, cant), campoCad, err,
    h('div', { class: 'acciones dos' }, h('button', { class: 'btn', type: 'button', onclick: () => v.cerrar() }, 'Cancelar'), guardar)]);
  guardar.addEventListener('click', async () => {
    const n = parseFloat(cant.value.replace(',', '.'));
    if (!isFinite(n) || n < 0 || cant.value.trim() === '') { err.className = 'aviso-err'; err.textContent = 'Captura una cantidad válida.'; return; }
    guardar.disabled = true; guardar.textContent = 'Guardando…';
    try {
      const nuevo = await api.ajustarStock({ id: producto.id, tipo, cantidad: n, motivo: tipo, caducidad: campoCad ? cad.value : '' });
      producto.stock = nuevo.stock;
      v.cerrar(); vibrar(30); avisar('Inventario actualizado: ' + num(nuevo.stock) + ' ' + producto.unidad);
      alGuardar();
    } catch (e) {
      if (e.estado === 401) { v.cerrar(); return; }
      err.className = 'aviso-err'; err.textContent = e.estado === 403 ? 'Sin permiso. ' + e.message : e.message;
      guardar.disabled = false; guardar.textContent = 'Guardar ajuste';
    }
  });
}

/* ============================================================================
   9b. VISTA: PROVEEDORES  (ver: todos · nota media: VER_GANANCIAS o GESTIONAR_PROVEEDORES
       · crear/editar días: GESTIONAR_PROVEEDORES; el servidor decide en cada petición)
       - Calendario de ESTA semana (lunes a domingo, hoy resaltado) con entregas y preventas.
       - Lista con próxima visita, nota media (gasto promedio por visita) y teléfono.
       - "Hoy"/"Mañana" se calculan contra el `hoy` que manda la computadora, no el del teléfono.
   ============================================================================ */
const DIAS_CORTOS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];                     // índice 0 = lunes (ISO 1)
const DIAS_LARGOS = ['lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const fechaIso = iso => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d); };   // fecha local, sin zona
const diasEntre = (a, b) => Math.round((inicioDia(b) - inicioDia(a)) / 86400000);
const diaIso = f => (f.getDay() + 6) % 7 + 1;                                              // 1 = lunes … 7 = domingo
const mayuscula = t => t.charAt(0).toUpperCase() + t.slice(1);

/** "Hoy" / "Mañana" / "Jue 20" (corto) o "hoy" / "mañana" / "el jueves 20" (largo) relativo al hoy de la computadora */
function cuando(iso, hoyIso, largo = false) {
  if (!iso) return largo ? 'sin día fijo' : '—';
  const f = fechaIso(iso), n = diasEntre(fechaIso(hoyIso), f);
  if (n === 0) return largo ? 'hoy' : 'Hoy';
  if (n === 1) return largo ? 'mañana' : 'Mañana';
  return largo ? 'el ' + DIAS_LARGOS[diaIso(f) - 1] + ' ' + f.getDate() : DIAS_CORTOS[diaIso(f) - 1] + ' ' + f.getDate();
}

/** Fila de 7 días. Con `editable` son botones que se prenden y apagan; si no, solo muestra. */
function selectorDias(etiqueta, seleccion, { preventa = false, editable = false } = {}) {
  const cont = h('div', { class: 'dias' + (editable ? '' : ' lectura'), role: 'group', 'aria-label': etiqueta });
  for (let i = 1; i <= 7; i++) {
    const clase = () => 'dia-chip' + (preventa ? ' pre' : '') + (seleccion.has(i) ? ' on' : '');
    if (!editable) {
      cont.append(h('span', { class: clase(), 'aria-label': DIAS_LARGOS[i - 1] + (seleccion.has(i) ? ': sí' : ': no') }, DIAS_CORTOS[i - 1]));
      continue;
    }
    const b = h('button', { type: 'button', class: clase(), 'aria-pressed': String(seleccion.has(i)), onclick: () => {
      if (seleccion.has(i)) seleccion.delete(i); else seleccion.add(i);
      b.className = clase(); b.setAttribute('aria-pressed', String(seleccion.has(i)));
    } }, DIAS_CORTOS[i - 1]);
    cont.append(b);
  }
  return cont;
}

const telefonoLimpio = t => (t || '').replace(/[^0-9+]/g, '');

/** opciones: {proveedorId} abre de entrada el detalle de ese proveedor (lo manda un aviso de la campana) */
async function vistaProveedores(opciones = {}) {
  let agenda = await api.proveedores();
  let seleccionado = agenda.hoy;                 // día del calendario que se detalla abajo (AAAA-MM-DD)
  const caja = h('div', { class: 'pila' });
  const puedeEditar = () => !!agenda.puedeEditar;

  /** Lunes a domingo de la semana de `hoy`, con quién entrega y quién pasa a preventa cada día */
  function semana() {
    const hoy = fechaIso(agenda.hoy), lunes = sumarDias(hoy, 1 - diaIso(hoy));
    return Array.from({ length: 7 }, (x, i) => {
      const f = sumarDias(lunes, i), iso = claveDia(f), d = i + 1;
      return { iso, fecha: f, hoy: iso === agenda.hoy,
        entregas: agenda.proveedores.filter(p => p.diasEntrega.includes(d)),
        preventas: agenda.proveedores.filter(p => p.diasPreventa.includes(d)) };
    });
  }

  function tarjetaSemana() {
    const dias = semana();
    const rejilla = h('div', { class: 'semana', role: 'group', 'aria-label': 'Días de esta semana' });
    const detalle = h('div', { class: 'sem-detalle' });
    const pintarDetalle = () => {
      const d = dias.find(x => x.iso === seleccionado) || dias[0];
      const visita = (p, pre) => h('button', { class: 'visita' + (pre ? ' pre' : ''), type: 'button', onclick: () => detalleProveedor(p) },
        h('span', { class: 'ico-tipo', 'aria-hidden': 'true' }, icono(pre ? 'pedido' : 'camion', { tamano: 18 })),
        h('span', { class: 'n' }, p.nombre), h('span', { class: 'q' }, pre ? 'preventa' : 'entrega'));
      anexar(vaciar(detalle), [   // anexar() aplana listas y omite null (replaceChildren los pintaría como texto)
        h('div', { class: 'sem-titulo' }, (d.hoy ? 'Hoy, ' : '') + mayuscula(DIAS_LARGOS[diaIso(d.fecha) - 1]) + ' ' + d.fecha.getDate()),
        d.entregas.length || d.preventas.length
          ? [d.entregas.map(p => visita(p, false)), d.preventas.map(p => visita(p, true))]
          : h('p', { class: 'sub' }, 'No hay visitas programadas este día.')]);
    };
    const marca = (n, pre, et) => n ? h('span', { class: pre ? 'pre' : null, 'aria-label': n + ' ' + et }, icono(pre ? 'pedido' : 'camion', { tamano: 11 }), String(n)) : null;
    for (const d of dias) {
      const b = h('button', { type: 'button', class: 'sem-dia' + (d.hoy ? ' hoy' : ''), 'aria-pressed': String(d.iso === seleccionado),
        'aria-label': DIAS_LARGOS[diaIso(d.fecha) - 1] + ' ' + d.fecha.getDate() + (d.hoy ? ' (hoy)' : ''),
        onclick: () => { seleccionado = d.iso; for (const o of rejilla.children) o.setAttribute('aria-pressed', String(o === b)); pintarDetalle(); } },
        h('span', { class: 'sem-n' }, d.hoy ? 'Hoy' : DIAS_CORTOS[diaIso(d.fecha) - 1]),
        h('span', { class: 'sem-f' }, String(d.fecha.getDate())),
        h('span', { class: 'sem-m' }, marca(d.entregas.length, false, 'entrega(s)'), marca(d.preventas.length, true, 'preventa(s)')));
      rejilla.append(b);
    }
    pintarDetalle();
    return h('section', { class: 'tarjeta' },
      h('div', { class: 'seccion-t' }, 'Esta semana'),
      rejilla, detalle,
      h('div', { class: 'leyenda' },
        h('span', null, icono('camion', { tamano: 14 }), 'Entrega: llega la mercancía'),
        h('span', null, icono('pedido', { tamano: 14 }), 'Preventa: pasa el vendedor a tomar el pedido')));
  }

  function filaProveedor(p) {
    const proxEnt = p.proximaEntrega, proxPre = p.proximaPreventa;
    let proximo = null, tipo = '';
    if (proxEnt && (!proxPre || proxEnt <= proxPre)) { proximo = proxEnt; tipo = 'entrega'; }
    else if (proxPre) { proximo = proxPre; tipo = 'preventa'; }
    const dias = 'Entrega: ' + p.etiquetaEntrega + (p.diasPreventa.length ? ' · Preventa: ' + p.etiquetaPreventa : '');
    const nota = !agenda.costosVisibles ? null
      : h('div', { class: 'd' }, 'Promedio que le compras por visita: ' + (p.notaMedia ? dinero(p.notaMedia.promedio) + ' (' + p.notaMedia.notas + (p.notaMedia.notas === 1 ? ' visita)' : ' visitas)') : 'sin datos aún'));
    return h('button', { class: 'fila', type: 'button', onclick: () => detalleProveedor(p) },
      h('div', { class: 'cuerpo' }, h('div', { class: 't' }, p.nombre), h('div', { class: 'd' }, dias), nota),
      h('div', { class: 'der' }, proximo

  function pintar() {

  }

  async function recargar() {
    try { agenda = await api.proveedores(); pintar(); }
    catch (e) { if (e.estado !== 401) caja.replaceChildren(errorConReintento(e, recargar)); }
  }

  function detalleProveedor(p) {
    const tel = telefonoLimpio(p.telefono);
    const prox = (et, iso, aplica) => h('div', { class: 'prox' }, h('span', { class: 'q' }, et),
      h('span', null, !aplica ? 'No manda preventa' : iso ? mayuscula(cuando(iso, agenda.hoy, true)) : 'Sin días fijos'));
    const nota = !agenda.costosVisibles ? null : h('div', { class: 'kpi' },
      h('div', { class: 'e' }, 'Promedio que le compras por visita'),
      h('div', { class: 'v' }, p.notaMedia ? dinero(p.notaMedia.promedio) : 'Sin datos aún'),
      h('div', { class: 'sub' }, p.notaMedia
        ? 'Promedio de ' + p.notaMedia.notas + (p.notaMedia.notas === 1 ? ' visita' : ' visitas') + ' con compra en ' + agenda.ventanaDias + ' días · última el ' + fechaLarga(fechaIso(p.notaMedia.ultima))
        : 'Se calcula con las entradas de mercancía que tengan costo.'));
    const d = hoja([
      h('h2', null, p.nombre),
      p.contacto ? h('p', { class: 'sub' }, 'Contacto: ' + p.contacto) : null,
      tel ? h('a', { class: 'btn btn-suave btn-block', href: 'tel:' + tel }, icono('telefono', { tamano: 20 }), 'Llamar · ' + p.telefono) : h('p', { class: 'sub' }, 'Sin teléfono registrado.'),
      h('div', { class: 'campo' }, h('label', null, 'Días de entrega'), selectorDias('Días de entrega', new Set(p.diasEntrega))),
      p.diasPreventa.length ? h('div', { class: 'campo' }, h('label', null, 'Días de preventa'), selectorDias('Días de preventa', new Set(p.diasPreventa), { preventa: true })) : null,
      h('div', null, prox('Próxima entrega', p.proximaEntrega, true), prox('Próxima preventa', p.proximaPreventa, p.diasPreventa.length > 0)),
      h('p', { class: 'sub' }, 'Productos que surte: ' + (p.productosQueSurte || 0) + (p.productosQueSurte ? '' : ' (se asigna en Productos, o con la primera entrada de mercancía)')),
      nota,
      p.notas ? h('p', { class: 'sub' }, p.notas) : null,
      h('div', { class: puedeEditar() ? 'acciones dos' : 'acciones' },
        h('button', { class: 'btn', type: 'button', onclick: () => d.cerrar() }, 'Cerrar'),
        puedeEditar() ? h('button', { class: 'btn btn-primario', type: 'button', onclick: () => { d.cerrar(); formularioProveedor(p); } }, icono('lapiz', { tamano: 18 }), 'Editar') : null),
    ]);
  }

  function formularioProveedor(p) {
    const entrega = new Set(p ? p.diasEntrega : []), preventa = new Set(p ? p.diasPreventa : []);
    const nombre = h('input', { class: 'entrada', id: 'pv-nombre', type: 'text', maxlength: '150', autocomplete: 'organization', value: p ? p.nombre : '' });
    const telefono = h('input', { class: 'entrada', id: 'pv-tel', type: 'tel', maxlength: '30', inputmode: 'tel', autocomplete: 'off', placeholder: 'ej: 55 1234 5678', value: p ? p.telefono : '' });
    const contacto = h('input', { class: 'entrada', id: 'pv-contacto', type: 'text', maxlength: '100', autocomplete: 'off', placeholder: 'Nombre de quien visita', value: p ? p.contacto : '' });

    const err = h('div', { class: 'oculto', role: 'alert' });

      h('div', { class: 'campo' }, h('label', { for: 'pv-contacto' }, 'Contacto o repartidor'), contacto),
      h('div', { class: 'campo' }, h('label', null, 'Días de entrega (llega la mercancía)'), selectorDias('Días de entrega', entrega, { editable: true })),
      h('div', { class: 'campo' }, h('label', null, 'Días de preventa (pasa el vendedor a tomar el pedido)'), selectorDias('Días de preventa', preventa, { preventa: true, editable: true }),

      err,
      h('div', { class: 'acciones dos' }, h('button', { class: 'btn', type: 'button', onclick: () => f.cerrar() }, 'Cancelar'), guardar),
    ]);
    guardar.addEventListener('click', async () => {
      if (!nombre.value.trim()) { err.className = 'aviso-err'; err.textContent = 'Escribe el nombre del proveedor.'; nombre.focus(); return; }
      guardar.disabled = true; guardar.textContent = 'Guardando…';
      try {
        const r = await api.guardarProveedor({ id: p ? p.id : null, nombre: nombre.value, telefono: telefono.value, contacto: contacto.value,
          diasEntrega: [...entrega].sort(), diasPreventa: [...preventa].sort(), notas: notas.value });
        f.cerrar(); vibrar(30);
        avisar((r.creado ? 'Proveedor agregado: ' : 'Proveedor actualizado: ') + (r.proveedor ? r.proveedor.nombre : nombre.value.trim()));
        await recargar();
      } catch (e) {
        if (e.estado === 401) { f.cerrar(); return; }
        err.className = 'aviso-err'; err.textContent = e.estado === 403 ? 'Sin permiso. ' + e.message : e.message;
        guardar.disabled = false; guardar.textContent = 'Guardar';
      }
    });
  }

  pintar();
  if (opciones.proveedorId != null) {
    const p = agenda.proveedores.find(x => x.id === opciones.proveedorId);
    if (p) setTimeout(() => detalleProveedor(p), 0);   // ya con la vista puesta, para que al cerrar quede la agenda detrás
  }
  return caja;
}

/* ============================================================================
   10. VISTA: ESCANEAR TICKET DE PROVEEDOR (MAQUETA)
       - <input type="file" accept="image/*" capture="environment"> abre la
