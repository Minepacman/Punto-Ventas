   ============================================================================ */
async function vistaEscanear() {
  const caja = h('div', { class: 'estrecho', style: 'display:grid;gap:1rem' });
  let urlPrevia = null;
  const liberar = () => { if (urlPrevia) { URL.revokeObjectURL(urlPrevia); urlPrevia = null; } };

  function inicio() {
    liberar();
    const entrada = h('input', { class: 'entrada-oculta', id: 'foto', type: 'file', accept: 'image/*', capture: 'environment' });
    entrada.addEventListener('change', () => { if (entrada.files && entrada.files[0]) vistaPrevia(entrada.files[0]); });
    caja.replaceChildren(
      h('p', { class: 'sub' }, 'Toma una foto del ticket o factura del proveedor para dar entrada a la mercancía en el inventario.'),
      h('label', { class: 'tomar', for: 'foto' },
        h('div', { class: 'grande', 'aria-hidden': 'true' }, icono('camara', { tamano: 48 })),
        h('div', { class: 'titulo' }, 'Tomar foto del ticket'),
        h('div', { class: 'sub' }, 'Se abrirá la cámara del teléfono')),
      entrada,
      h('div', { class: 'aviso-ok', style: 'background:var(--warning-subtle);color:var(--warning-text)' },
        'DEMO: la lectura de la foto es simulada. Se mostrarán líneas de ejemplo con productos de tu inventario y NADA se aplica hasta que marques cada línea y confirmes.'));
  }

  function vistaPrevia(archivo) {
    liberar();
    urlPrevia = URL.createObjectURL(archivo);
    const procesar = h('button', { class: 'btn btn-primario btn-block', type: 'button' }, 'Procesar ticket');
    procesar.addEventListener('click', () => procesarTicket(archivo));
    caja.replaceChildren(
      h('img', { class: 'previa', src: urlPrevia, alt: 'Foto del ticket' }),
      procesar,
      h('button', { class: 'btn btn-block', type: 'button', onclick: inicio }, 'Tomar otra foto'));
  }

  async function procesarTicket(archivo) {
    const paso = h('span', null, 'Leyendo el ticket…');
    caja.replaceChildren(h('div', { class: 'tarjeta cargando' }, h('div', { class: 'rueda' }), h('div', { class: 'paso' }, paso)));
    try {
      const lineas = await ocr.extraerLineas(archivo);     // <-- AQUÍ entra el OCR real
      liberar();
      pantallaLineas(lineas);
    } catch (e) {
      caja.replaceChildren(h('div', { class: 'aviso-err', role: 'alert' }, e.message),
        h('button', { class: 'btn btn-block', type: 'button', onclick: inicio }, 'Intentar de nuevo'));
    }
  }
  function pantallaLineas(lineas) {
    const marcas = lineas.map(() => h('input', { type: 'checkbox', style: 'width:1.4rem;height:1.4rem;flex:none' }));
    const aplicar = h('button', { class: 'btn btn-primario btn-block', type: 'button' }, 'Aplicar las líneas marcadas');
    const resumen = h('p', { class: 'sub', role: 'status' });
    const marcadas = () => lineas.filter((l, i) => marcas[i].checked);
    const filas = lineas.map((l, i) => h('label', { class: 'linea', style: 'display:flex;gap:.7rem;align-items:center' },
      marcas[i],
      h('div', { class: 'n', style: 'flex:1' }, h('div', null, l.nombre), h('div', { class: 's' }, '+' + num(l.cantidad) + ' ' + l.unidad + ' (ejemplo)'))));
    aplicar.addEventListener('click', async () => {
      const elegidas = marcadas();
      if (!elegidas.length) { resumen.textContent = 'No marcaste ninguna línea: no se cambió el inventario.'; return; }
      aplicar.disabled = true; aplicar.textContent = 'Aplicando…';
      try {
        const r = await api.aplicarTicket(elegidas);
        caja.replaceChildren(
          r.aplicadas ? h('div', { class: 'aviso-ok', role: 'status' }, r.aplicadas + ' entrada(s) registrada(s) en el inventario') : null,
          r.fallidas.length ? h('div', { class: 'aviso-err', role: 'alert' }, 'No se pudieron aplicar: ' + r.fallidas.map(f => f.nombre + ' (' + f.mensaje + ')').join('; ')) : null,
          h('button', { class: 'btn btn-primario btn-block', type: 'button', onclick: inicio }, 'Escanear otro ticket'));
        if (r.aplicadas) vibrar(40);
      } catch (e) {
        if (e.estado === 401) return;
        aplicar.disabled = false; aplicar.textContent = 'Aplicar las líneas marcadas';
        resumen.textContent = e.estado === 403 ? 'Sin permiso. ' + e.message : e.message;
      }
    });
    caja.replaceChildren(
      h('div', { class: 'aviso-ok', style: 'background:var(--warning-subtle);color:var(--warning-text)' },
        'DEMO: estas líneas son de ejemplo, no salen de tu foto. Marca solo las que quieras registrar como entrada real.'),
      h('section', { class: 'tarjeta' }, h('div', { class: 'seccion-t' }, 'Líneas de ejemplo'),
        lineas.length ? filas : h('p', { class: 'vacio' }, 'No hay productos en el inventario para el ejemplo.')),
      resumen, lineas.length ? aplicar : null,
      h('button', { class: 'btn btn-block', type: 'button', onclick: inicio }, 'Descartar'));
  }
  inicio();
  return caja;
}

   11. VISTA: CONFIGURACIÓN (preferencias + cerrar sesión)

  const vence = h('div', { class: 'd' });

    const a = E.sesion;
    vence.textContent = a.permanente ? 'Sesión permanente en este teléfono (se cierra tras 60 días sin usarla).'
      : 'Se cerrará el ' + new Date(a.expira).toLocaleString('es-MX', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + ' (48 horas).';

  const segTema = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Tema' });
  const pintarTema = () => {
    vaciar(segTema);

    const q = hoja([h('h2', null, '¿Cerrar sesión?'), h('p', { class: 'sub' }, 'Tendrás que escribir tu usuario y contraseña para volver a entrar.'),

        h('button', { class: 'btn btn-peligro', type: 'button', onclick: async () => {
          await notificaciones.alCerrarSesion();   // este teléfono deja de recibir los avisos de este usuario

  return h('div', { class: 'cfg', style: 'display:grid;gap:1rem' },
    notificaciones.tarjeta(),
    h('section', { class: 'tarjeta' },
      h('div', { class: 'titulo' }, s.nombre),
      h('div', { class: 'sub' }, s.rolEtiqueta + ' · usuario ' + s.usuario)),
    h('section', { class: 'tarjeta' },
      h('div', { class: 'seccion-t' }, 'Sesión'),
      h('div', { class: 'fila-conf' },
        h('div', null, h('div', { class: 't' }, 'Mantener la sesión siempre abierta'), vence),
        interruptor(s.permanente, async v => {
          const clave = v && !E.sesion.permanente ? await pedirClave() : null;   // subir a permanente exige la contraseña
          if (v && !E.sesion.permanente && clave === null) throw new Error('cancelado');
          reciente(await api.recordar(v, clave)); pintarVence();
        }, 'Mantener la sesión siempre abierta'))),
    h('section', { class: 'tarjeta' },
      h('div', { class: 'seccion-t' }, 'Preferencias'),
      h('div', { class: 'fila-conf', style: 'display:grid' }, h('div', { class: 't' }, 'Tema'), segTema),

        h('div', null, h('div', { class: 't' }, 'Texto grande'), h('div', { class: 'd' }, 'Aumenta el tamaño de letra de toda la página.')),

/* ============================================================================
   11b. AVISOS (la campana de la cabecera)
       - GET /api/avisos al entrar y cada 10 minutos mientras la página esté visible
         (el servidor los calcula y guarda 5 min). Los mismos avisos llegan como
         notificaciones del teléfono si se activan en Ajustes (objeto `notificaciones`).
       - Hoja agrupada por tipo (proveedores, se está acabando, hora pico); tocar un
         aviso lleva a su sección. Los descartados se recuerdan EN EL TELÉFONO por
         usuario y por día (almacen, con try/catch): mañana vuelven si siguen vigentes.
   ============================================================================ */
const avisos = {
  datos: null, ultimaCarga: 0, cargando: null, globo: null, botonEl: null, hojaAbierta: null, temporizador: null,
  CADA_MS: 10 * 60 * 1000,
  ORDEN_TIPOS: ['PROVEEDOR', 'STOCK', 'GANANCIA', 'CADUCIDAD', 'HORA_PICO'],
  ICONO_TIPO: { PROVEEDOR: 'camion', STOCK: 'paquete', GANANCIA: 'sube', CADUCIDAD: 'calendario', HORA_PICO: 'reloj' },

  claveLocal: () => 'pv.avisos.' + (E.sesion ? E.sesion.usuario : ''),

  boton() {
    avisos.globo = h('span', { class: 'globo oculto', 'aria-hidden': 'true' });
    avisos.botonEl = h('button', { class: 'btn-icono-cab', type: 'button', id: 'avisos', 'aria-label': 'Avisos', title: 'Avisos',
      onclick: () => avisos.abrir() }, icono('campana', { tamano: 26 }), avisos.globo);
    return avisos.botonEl;
  },

  reiniciar() {
    clearInterval(avisos.temporizador);
    avisos.temporizador = null;
    avisos.datos = null; avisos.ultimaCarga = 0; avisos.cargando = null;
    if (avisos.hojaAbierta) { avisos.hojaAbierta.cerrar(); avisos.hojaAbierta = null; }
  },

  programar() {
    clearInterval(avisos.temporizador);
    avisos.temporizador = setInterval(() => { if (!document.hidden && E.sesion) avisos.cargar(); }, avisos.CADA_MS);
  },

  /** Al volver a la pestaña: solo si ya pasaron los 10 minutos (el intervalo no corre con la página oculta en muchos teléfonos) */
  cargarSiToca() {
    if (Date.now() - avisos.ultimaCarga >= avisos.CADA_MS) avisos.cargar();
  },

  async cargar() {
    if (!E.sesion) return null;
    if (avisos.cargando) return avisos.cargando;
    avisos.cargando = (async () => {
      try {
        const d = await api.avisos();
        avisos.datos = d; avisos.ultimaCarga = Date.now();
        avisos.pintarGlobo();
        return d;
      } catch (e) {
        return null;   // sin red o sin sesión: se queda lo último que se vio; la sesión la vigila vigilar()
      } finally { avisos.cargando = null; }
    })();
    return avisos.cargando;
  },

  /** ids descartados HOY (según el "hoy" del servidor); otro día limpia la lista */
  descartados() {
    if (!avisos.datos) return new Set();
    try {
      const g = JSON.parse(almacen.get(avisos.claveLocal()) || 'null');
      if (g && g.dia === avisos.datos.hoy && Array.isArray(g.ids)) return new Set(g.ids.map(String));
    } catch (e) { /* valor corrupto: se ignora */ }
    return new Set();
  },
  guardarDescartados(set) {
    if (!avisos.datos) return;
    almacen.set(avisos.claveLocal(), JSON.stringify({ dia: avisos.datos.hoy, ids: [...set].slice(0, 200) }));
  },
  descartar(id) { const s = avisos.descartados(); s.add(String(id)); avisos.guardarDescartados(s); avisos.pintarGlobo(); },
  descartarTodos() { const s = avisos.descartados(); for (const a of avisos.lista()) s.add(String(a.id)); avisos.guardarDescartados(s); avisos.pintarGlobo(); },

  lista: () => (avisos.datos && Array.isArray(avisos.datos.avisos)) ? avisos.datos.avisos : [],
  pendientes() { const d = avisos.descartados(); return avisos.lista().filter(a => !d.has(String(a.id))); },

  pintarGlobo() {
    if (!avisos.globo || !avisos.botonEl) return;
    const n = avisos.pendientes().length;
    avisos.globo.textContent = n > 99 ? '99+' : String(n);
    avisos.globo.classList.toggle('oculto', n === 0);
    avisos.botonEl.setAttribute('aria-label', n ? 'Avisos: ' + n + ' pendiente(s)' : 'Avisos: ninguno pendiente');
  },

  /** Lleva a la sección del aviso (si el usuario puede verla) con las opciones que trae */
  ir(a) {
    const ac = a.accion;
    if (!ac || !ac.seccion || !permitidas().some(s => s.id === ac.seccion)) return;
    if (avisos.hojaAbierta) { avisos.hojaAbierta.cerrar(); avisos.hojaAbierta = null; }
    irA(ac.seccion, { proveedorId: ac.proveedorId, filtro: ac.filtro, buscar: ac.buscar });
  },

  async abrir() {
    if (!E.sesion) return;
    if (avisos.hojaAbierta) { avisos.hojaAbierta.cerrar(); avisos.hojaAbierta = null; }
    const cuerpo = h('div', { style: 'display:grid;gap:.6rem' });
    const pie = h('div', { class: 'acciones dos' });
    const q = hoja([h('h2', null, 'Avisos'), cuerpo, pie]);
    avisos.hojaAbierta = { cerrar: () => { q.cerrar(); avisos.hojaAbierta = null; } };

    const pintar = () => {
      const pend = avisos.pendientes();
      vaciar(cuerpo); vaciar(pie);
      if (!avisos.datos) {
        cuerpo.append(h('p', { class: 'vacio' }, 'No se pudieron cargar los avisos. Revisa la conexión con la computadora.'));
      } else if (!pend.length) {
        cuerpo.append(h('p', { class: 'vacio' }, avisos.lista().length
          ? 'Ya descartaste los avisos de hoy. Mañana aparecerán los nuevos.'
          : 'Sin avisos por ahora. Aquí verás qué proveedor viene hoy o mañana, qué productos se están acabando y la hora pico del día.'));
      } else {
        for (const tipo of avisos.ORDEN_TIPOS) {
          const del = pend.filter(a => a.tipo === tipo);
          if (!del.length) continue;
          cuerpo.append(h('div', { class: 'aviso-grupo', role: 'group', 'aria-label': del[0].tipoEtiqueta || tipo },
            h('div', { class: 'seccion-t' }, icono(avisos.ICONO_TIPO[tipo] || 'campana', { tamano: 16 }), del[0].tipoEtiqueta || tipo),
            del.map(a => {
              const puedeIr = !!(a.accion && a.accion.seccion && permitidas().some(s => s.id === a.accion.seccion));
              const ico = ICONOS[a.icono] ? a.icono : (avisos.ICONO_TIPO[tipo] || 'campana');
              return h('div', { class: 'aviso-item' + (a.prioridad === 1 ? ' alta' : a.prioridad >= 3 ? ' info' : '') },
                h('button', { class: 'aviso-ir', type: 'button', disabled: !puedeIr, onclick: () => avisos.ir(a) },
                  h('span', { class: 'ico-tipo', 'aria-hidden': 'true' }, icono(ico, { tamano: 18 })),
                  h('span', { class: 'cuerpo' }, h('span', { class: 't', style: 'display:block' }, a.titulo), a.detalle ? h('span', { class: 'd', style: 'display:block' }, a.detalle) : null)),
                h('button', { class: 'aviso-x', type: 'button', 'aria-label': 'Descartar: ' + a.titulo, title: 'Descartar por hoy',
                  onclick: () => { avisos.descartar(a.id); pintar(); } }, icono('cerrar', { tamano: 20 })));
            })));
        }
        if (avisos.datos.antiguedadSegundos >= 120) {
          cuerpo.append(h('p', { class: 'nota' }, 'Calculado hace ' + Math.round(avisos.datos.antiguedadSegundos / 60) + ' min; se actualiza cada 10 minutos.'));
        }
      }
      if (avisos.datos && !notificaciones.prefs && permitidas().some(s => s.id === 'config')) {
        cuerpo.append(h('button', { class: 'btn btn-suave', type: 'button', style: 'justify-self:start;min-height:44px',
          onclick: () => { if (avisos.hojaAbierta) avisos.hojaAbierta.cerrar(); irA('config'); } },
          icono('campana', { tamano: 18 }), 'Recibir estos avisos en el teléfono'));
      }
      pie.append(
        h('button', { class: 'btn', type: 'button', onclick: () => avisos.hojaAbierta && avisos.hojaAbierta.cerrar() }, 'Cerrar'),
        pend.length
          ? h('button', { class: 'btn btn-suave', type: 'button', onclick: () => { avisos.descartarTodos(); pintar(); } }, 'Descartar todos')
          : h('button', { class: 'btn btn-suave', type: 'button', onclick: async () => { cuerpo.replaceChildren(cargando()); await avisos.cargar(); pintar(); } }, 'Actualizar'));
    };
    if (!avisos.datos || Date.now() - avisos.ultimaCarga > 2 * 60 * 1000) {   // viejo o nunca cargado: refresca al abrir
      cuerpo.append(cargando('Buscando avisos…'));
      await avisos.cargar();
    }
    pintar();
  },
};

/* ============================================================================
   11c. NOTIFICACIONES (Web Push)
       - Requisitos que decide el navegador: página abierta por HTTPS (con el
         certificado de la tienda instalado: guía en /certificado), service worker
         /sw.js y permiso del usuario. En iPhone además la página debe estar en la
         pantalla de inicio (iOS 16.4+).
       - La suscripción (endpoint + claves) se manda al servidor con el token de la
         sesión; el servidor la guarda para ESTE usuario y decide qué y cuándo manda.
       - Las preferencias (tipos, horas de silencio) viven en el servidor, por teléfono.
       - Al cerrar sesión se avisa al servidor para que deje de mandar a este teléfono;
         la suscripción del navegador se conserva y se vuelve a ligar al entrar.
   ============================================================================ */
const notificaciones = {
  registro: null, suscripcion: null, prefs: null,
  SW: '/sw.js',

  soportado: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  esSeguro: () => location.protocol === 'https:',
  esIos: () => /iPhone|iPad|iPod/i.test(navigator.userAgent) || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1),
  instalada: () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,

  reiniciar() { notificaciones.prefs = null; notificaciones.suscripcion = null; },

  /** Registra el service worker (solo por HTTPS; en HTTP el navegador lo rechazaría) */
  async registrar() {
    if (!notificaciones.soportado() || !notificaciones.esSeguro()) return null;
    if (notificaciones.registro) return notificaciones.registro;
    try {
      // Con tope de tiempo: un navegador que nunca contesta no deja la tarjeta en «Revisando…»
      notificaciones.registro = await Promise.race([navigator.serviceWorker.register(notificaciones.SW, { scope: '/' }),
        new Promise((_, no) => setTimeout(() => no(new Error('tiempo')), 8000))]);
      return notificaciones.registro;
    } catch (e) { return null; }
  },

  /** Suscripción que ya tiene este navegador (o null) */
  async actual() {
    const r = await notificaciones.registrar();
    if (!r) return null;
    try { notificaciones.suscripcion = await r.pushManager.getSubscription(); } catch (e) { notificaciones.suscripcion = null; }
    return notificaciones.suscripcion;
  },

  base64aBytes(b64) {
    const normal = (b64 + '==='.slice((b64.length + 3) % 4)).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(normal);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  },

  /** Con un toque del usuario: pide permiso, se suscribe en el navegador y registra la suscripción en el servidor */
  async activar() {
    const permiso = await Notification.requestPermission();
    if (permiso !== 'granted') return permiso;
    const r = await notificaciones.registrar();
    if (!r) throw new Error('No se pudo preparar el servicio de notificaciones en este navegador.');
    const { clave } = await api.pushClave();
    const opciones = { userVisibleOnly: true, applicationServerKey: notificaciones.base64aBytes(clave) };
    let s = await r.pushManager.getSubscription();
    if (!s) {
      s = await r.pushManager.subscribe(opciones);
    } else {
      // Puede venir de otra clave del servidor (certificado o clave regenerados): se renueva
      try { await api.pushEstado(s.endpoint); } catch (e) { if (e.estado === 404) { await s.unsubscribe(); s = await r.pushManager.subscribe(opciones); } }
    }
    const j = s.toJSON();
    const d = await api.pushSuscribir({ endpoint: s.endpoint, keys: j.keys });
    notificaciones.suscripcion = s;
    notificaciones.prefs = d.suscripcion;
    return 'granted';
  },

  /** Quita la suscripción en el servidor y en el navegador */
  async desactivar() {
    const s = await notificaciones.actual();
    if (s) {
      try { await api.pushDesuscribir(s.endpoint); } catch (e) { /* sin red: se quita igual en el teléfono */ }
      try { await s.unsubscribe(); } catch (e) { /* ya no existía */ }
    }
    notificaciones.reiniciar();
  },

  /** Al entrar: si el navegador ya está suscrito y el servidor no lo sabe (otro usuario, restauración), lo registra de nuevo */
  async sincronizar() {
    try {
      if (!notificaciones.esSeguro() || !notificaciones.soportado() || Notification.permission !== 'granted') return;
      const s = await notificaciones.actual();
      if (!s) return;
      try { notificaciones.prefs = await api.pushEstado(s.endpoint); }
      catch (e) {
        if (e.estado !== 404) return;
        const j = s.toJSON();
        const d = await api.pushSuscribir({ endpoint: s.endpoint, keys: j.keys });
        notificaciones.prefs = d.suscripcion;
      }
    } catch (e) { /* sin red o sin soporte: la tarjeta de Ajustes lo mostrará */ }
  },

  /** Al cerrar sesión: el servidor deja de mandar a este teléfono (la suscripción del navegador se conserva) */
  async alCerrarSesion() {
    try {
      const s = notificaciones.suscripcion || await notificaciones.actual();
      if (s) await api.pushDesuscribir(s.endpoint);
    } catch (e) { /* sin red */ }
    notificaciones.reiniciar();
  },

  /** Dirección segura de esta misma computadora, según lo que informa el servidor */
  urlSegura() {
    const hs = E.sesion && E.sesion.https;
    if (!hs || !hs.activo || !hs.puerto) return null;
    return 'https://' + location.hostname + ':' + hs.puerto + '/';
  },
  urlCertificado() {
    const hs = E.sesion && E.sesion.https;
    const puerto = location.protocol === 'http:' ? location.port : (hs && hs.puertoHttp);
    return 'http://' + location.hostname + (puerto ? ':' + puerto : '') + '/certificado';
  },

  /** Tarjeta de Ajustes: el asistente «Recibir avisos en este teléfono» (solo muestra el siguiente paso) */
  tarjeta() {
    const seccion = h('section', { class: 'tarjeta asistente', id: 'notificaciones' });
    asistente.pintar(seccion);
    return seccion;
  },
};

/* ============================================================================
   11d. ASISTENTE «RECIBIR AVISOS EN ESTE TELÉFONO»
       - Una sola tarjeta (arriba en Ajustes; también la abre el QR del escritorio
         «#/avisos» y la campana) que muestra SOLO el siguiente paso, con «Paso N de M».
       - `pasosAvisos` son funciones PURAS (sin DOM ni red): deciden el paso a partir
         de lo que se detecta (plataforma, versión de iOS, página segura o no, página
         instalada, permiso, suscripción, si el teléfono ya acepta la llave de la
         tienda). Se prueban aparte; el resto solo pinta y reúne datos.
       - En la página normal (http) se «toca» la dirección segura de la misma
         computadora: si responde, el teléfono ya confía en la llave de la tienda.
       - «Continuar» muda la sesión a la página segura con un código de un solo uso
         en el fragmento de la URL (#traspaso=…): no se vuelve a pedir la contraseña.
   ============================================================================ */
/* PASOS-AVISOS:INICIO (funciones puras) */
const pasosAvisos = {
  /** 'ios' | 'android' | 'otro' (un iPad con «sitio de escritorio» dice Macintosh, pero es táctil) */
  plataforma(ua, toques) {
    const u = String(ua || '');
    if (/iPhone|iPad|iPod/i.test(u) || (/Macintosh/i.test(u) && Number(toques) > 1)) return 'ios';
    if (/Android/i.test(u)) return 'android';
    return 'otro';
  },
  /** [mayor, menor] de iOS / iPadOS, o null si el navegador no lo dice */
  versionIos(ua) {
    const u = String(ua || '');
    let m = /(?:iPhone|iPad|iPod)[^)]*? OS (\d+)[_.](\d+)/.exec(u);
    if (m) return [Number(m[1]), Number(m[2])];
    m = /Version\/(\d+)\.(\d+)/.exec(u);
    return m && /Macintosh|iPhone|iPad|iPod/.test(u) ? [Number(m[1]), Number(m[2])] : null;
  },
  /** Web Push en iPhone: iOS / iPadOS 16.4 o más reciente (si no se sabe, se intenta) */
  iosCompatible: v => !v || v[0] > 16 || (v[0] === 16 && v[1] >= 4),
  /** En iPhone solo Safari instala perfiles; Chrome/Firefox/Edge de iPhone dicen CriOS/FxiOS/EdgiOS */
  esSafari: ua => !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(String(ua || '')),
  /** Firefox de Android no usa las llaves instaladas en el teléfono */
  esFirefoxAndroid: ua => /Android/i.test(String(ua || '')) && /Firefox\//.test(String(ua || '')),
  /** Pasos con número (sin contar «listo» ni los avisos especiales) */
  lista: plataforma => plataforma === 'ios'
    ? ['descargar', 'instalar', 'confiar', 'abrir-segura', 'agregar-inicio', 'permitir']
    : ['descargar', 'instalar', 'abrir-segura', 'permitir'],
  /**
   * El siguiente paso. e = { plataforma, versionIos, seguro, instalada, soportado, permiso,
   * suscrito, httpsDisponible, llaveConfiable, avance }; avance = lo que el usuario marcó en
   * este teléfono ('' | 'descargada' | 'instalada'). Devuelve { paso, numero, total }:
   * numero 0 = paso sin número (listo o un problema que resolver).
   */
  siguiente(e) {
    const lista = pasosAvisos.lista(e.plataforma);
    const r = paso => ({ paso, numero: lista.indexOf(paso) + 1, total: lista.length });
    if (e.plataforma === 'ios' && !pasosAvisos.iosCompatible(e.versionIos)) return r('ios-viejo');
    if (e.seguro) {
      if (e.plataforma === 'ios' && !e.instalada) return r('agregar-inicio');
      if (!e.soportado) return r('no-soportado');
      if (e.permiso === 'denied') return r('bloqueado');
      if (e.permiso === 'granted' && e.suscrito) return r('listo');
      return r('permitir');
    }
    if (!e.httpsDisponible) return r('sin-https');
    if (e.llaveConfiable) return r('abrir-segura');
    if (e.plataforma === 'ios' && e.avance === 'instalada') return r('confiar');
    if (e.avance === 'descargada' || e.avance === 'instalada') return r('instalar');
    return r('descargar');
  },
  /** "#traspaso=…&ir=avisos" o "#/avisos" -> { traspaso, avisos } (código solo si tiene el formato esperado) */
  leerHash(hash) {
    const h = String(hash || '');
    if (h.startsWith('#traspaso=')) {
      const q = new URLSearchParams(h.slice(1));
      const c = q.get('traspaso') || '';
      return { traspaso: /^[A-Za-z0-9_-]{43}$/.test(c) ? c : '', avisos: q.get('ir') === 'avisos' };
    }
    return { traspaso: '', avisos: /^#\/?avisos(?:$|[?&])/.test(h) };
  },
};
/* PASOS-AVISOS:FIN */

const asistente = {
  AVANCE: 'pv.avisos.avance',
  inicioPreparado: 0,

  avance: () => almacen.get(asistente.AVANCE) || '',
  marcar(v) { if (v) almacen.set(asistente.AVANCE, v); else almacen.del(asistente.AVANCE); },

  /** ¿El teléfono ya acepta la llave de la tienda? Se pide un icono a la dirección segura (sin datos) */
  async probarLlave() {
    const url = notificaciones.urlSegura();
    if (!url) return false;
    const ctl = typeof AbortController === 'function' ? new AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 5000);
    try {
      await fetch(url + 'icono-32.png?prueba=' + Date.now(), { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined });
      return true;
    } catch (e) { return false; }
    finally { clearTimeout(t); }
  },

  /** Reúne lo que hace falta para decidir el paso (puede tardar unos segundos por la prueba de la llave) */
  async detectar() {
    const ua = navigator.userAgent;
    const e = {
      plataforma: pasosAvisos.plataforma(ua, navigator.maxTouchPoints),
      versionIos: pasosAvisos.versionIos(ua),
      seguro: notificaciones.esSeguro(),
      instalada: notificaciones.instalada(),
      soportado: notificaciones.soportado(),
      permiso: 'Notification' in window ? Notification.permission : 'default',
      suscrito: false,
      httpsDisponible: !!notificaciones.urlSegura(),
      llaveConfiable: null,
      avance: asistente.avance(),
    };
    // La suscripción solo importa si ya se puede usar (en iPhone, desde el icono de inicio)
    if (e.seguro && e.soportado && e.permiso === 'granted' && (e.plataforma !== 'ios' || e.instalada)) {
      const s = await notificaciones.actual();
      if (s) {
        try { notificaciones.prefs = await api.pushEstado(s.endpoint); e.suscrito = true; }
        catch (x) { if (x.estado !== 404) throw x; }
      }
    }
    if (!e.seguro && e.httpsDisponible) e.llaveConfiable = await asistente.probarLlave();
    return e;
  },

  /** iPhone: el icono de inicio abre una página que no comparte la sesión de Safari; el manifiesto lleva un código de un uso */
  async prepararInicio() {
    if (Date.now() - asistente.inicioPreparado < 10 * 60 * 1000) return;
    try {
      const d = await api.traspaso('inicio');
      const l = document.querySelector('link[rel="manifest"]');
      if (l && d.manifiesto) l.setAttribute('href', d.manifiesto);
      asistente.inicioPreparado = Date.now();
    } catch (e) { /* sin código: al abrir desde el icono pedirá la contraseña una vez */ }
  },

  /** Lista "Ajustes › General › …" con aspecto de pantalla de ajustes (ilustración hecha con CSS) */
  ruta(...partes) {
    return h('div', { class: 'ruta', 'aria-label': 'Ruta: ' + partes.join(', ') },
      partes.map((p, i) => h('div', { class: i === partes.length - 1 ? 'fin' : null },
        h('span', null, p), icono('derecha', { tamano: 18 }))));
  },

  pasosNumerados: lineas => h('ol', { class: 'asis-pasos' }, lineas.map(l => h('li', null, l))),

  ayuda(plataforma) {
    const causas = plataforma === 'ios' ? [
      ['Ábrela desde el icono', 'Los avisos llegan a Caja Libre de tu pantalla de inicio, no a Safari. Si borraste el icono, vuelve a agregarlo.'],
      ['Notificaciones permitidas', 'Ajustes › Notificaciones › Caja Libre: «Permitir notificaciones» encendido. Revisa también que el modo Concentración (No molestar) no las esté callando.'],
      ['Modo de bajo consumo', 'Puede retrasar los avisos. Apágalo en Ajustes › Batería.'],
    ] : [
      ['Ahorro de batería', 'Ajustes › Aplicaciones › Chrome › Batería: elige «Sin restricciones». El ahorro de batería puede detener los avisos.'],
      ['Notificaciones de Chrome', 'Ajustes › Aplicaciones › Chrome › Notificaciones: deben estar encendidas (también las de los sitios).'],
      ['No molestar', 'Si el teléfono está en «No molestar» o en silencio, los avisos llegan sin sonar.'],
    ];
    return h('details', { class: 'asis-ayuda' },
      h('summary', null, icono('ayuda', { tamano: 20 }), 'No me llegan los avisos'),
      h('ol', { class: 'asis-pasos' }, causas.map(([t, d]) => h('li', null, h('b', null, t + '. '), d))),
      h('p', { class: 'nota' }, 'Además, la computadora de la tienda debe estar encendida, con Caja Libre abierto y con internet. En las horas de silencio no se manda nada.'));
  },

  /**

  async pintar(caja) {
    // La tarjeta puede no estar aún en la página (Ajustes se arma antes de mostrarse): no se mira isConnected;
    // solo gana la última revisión si se pidieron varias seguidas.
    const vuelta = (caja._vuelta = (caja._vuelta || 0) + 1);
    caja.replaceChildren(cargando('Revisando este teléfono…'));
    let e;
    try { e = await asistente.detectar(); }
    catch (x) { if (x.estado === 401 || vuelta !== caja._vuelta) return; caja.replaceChildren(errorConReintento(x, () => asistente.pintar(caja))); return; }
    if (vuelta !== caja._vuelta) return;
    const sig = pasosAvisos.siguiente(e);

      b.addEventListener('click', async () => { b.disabled = true; try { await alTocar(); } finally { b.disabled = false; } });

    }, { ico: 'listo' });

    let ico = 'campana', claseIco = '', titulo = '', cuerpo = [];
    switch (sig.paso) {
      case 'descargar': {
        ico = 'llave'; titulo = 'Descarga la llave de la tienda';

        cuerpo = [
          h('p', null, 'La llave le dice a tu teléfono que la computadora de la tienda es de confianza. Se instala una sola vez.'),
          ios && !pasosAvisos.esSafari(ua) ? h('div', { class: 'aviso-err' }, 'Abre esta página en Safari: solo Safari puede instalar la llave.') : null,
          pasosAvisos.esFirefoxAndroid(ua) ? h('div', { class: 'aviso-err' }, 'Abre esta página en Chrome: Firefox no puede recibir estos avisos.') : null,
          asistente.pasosNumerados(ios
            ? ['Toca «Descargar la llave».', 'Si el teléfono pregunta, toca «Permitir».', 'Toca «Cerrar» y regresa aquí.']
            : ['Toca «Descargar la llave».', 'Si Chrome pregunta, toca «Descargar».', 'Regresa aquí.']),
          bajar,
          boton('Ya la descargué', () => { asistente.marcar('descargada'); otraVez(); }, { clase: '' }),
        ];
        break;
      }
      case 'instalar':
        ico = 'llave'; titulo = 'Instala la llave';
        cuerpo = ios ? [
          asistente.ruta('Ajustes', 'Perfil descargado', 'Instalar'),
          asistente.pasosNumerados(['Sal de Safari y abre Ajustes.', 'Arriba verás «Perfil descargado»: tócalo.',
            'Toca «Instalar» (te pedirá el código del teléfono) y otra vez «Instalar».', 'Regresa aquí.']),
          h('p', { class: 'nota' }, 'Si no aparece «Perfil descargado», búscalo en Ajustes › General › VPN y gestión de dispositivos.'),
          boton('Ya la instalé', () => { asistente.marcar('instalada'); otraVez(); }, { ico: 'listo' }),
          boton('Descargarla otra vez', () => { asistente.marcar(''); otraVez(); }, { clase: '' }),
        ] : [
          asistente.ruta('Ajustes', 'Seguridad', 'Cifrado y credenciales', 'Instalar un certificado', 'Certificado de CA'),
          asistente.pasosNumerados(['Abre los Ajustes del teléfono y escribe «certificado» en el buscador de arriba.',
            'Toca «Certificado de CA» y luego «Instalar de todos modos».', 'Elige el archivo caja-libre.crt (está en Descargas).', 'Regresa aquí.']),
          h('p', { class: 'nota' }, 'El nombre exacto cambia según la marca del teléfono; casi siempre está dentro de Seguridad.'),
          msg,
          comprobar('Ya la instalé', 'Todavía no funciona. Revisa que elegiste «Certificado de CA». Si ya la instalaste, cierra Chrome por completo y vuelve a abrir esta página.'),
          boton('Descargarla otra vez', () => { asistente.marcar(''); otraVez(); }, { clase: '' }),
        ];
        break;
      case 'confiar':
        ico = 'llave'; titulo = 'Activa la confianza';
        cuerpo = [
          asistente.ruta('Ajustes', 'General', 'Información', 'Ajustes de confianza de certificados'),
          asistente.pasosNumerados(['Abre Ajustes › General › Información.', 'Baja hasta el final y toca «Ajustes de confianza de certificados».',
            'Enciende el interruptor de «Caja Libre» y toca «Continuar».', 'Regresa aquí.']),
          msg,
          comprobar('Ya lo activé', 'Todavía no está activa. Revisa que el interruptor de «Caja Libre» esté encendido y vuelve a intentar.'),
          boton('Volver al paso anterior', () => { asistente.marcar('descargada'); otraVez(); }, { clase: '' }),
        ];
        break;
      case 'abrir-segura':
        ico = 'candado'; titulo = 'Abre la página segura';
        cuerpo = [
          h('p', null, 'Tu teléfono ya confía en la computadora de la tienda. Ahora pasamos a la página con candado; no tendrás que volver a escribir tu contraseña.'),
          msg,
          boton('Continuar', async () => {
            try {
              const d = await api.traspaso('seguro');
              asistente.marcar('');
              location.href = d.url;
            } catch (x) { error(x.message); }

        ];
        break;
      case 'agregar-inicio':
        ico = 'agregar'; titulo = 'Agrega Caja Libre a tu pantalla de inicio';
        asistente.prepararInicio();
        cuerpo = [
          h('p', null, 'En iPhone los avisos solo llegan a las páginas guardadas en la pantalla de inicio.'),
          !pasosAvisos.esSafari(ua) ? h('div', { class: 'aviso-err' }, 'Abre esta dirección en Safari para poder agregarla.') : null,
          h('ol', { class: 'asis-pasos' },
            h('li', null, 'Toca el botón Compartir ', h('span', { class: 'asis-tecla', 'aria-hidden': 'true' }, icono('compartir', { tamano: 18 })), ' de Safari.'),
            h('li', null, 'Baja y toca «Agregar a inicio» ', h('span', { class: 'asis-tecla', 'aria-hidden': 'true' }, icono('agregar', { tamano: 18 })), '.'),
            h('li', null, 'Toca «Agregar».'),
            h('li', null, 'Cierra Safari y abre Caja Libre desde el icono nuevo de tu pantalla de inicio.')),
          h('div', { class: 'asis-icono-inicio', 'aria-hidden': 'true' }, logoApp('', 56), h('span', null, 'Caja Libre')),
          h('p', { class: 'nota' }, 'Si ya lo agregaste antes, solo abre Caja Libre desde ese icono.'),
        ];
        break;
      case 'permitir':
        ico = 'campana'; titulo = 'Permite los avisos';
        cuerpo = [
          h('p', null, 'Toca el botón. El teléfono te preguntará si quieres recibir notificaciones: toca «Permitir».'),
          msg,
          boton('Activar avisos', async () => {
            try {
              const r = await notificaciones.activar();
              if (r === 'granted') { vibrar(30); otraVez(); return; }
              if (r === 'denied') { otraVez(); return; }

        break;
      case 'bloqueado':
        ico = 'alerta'; claseIco = 'mal'; titulo = 'Los avisos están bloqueados';
        cuerpo = [
          h('p', null, 'Antes se eligió «No permitir». Para cambiarlo:'),
          ios ? asistente.ruta('Ajustes', 'Notificaciones', 'Caja Libre', 'Permitir notificaciones')

          asistente.pasosNumerados(ios
            ? ['Abre Ajustes › Notificaciones.', 'Toca «Caja Libre» y enciende «Permitir notificaciones».', 'Regresa aquí.']

        const v = e.versionIos ? e.versionIos.join('.') : '';

          h('p', null, 'Los avisos necesitan iOS 16.4 o más reciente' + (v ? ' y este teléfono tiene iOS ' + v + '.' : '.')),
          asistente.ruta('Ajustes', 'General', 'Actualización de software'),
          h('p', { class: 'nota' }, 'Todo lo demás de la página funciona igual sin avisos.'),
        ];

      }
      case 'no-soportado':
        ico = 'alerta'; claseIco = 'mal'; titulo = 'Este navegador no recibe avisos';
        cuerpo = [h('p', null, android ? 'Abre esta página en Chrome.' : ios ? 'Abre Caja Libre desde el icono de tu pantalla de inicio.' : 'Prueba con Chrome, Edge o Safari.')];

      case 'sin-https':
        ico = 'alerta'; claseIco = 'mal'; titulo = 'La computadora no está lista';
        cuerpo = [h('p', null, 'La conexión segura de la computadora de la tienda está apagada. Pide a quien administra la caja que revise Configuración › Acceso móvil.'),
          boton('Revisar otra vez', async () => { await revalidar(); otraVez(); }, { clase: '' })];

      : null;
    vaciar(caja);
    anexar(caja, [   // anexar() omite el progreso cuando es null (replaceChildren lo escribiría como texto)
      h('div', { class: 'seccion-t' }, 'Avisos en este teléfono'),
      progreso,
      h('div', { class: 'asis-cab' }, h('div', { class: 'asis-ico ' + claseIco, 'aria-hidden': 'true' }, icono(ico, { tamano: 30 })), h('h2', null, titulo)),
      h('div', { class: 'asis-cuerpo' }, cuerpo),
      asistente.ayuda(e.plataforma)]);
  },

  /** Ya activos: prueba, qué avisos y horas de silencio, en palabras sencillas */
  panelListo(otraVez) {
    const pr = notificaciones.prefs || {};
    const endpoint = notificaciones.suscripcion && notificaciones.suscripcion.endpoint;
    const msg = h('div', { class: 'oculto', role: 'alert' });
    const mostrarError = t => { msg.className = 'aviso-err'; msg.textContent = t; };
    const mostrarOk = t => { msg.className = 'aviso-ok'; msg.textContent = t; };
    const guardar = async cambios => {
      const datos = Object.assign({ endpoint, activa: pr.activa, proveedores: pr.proveedores, stock: pr.stock, horaPico: pr.horaPico,
        caducidad: pr.caducidad !== false, silencioDesde: pr.silencioDesde, silencioHasta: pr.silencioHasta }, cambios);
      const nuevo = await api.pushPreferencias(datos);
      Object.assign(pr, nuevo); notificaciones.prefs = pr;
    };
    const horaTexto = n => pad(n) + ':00';
    const selectorHora = (valor, etiqueta) => {
      const sel = h('select', { class: 'entrada', 'aria-label': etiqueta, style: 'min-height:48px' });
      for (let i = 0; i < 24; i++) sel.append(h('option', { value: String(i), selected: i === valor ? true : null }, horaTexto(i)));
      return sel;
    };
    const frase = h('div', { class: 'd' });
    const pintarFrase = () => {
      frase.textContent = pr.silencioDesde === pr.silencioHasta
        ? 'Sin horas de silencio: los avisos llegan a cualquier hora.'
        : 'De ' + horaTexto(pr.silencioDesde) + ' a ' + horaTexto(pr.silencioHasta) + ' no te mandamos nada (para no despertarte). Si pones la misma hora en los dos, no hay silencio.';
    };
    pintarFrase();
    const desde = selectorHora(pr.silencioDesde, 'Silencio desde'), hasta = selectorHora(pr.silencioHasta, 'Silencio hasta');
    const alCambiarHora = async () => {
      try { await guardar({ silencioDesde: Number(desde.value), silencioHasta: Number(hasta.value) }); pintarFrase(); }
      catch (e) { mostrarError(e.message); }
    };
    desde.addEventListener('change', alCambiarHora); hasta.addEventListener('change', alCambiarHora);
    const prueba = h('button', { class: 'btn btn-primario btn-block', type: 'button' }, icono('campana', { tamano: 22 }), 'Enviar aviso de prueba');
    prueba.addEventListener('click', async () => {
      prueba.disabled = true;
      try {
        const r = await api.pushPrueba(endpoint);
        if (r.ok) mostrarOk('Enviado. Debe aparecer en unos segundos. Si no llega, abre «No me llegan los avisos».');
        else mostrarError('No se pudo enviar: ' + (r.detalle || '') + ' Revisa que la computadora tenga internet.');
      } catch (e) { mostrarError(e.message); }
      prueba.disabled = false;
    });
    const quitar = h('button', { class: 'btn btn-block', type: 'button' }, 'Dejar de recibir avisos aquí');
    quitar.addEventListener('click', async () => { quitar.disabled = true; await notificaciones.desactivar(); avisar('Avisos desactivados en este teléfono.'); otraVez(); });
    const fila = (clave, titulo, detalle) => h('div', { class: 'fila-conf' },
      h('div', null, h('div', { class: 't' }, titulo), h('div', { class: 'd' }, detalle)),
      interruptor(pr[clave] !== false, async v => { try { await guardar({ [clave]: v }); } catch (e) { mostrarError(e.message); throw e; } }, titulo));
    return h('div', { style: 'display:grid;gap:.75rem' },
      pr.ultimoError && (!pr.ultimoOk || pr.ultimoError > pr.ultimoOk) ? h('div', { class: 'aviso-err' }, 'El último aviso no llegó. Revisa que la computadora tenga internet.') : null,
      prueba, msg,
      h('div', null,
        h('div', { class: 'seccion-t', style: 'margin-top:.4rem' }, '¿Qué avisos quieres?'),
        h('div', { class: 'fila-conf' },
          h('div', null, h('div', { class: 't' }, 'Recibir avisos'), h('div', { class: 'd' }, 'Apágalo para pausarlos sin perder lo que elegiste.')),
          interruptor(pr.activa !== false, async v => { try { await guardar({ activa: v }); } catch (e) { mostrarError(e.message); throw e; } }, 'Recibir avisos')),
        fila('proveedores', 'Proveedores', 'Quién entrega o viene a tomar pedido hoy (8:00) y mañana (19:00).'),
        fila('stock', 'Se está acabando', 'Productos con poca existencia (9:00 y 17:00).'),
        fila('caducidad', 'Por caducar', 'Productos que caducan pronto (9:00).'),
        fila('horaPico', 'Hora pico', 'Media hora antes de la hora con más venta.')),
      h('div', { class: 'fila-conf', style: 'display:grid;gap:.5rem' },
        h('div', null, h('div', { class: 't' }, 'Horas de silencio'), frase),
        h('div', { style: 'display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center' }, desde, h('span', { class: 'sub' }, 'a'), hasta)),
      quitar);
  },
};

/* Mensajes del service worker: tocar una notificación abre la sección del aviso en esta misma pestaña */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', ev => {
    const d = ev.data || {};
    if (d.tipo === 'abrir' && typeof d.url === 'string' && E.sesion) {
      const r = rutaDeHash(d.url);
      if (permitidas().some(s => s.id === r.id)) irA(r.id, r.opciones);
    } else if (d.tipo === 'suscripcion-cambiada' && E.sesion) {
      notificaciones.sincronizar();
    }
  });
}

/* ============================================================================
   12. RECORRIDO GUIADO (tutorial): una vez por usuario, se repite con "Ayuda"
       - Solo incluye las secciones que el usuario puede ver (permitidas()).
       - Resalta el botón de la sección en el menú y coloca la tarjeta junto a él.
       - "Ya lo vi" se guarda EN EL SERVIDOR por usuario (/api/tutorial); si no
         hay red se recuerda en el teléfono y se vuelve a intentar la próxima vez.
   ============================================================================ */
const tutorial = {
  abierto: null,
  claveLocal: () => 'pv.tutorial.' + (E.sesion ? E.sesion.usuario : ''),

  pasos() {
    const sec = E.sesion.secciones || {};
    const verGanancia = (E.sesion.permisos || []).includes('VER_GANANCIAS');
    const textos = {
      estadisticas: 'Ventas de hoy, de la semana o del mes, con la comparación contra el periodo anterior, los productos más vendidos y las franjas del día con más movimiento.'
        + (verGanancia ? ' Como puedes ver costos, también aparece la ganancia estimada.' : ''),
      historial: 'Busca los tickets por rango de fechas (hasta 93 días) con atajos para hoy, ayer, los últimos 7 días o este mes. Toca una venta para ver sus productos, la forma de pago y quién la cobró.',
      inventario: 'Busca productos por nombre o código y filtra los de stock bajo, agotados o por caducar. Toca un producto para ver su existencia, precio y foto.'
        + (sec.inventarioAjustar ? ' Tienes permiso para registrar entradas, mermas y conteos: cada ajuste queda en la bitácora con tu usuario.'
                                 : ' Tu usuario solo consulta; los ajustes de inventario se hacen desde el programa de escritorio.'),
      proveedores: 'Agenda de proveedores: el calendario de la semana muestra qué día llega cada entrega y qué día pasa el preventa (el vendedor que toma el pedido), con el día de hoy resaltado. Toca un proveedor para ver su teléfono y sus próximas visitas.'
        + (sec.proveedoresCostos ? ' Como puedes ver costos, también aparece la nota media: lo que se le compra en promedio por visita.' : '')
        + (sec.proveedoresEditar ? ' Tienes permiso para dar de alta proveedores y cambiar sus días de entrega y preventa.' : ' Los días los captura quien gestiona proveedores; tú los consultas.'),
      clientes: 'Quién me debe: los clientes con cuenta (fiado) que deben, de mayor a menor, y el total por cobrar. Es solo consulta: los abonos se registran en la computadora. Toca un cliente para llamarle.',
      escanear: 'Permite tomar una foto del ticket del proveedor para dar entrada a la mercancía. Importante: por ahora la lectura de la foto es una DEMOSTRACIÓN, las líneas que aparecen son de ejemplo y nada cambia en el inventario hasta que marques y confirmes cada una.',
      config: 'Aquí decides si la sesión se mantiene abierta en este teléfono, activas las notificaciones (los avisos de la campana llegan al teléfono aunque la página esté cerrada), eliges el tema claro u oscuro y el texto grande, y cierras sesión. También puedes volver a ver este recorrido.',
    };
    const lista = [{ icono: 'tienda', titulo: 'Bienvenido al acceso móvil',
      texto: 'Desde tu teléfono puedes consultar el negocio estando en la misma red Wi-Fi que la computadora. Este recorrido dura un minuto y explica qué hace cada sección; puedes repetirlo cuando quieras.' }];
    for (const s of permitidas()) lista.push({ icono: s.icono, titulo: s.titulo, texto: textos[s.id] || '', foco: () => contNav.querySelector('[data-id="' + s.id + '"]') });
    lista.push({ icono: 'campana', titulo: 'Avisos del día',
      texto: 'La campana de arriba reúne lo que conviene saber hoy: qué proveedor entrega o pasa a tomar pedido hoy y mañana, qué productos se están acabando según lo que vendes y, con suficiente historial, la hora pico del día. Toca un aviso para ir a su sección; con la X lo descartas por hoy. Se actualiza cada 10 minutos.',
      foco: () => botonAvisos });
    lista.push({ icono: 'ayuda', titulo: '¿Dudas después?', texto: 'Toca el botón de ayuda de la parte superior para repetir este recorrido en cualquier momento. ¡Listo para empezar!', foco: () => botonAyuda });
    return lista;
  },

  /** Al entrar: pregunta al servidor si este usuario ya lo vio; sin red, usa lo que recuerde el teléfono */
  async siEsLaPrimeraVez() {
    if (!E.sesion || E.tutorialComprobado) return;
    E.tutorialComprobado = true;
    let visto;
    try { visto = !!(await api.tutorial()).visto; }
    catch (e) { if (e.estado === 401) return; visto = almacen.get(tutorial.claveLocal()) === '1'; }
    if (!visto && E.sesion) tutorial.abrir({ primeraVez: true });
  },

  async marcarVisto() {
    almacen.set(tutorial.claveLocal(), '1');
    try { await api.tutorialVisto(true); } catch (e) { /* sin red: queda la marca local y se reintenta la próxima vez */ }
  },

  abrir({ primeraVez = false } = {}) {
    if (!E.sesion || !contNav) return;
    if (tutorial.abierto) tutorial.abierto.cerrar();
    const pasos = tutorial.pasos();
    const previo = document.activeElement;
    let i = 0;
    const foco = h('div', { class: 'tuto-foco sin' });
    const ico = h('div', { class: 'tuto-ico', 'aria-hidden': 'true' });
    const titulo = h('h2', { id: 'tuto-titulo' });
    const texto = h('p', { class: 'tuto-texto', id: 'tuto-texto' });
    const contador = h('span');
    const puntos = h('div', { class: 'tuto-puntos', 'aria-hidden': 'true' });
    const anterior = h('button', { class: 'btn', type: 'button', onclick: () => ir(i - 1) }, icono('izquierda', { tamano: 20 }), 'Anterior');
    const siguiente = h('button', { class: 'btn btn-primario', type: 'button', onclick: () => i >= pasos.length - 1 ? terminar() : ir(i + 1) });
    const omitir = h('button', { class: 'tuto-cerrar', type: 'button', 'aria-label': 'Omitir recorrido', title: 'Omitir', onclick: terminar }, icono('cerrar'));
    const tarjeta = h('div', { class: 'tuto-tarjeta centro', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'tuto-titulo', 'aria-describedby': 'tuto-texto', tabindex: '-1' },
      h('div', { class: 'tuto-cab' }, ico, titulo, omitir),
      texto,
      h('div', { class: 'tuto-pie' }, h('div', { class: 'tuto-paso' }, contador, puntos), anterior, siguiente));
    const velo = h('div', { class: 'tuto-velo' }, foco, tarjeta);
    velo.addEventListener('click', e => { if (e.target === velo) terminar(); });

    function colocar() {
      const p = pasos[i];
      const el = p.foco ? p.foco() : null;
      const r = el && el.isConnected ? el.getBoundingClientRect() : null;
      if (r && r.width) {
        foco.className = 'tuto-foco';
        Object.assign(foco.style, { left: (r.left - 6) + 'px', top: (r.top - 6) + 'px', width: (r.width + 12) + 'px', height: (r.height + 12) + 'px' });
      } else {
        foco.className = 'tuto-foco sin';
        Object.assign(foco.style, { left: '50%', top: '50%', width: '0', height: '0' });
      }
      tarjeta.classList.remove('centro');
      Object.assign(tarjeta.style, { top: '', bottom: '' });
      const ancho = window.innerWidth >= 1024;          // barra lateral: la tarjeta va centrada
      if (!r || !r.width || ancho) tarjeta.classList.add('centro');
      else if (r.top > window.innerHeight / 2) tarjeta.style.bottom = (window.innerHeight - r.top + 14) + 'px';   // el menú está abajo
      else tarjeta.style.top = (r.bottom + 14) + 'px';                                                          // el botón de ayuda, arriba
    }
    function ir(n) {
      i = Math.max(0, Math.min(pasos.length - 1, n));
      const p = pasos[i];
      ico.replaceChildren(icono(p.icono, { tamano: 22 }));
      titulo.textContent = p.titulo;
      texto.textContent = p.texto;
      contador.textContent = 'Paso ' + (i + 1) + ' de ' + pasos.length;
      puntos.replaceChildren(...pasos.map((x, k) => h('i', { class: k === i ? 'act' : null })));
      anterior.disabled = i === 0;
      const ultimo = i === pasos.length - 1;
      siguiente.replaceChildren(ultimo ? 'Listo' : 'Siguiente', icono(ultimo ? 'listo' : 'derecha', { tamano: 20 }));
      colocar();
      tarjeta.focus({ preventScroll: true });
    }
    const alTecla = e => {
      if (e.key === 'Escape') { e.preventDefault(); terminar(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); siguiente.click(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); if (i > 0) ir(i - 1); }
      else if (e.key === 'Tab') {   // el foco se queda dentro de la tarjeta
        const f = [...tarjeta.querySelectorAll('button:not([disabled])')];
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    function cerrar() {
      velo.remove();
      document.removeEventListener('keydown', alTecla);
      window.removeEventListener('resize', colocar);
      window.removeEventListener('orientationchange', colocar);
      tutorial.abierto = null;
      if (previo && previo.focus && previo.isConnected) previo.focus();
    }
    function terminar() {   // "Omitir" también cuenta como visto: se puede reabrir con Ayuda
      cerrar();
      tutorial.marcarVisto();
      if (primeraVez) avisar('Puedes repetir el recorrido con el botón de ayuda.');
    }
    document.addEventListener('keydown', alTecla);
    window.addEventListener('resize', colocar);
    window.addEventListener('orientationchange', colocar);
    document.body.append(velo);
    tutorial.abierto = { cerrar };
    ir(0);
  },
};

arrancar();
})();
</script>
