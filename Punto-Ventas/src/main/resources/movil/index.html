<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6CAD">
<meta name="color-scheme" content="light dark">
<title>Punto de Venta Móvil</title>
<!--
  ============================================================================
  Punto de Venta - Interfaz web MÓVIL (archivo único: HTML + CSS + JS)
  ----------------------------------------------------------------------------
  - Lo sirve el programa de escritorio (ServidorMovilService) en la red local.
  - Sin dependencias externas ni CDNs: funciona sin internet, solo en la LAN.
  - LOGIN, SESIÓN y DATOS (estadísticas, ventas, inventario, ajustes) son
    reales: el objeto `api` (sección 3) llama con fetch() a /api/* y el servidor
    vuelve a comprobar los permisos del usuario en cada petición. SOLO la lectura
    del ticket del proveedor (OCR) sigue siendo un DEMO (objeto `ocr`).
  - Seguridad: todo texto dinámico se inserta con textContent/createTextNode
    (función h()), nunca con innerHTML.
  ============================================================================
-->
<style>
/* ===== Paleta (misma que el escritorio: css/app.css) ===== */
:root {
  --bg: #F3F5F8;  --surface: #FFFFFF;  --surface-alt: #F7F8FA;  --inset: #ECEFF3;
  --border: #D3D9E0;  --border-subtle: #E4E8ED;
  --text: #1E2631;  --muted: #5A6472;  --subtle: #8A939F;
  --accent: #2F6CAD;  --accent-hover: #285E98;  --accent-text: #285E98;
  --accent-subtle: #EAF1F9;  --on-accent: #FFFFFF;  --ring: rgba(47,108,173,.35);
  --danger: #B23A43;  --danger-text: #A1343C;  --danger-subtle: #FBF0F1;
  --success: #2E7A55; --success-text: #276A49; --success-subtle: #EDF6F1;
  --warning: #B0731C; --warning-text: #8A5A14; --warning-subtle: #FCF5E9;
  --shadow: 0 1px 2px rgba(20,30,45,.06), 0 4px 14px rgba(20,30,45,.06);
  --radius: 16px;
  --fs: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --bg: #11161D; --surface: #1A212B; --surface-alt: #202833; --inset: #252E3A;
    --border: #334050; --border-subtle: #2A3541;
    --text: #E8EDF3; --muted: #A5B0BD; --subtle: #7F8B99;
    --accent: #5B9BDB; --accent-hover: #74AAE2; --accent-text: #8DBAE8;
    --accent-subtle: #1F3248; --on-accent: #0E1620; --ring: rgba(91,155,219,.45);
    --danger: #E0666F; --danger-text: #F08C94; --danger-subtle: #3A2327;
    --success: #4DB383; --success-text: #75CBA2; --success-subtle: #1F3329;
    --warning: #D9A24C; --warning-text: #E8BC78; --warning-subtle: #382E1C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-tema="oscuro"] {
  --bg: #11161D; --surface: #1A212B; --surface-alt: #202833; --inset: #252E3A;
  --border: #334050; --border-subtle: #2A3541;
  --text: #E8EDF3; --muted: #A5B0BD; --subtle: #7F8B99;
  --accent: #5B9BDB; --accent-hover: #74AAE2; --accent-text: #8DBAE8;
  --accent-subtle: #1F3248; --on-accent: #0E1620; --ring: rgba(91,155,219,.45);
  --danger: #E0666F; --danger-text: #F08C94; --danger-subtle: #3A2327;
  --success: #4DB383; --success-text: #75CBA2; --success-subtle: #1F3329;
  --warning: #D9A24C; --warning-text: #E8BC78; --warning-subtle: #382E1C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
}
:root[data-texto="grande"] { --fs: 18px; }

/* ===== Base ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: var(--fs); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4; -webkit-text-size-adjust: 100%;
  min-height: 100vh; min-height: 100dvh;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.oculto { display: none !important; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

/* ===== Botones y campos (objetivos táctiles grandes, >= 48px) ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 52px; padding: 0 1.25rem; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface); font-weight: 600;
  transition: transform .06s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn-primario { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-primario:hover { background: var(--accent-hover); }
.btn-peligro { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-suave { background: var(--accent-subtle); border-color: transparent; color: var(--accent-text); }
.btn-block { width: 100%; }
.campo { display: grid; gap: .35rem; }
.campo > label { font-size: .85rem; font-weight: 600; color: var(--muted); }
.entrada {
  width: 100%; min-height: 52px; padding: 0 1rem; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface); font-size: 1rem;
}
.entrada:focus { outline: 3px solid var(--ring); border-color: var(--accent); }
.con-boton { display: flex; gap: .5rem; }
.con-boton .entrada { flex: 1; }
.icono-btn { min-width: 52px; padding: 0; }

/* ===== Estructura de la app ===== */
#app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.cabecera {
  position: sticky; top: 0; z-index: 5; background: var(--surface);
  border-bottom: 1px solid var(--border-subtle);
  padding: calc(env(safe-area-inset-top) + .6rem) 1rem .6rem;
  display: flex; align-items: center; gap: .75rem;
}
.cabecera h1 { font-size: 1.15rem; flex: 1; }
.pastilla {
  font-size: .7rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  padding: .2rem .55rem; border-radius: 999px; background: var(--warning-subtle); color: var(--warning-text);
}
.vista { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 1rem 1rem calc(96px + env(safe-area-inset-bottom)); }
.vista > * + * { margin-top: 1rem; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface);
  border-top: 1px solid var(--border-subtle); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-int { display: flex; width: 100%; max-width: 760px; }
.nav button {
  flex: 1; min-height: 64px; border: 0; background: none; cursor: pointer;
  display: grid; place-items: center; align-content: center; gap: 2px;
  font-size: .72rem; font-weight: 600; color: var(--muted);
}
.nav button .ico { font-size: 1.4rem; line-height: 1; }
.nav button[aria-current="page"] { color: var(--accent-text); }
.nav button[aria-current="page"] .ico { transform: translateY(-1px); }

/* ===== Tarjetas, listas, etiquetas ===== */
.tarjeta { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1rem; }
.titulo { font-size: 1.35rem; font-weight: 700; }
.sub { color: var(--muted); font-size: .9rem; }
.seccion-t { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .6rem; }
.rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.kpi { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--shadow); }
.kpi .e { font-size: .78rem; font-weight: 600; color: var(--muted); }
.kpi .v { font-size: 1.45rem; font-weight: 750; margin-top: .15rem; font-variant-numeric: tabular-nums; }
.kpi.grande { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.kpi.grande .e { color: inherit; opacity: .85; }
.kpi.grande .v { font-size: 2rem; }
.var { font-size: .8rem; font-weight: 700; margin-top: .15rem; }
.var.sube { color: var(--success-text); } .var.baja { color: var(--danger-text); }
.kpi.grande .var { color: inherit; opacity: .95; }
.segmentos { display: flex; background: var(--inset); border-radius: 14px; padding: 4px; gap: 4px; }
.segmentos button { flex: 1; min-height: 44px; border: 0; border-radius: 11px; background: none; font-weight: 650; color: var(--muted); cursor: pointer; }
.segmentos button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.fila { display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 14px; width: 100%; text-align: left; cursor: pointer; }
.fila + .fila { margin-top: .5rem; }
.fila .cuerpo { flex: 1; min-width: 0; }
.fila .t { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fila .d { font-size: .82rem; color: var(--muted); }
.fila .der { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.insignia { display: inline-block; font-size: .7rem; font-weight: 700; padding: .15rem .55rem; border-radius: 999px; background: var(--inset); color: var(--muted); }
.insignia.ok { background: var(--success-subtle); color: var(--success-text); }
.insignia.aviso { background: var(--warning-subtle); color: var(--warning-text); }
.insignia.mal { background: var(--danger-subtle); color: var(--danger-text); }
.barra { height: 10px; border-radius: 999px; background: var(--inset); overflow: hidden; margin-top: .35rem; }
.barra > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.top-item + .top-item { margin-top: .9rem; }
.top-item .l { display: flex; justify-content: space-between; gap: .5rem; font-size: .95rem; font-weight: 600; }
.top-item .l span:last-child { font-variant-numeric: tabular-nums; }
.horas { display: flex; align-items: flex-end; gap: 3px; height: 130px; }
.horas .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
.horas .col i { width: 100%; min-height: 3px; border-radius: 5px 5px 2px 2px; background: var(--accent); opacity: .45; }
.horas .col.pico i { opacity: 1; }
.horas-et { display: flex; gap: 3px; margin-top: .3rem; }
.horas-et span { flex: 1; text-align: center; font-size: .62rem; color: var(--subtle); }
.vacio { text-align: center; color: var(--muted); padding: 2rem 1rem; }
.cargando { display: grid; place-items: center; padding: 3rem 1rem; color: var(--muted); gap: .75rem; }
.rueda { width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--inset); border-top-color: var(--accent); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .rueda { animation-duration: 2.4s; } .barra > i { transition: none; } }
.aviso-err { background: var(--danger-subtle); color: var(--danger-text); border-radius: 12px; padding: .75rem 1rem; font-size: .92rem; font-weight: 600; }
.aviso-ok { background: var(--success-subtle); color: var(--success-text); border-radius: 12px; padding: .75rem 1rem; font-weight: 600; }

/* ===== Login ===== */
.login { flex: 1; display: grid; place-items: center; padding: 1.5rem 1rem; }
.login-caja { width: 100%; max-width: 420px; display: grid; gap: 1.1rem; }
.logo { width: 72px; height: 72px; border-radius: 22px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 2.2rem; margin: 0 auto; box-shadow: var(--shadow); }
.login h1 { text-align: center; font-size: 1.6rem; }
.login .sub { text-align: center; }

/* ===== Hoja inferior (modal) ===== */
.velo { position: fixed; inset: 0; z-index: 20; background: rgba(10,16,24,.55); display: flex; align-items: flex-end; justify-content: center; }
.hoja {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow: auto; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 1.25rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
  display: grid; gap: 1rem; animation: sube .22s ease;
}
@keyframes sube { from { transform: translateY(30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
.hoja h2 { font-size: 1.25rem; }
.acciones { display: grid; gap: .6rem; }
.acciones.dos { grid-template-columns: 1fr 1fr; }
.linea { display: flex; justify-content: space-between; gap: 1rem; padding: .55rem 0; border-bottom: 1px solid var(--border-subtle); font-variant-numeric: tabular-nums; }
.linea:last-child { border-bottom: 0; }
.linea .n { min-width: 0; }
.linea .s { font-size: .8rem; color: var(--muted); }
.total-fila { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 800; padding-top: .6rem; }

/* ===== Interruptor ===== */
.fila-conf { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--border-subtle); }
.fila-conf:last-child { border-bottom: 0; }
.fila-conf .t { font-weight: 650; } .fila-conf .d { font-size: .82rem; color: var(--muted); }
.interruptor { position: relative; width: 56px; height: 32px; border-radius: 999px; border: 0; background: var(--border); cursor: pointer; flex: none; transition: background .15s; }
.interruptor::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.interruptor[aria-checked="true"] { background: var(--accent); }
.interruptor[aria-checked="true"]::after { transform: translateX(24px); }

/* ===== Escaneo de ticket ===== */
.tomar { display: grid; place-items: center; gap: .6rem; text-align: center; padding: 2rem 1rem; border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.tomar .grande { font-size: 2.6rem; }
.previa { width: 100%; max-height: 340px; object-fit: contain; border-radius: 14px; background: var(--inset); }
.entrada-oculta { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.paso { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-weight: 600; }

/* ===== Aviso emergente ===== */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; max-width: 92vw;
  background: #222B36; color: #fff; padding: .75rem 1.1rem; border-radius: 14px; font-weight: 600; box-shadow: var(--shadow); }
</style>

<body>
<div id="app" aria-live="polite"></div>

<noscript><p style="padding:1rem">Esta página necesita JavaScript.</p></noscript>

<script>
'use strict';
(() => {

/* ============================================================================
   0. PREFERENCIAS GUARDADAS EN EL TELÉFONO (tema, tamaño de texto)
   ============================================================================ */
const memoria = {};
const almacen = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return memoria[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { memoria[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete memoria[k]; } },
};
function aplicarPreferencias() {
  const r = document.documentElement;
  const tema = almacen.get('pv.tema');
  if (tema === 'claro' || tema === 'oscuro') r.setAttribute('data-tema', tema); else r.removeAttribute('data-tema');
  if (almacen.get('pv.texto') === 'grande') r.setAttribute('data-texto', 'grande'); else r.removeAttribute('data-texto');
}
aplicarPreferencias();

/* ============================================================================
   1. UTILIDADES (h() construye DOM de forma segura: solo textContent)
   ============================================================================ */
function h(tag, attrs, ...hijos) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  anexar(el, hijos);
  return el;
}
function anexar(el, hijos) {
  for (const x of hijos.flat(Infinity)) {
    if (x == null || x === false) continue;
    el.append(x instanceof Node ? x : document.createTextNode(String(x)));   // texto => nodo de texto
  }
  return el;
}
function vaciar(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

const MXN = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const dinero = n => MXN.format(n || 0);
const num = n => new Intl.NumberFormat('es-MX', { maximumFractionDigits: 2 }).format(n);
const pad = n => String(n).padStart(2, '0');
const claveDia = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());   // AAAA-MM-DD local
const inicioDia = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const sumarDias = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const hora = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
const fechaLarga = d => d.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
const fechaHora = d => d.toLocaleString('es-MX', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const espera = ms => new Promise(r => setTimeout(r, ms));
const vibrar = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* no disponible */ } };

function avisar(texto) {
  const t = h('div', { class: 'toast', role: 'status' }, texto);
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}

function cargando(texto) {
  return h('div', { class: 'cargando' }, h('div', { class: 'rueda' }), texto || 'Cargando…');
}

/** Mensaje de error de una petición con botón "Reintentar" cuando el problema es de red o del servidor */
function errorConReintento(e, reintentar) {
  const sinPermiso = e.estado === 403;
  return h('div', { style: 'display:grid;gap:.6rem' },
    h('div', { class: 'aviso-err', role: 'alert' }, sinPermiso ? 'Sin permiso. ' + e.message : e.message),
    sinPermiso ? null : h('button', { class: 'btn btn-block', type: 'button', onclick: reintentar }, 'Reintentar'));
}

/** Hoja inferior modal. cerrable=false obliga a elegir una opción. */
function hoja(contenido, { cerrable = true } = {}) {
  const previo = document.activeElement;
  const velo = h('div', { class: 'velo' });
  const panel = h('div', { class: 'hoja', role: 'dialog', 'aria-modal': 'true' }, contenido);
  velo.append(panel);
  const cerrar = () => { velo.remove(); document.removeEventListener('keydown', alTecla); if (previo && previo.focus) previo.focus(); };
  const alTecla = e => { if (e.key === 'Escape' && cerrable) cerrar(); };
  if (cerrable) velo.addEventListener('click', e => { if (e.target === velo) cerrar(); });
  document.addEventListener('keydown', alTecla);
  document.body.append(velo);
  const primero = panel.querySelector('input, select, button');
  if (primero) primero.focus();
  return { cerrar, panel };
}

/** Pide la contraseña otra vez en una hoja; devuelve el texto o null si se cancela */
function pedirClave() {
  return new Promise(resolver => {
    const msg = h('div', { class: 'oculto', role: 'alert' });
    const campo = h('input', { class: 'entrada', type: 'password', autocomplete: 'current-password', 'aria-label': 'Contraseña' });
    let listo = false;
    const terminar = valor => { if (listo) return; listo = true; q.cerrar(); resolver(valor); };
    const ok = h('button', { class: 'btn btn-primario', type: 'button', onclick: () => {
      if (!campo.value) { msg.className = 'aviso-err'; msg.textContent = 'Escribe tu contraseña.'; return; }
      terminar(campo.value);
    } }, 'Confirmar');
    const no = h('button', { class: 'btn', type: 'button', onclick: () => terminar(null) }, 'Cancelar');
    const q = hoja([h('h2', null, 'Confirma tu contraseña'),
      h('p', { class: 'sub' }, 'Para mantener la sesión siempre abierta escribe tu contraseña otra vez.'),
      campo, msg, h('div', { class: 'acciones dos' }, no, ok)], { cerrable: false });
    campo.addEventListener('keydown', e => { if (e.key === 'Enter') ok.click(); });
  });
}

function interruptor(activo, alCambiar, etiqueta) {
  const b = h('button', { class: 'interruptor', type: 'button', role: 'switch', 'aria-checked': String(!!activo), 'aria-label': etiqueta });
  b.addEventListener('click', async () => {
    const nuevo = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', String(nuevo));
    try { await alCambiar(nuevo); } catch (e) { b.setAttribute('aria-checked', String(!nuevo)); }
  });
  return b;
}

/* ============================================================================
   2. CAPA `api`  (ÚNICO punto de acceso a datos; todo con fetch() al servidor)
      - 401 -> evento 'sesion-terminada' (vuelve al inicio de sesión).
      - 403 -> ErrorApi con el mensaje "Sin permiso ..." (no se cierra la sesión).
      - Sin red -> ErrorApi(0, 'SIN_CONEXION') y las vistas ofrecen "Reintentar".
   ============================================================================ */
class ErrorApi extends Error {
  constructor(estado, codigo, mensaje) { super(mensaje); this.estado = estado; this.codigo = codigo; }
}

const sesionLocal = {   // lo único que se guarda en el teléfono: el token y su caducidad (informativa)
  leer() { try { return JSON.parse(almacen.get('pv.sesion')); } catch (e) { return null; } },
  guardar(token, expira, permanente) { almacen.set('pv.sesion', JSON.stringify({ token, expira, permanente })); },
  borrar() { almacen.del('pv.sesion'); },
};

async function peticion(metodo, ruta, cuerpo, { conToken = true } = {}) {
  const cab = { 'Accept': 'application/json' };
  if (cuerpo !== undefined) cab['Content-Type'] = 'application/json';
  const s = sesionLocal.leer();
  if (conToken && s && s.token) cab['Authorization'] = 'Bearer ' + s.token;
  let r;
  try {
    r = await fetch(ruta, { method: metodo, headers: cab, body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo), cache: 'no-store' });
  } catch (e) {
    throw new ErrorApi(0, 'SIN_CONEXION', 'No hay conexión con el servidor. Revisa que estés en la misma red Wi-Fi.');
  }
  let datos = null;
  try { datos = await r.json(); } catch (e) { /* sin cuerpo JSON */ }
  if (!r.ok) {
    const err = new ErrorApi(r.status, datos && datos.codigo, (datos && datos.error) || 'Error ' + r.status);
    if (r.status === 401 && err.codigo === 'SESION_INVALIDA') document.dispatchEvent(new CustomEvent('sesion-terminada'));
    throw err;
  }
  return datos;
}

const api = {
  /* ---------- Autenticación (REAL) ---------- */
  login: (usuario, contrasena, recordar = false) =>
    peticion('POST', '/api/login', { usuario, contrasena, recordar }, { conToken: false }),
  sesion: () => peticion('GET', '/api/sesion'),
  recordar: (recordar, contrasena) => peticion('POST', '/api/sesion/recordar', { recordar, contrasena }),
  logout: () => peticion('POST', '/api/logout', {}),

  /* ---------- Datos de negocio (REALES) ---------- */

  /** periodo: 'dia' | 'semana' | 'mes'. Devuelve totales, comparación, top y franjas del día. */
  async estadisticas(periodo) {
    const d = await peticion('GET', '/api/estadisticas?periodo=' + encodeURIComponent(periodo));
    const c = d.comparacion;
    return {
      periodo, desde: d.desde, hasta: d.hasta,
      total: d.totales.total, tickets: d.totales.transacciones, promedio: d.totales.ticketPromedio,
      ganancia: d.gananciaVisible ? d.ganancia : null,
      variacion: c && c.variacionPct != null ? c.variacionPct / 100 : null,
      top: d.top.map(t => ({ nombre: t.descripcion, unidad: t.unidad || 'pza', cantidad: t.piezas, importe: t.importe })),
      franjas: d.franjas,
    };
  },

  async ventas({ desde, hasta }) {   // desde/hasta: 'AAAA-MM-DD' (inclusive; máximo 93 días)
    const d = await peticion('GET', '/api/ventas?desde=' + encodeURIComponent(desde) + '&hasta=' + encodeURIComponent(hasta));
    const r = d.ventas.map(v => ({
      id: v.id, folio: v.folio || String(v.id), fecha: new Date(v.fecha), cajero: v.cajero, pago: v.formaPago,
      cancelada: v.cancelada, total: v.total,
      lineas: v.lineas.map(l => ({ nombre: l.descripcion, unidad: l.unidad || 'pza', cantidad: l.cantidad, precio: l.precio })),
    }));
    r.truncado = d.truncado; r.totalReal = d.total;
    return r;
  },

  async inventario(q = '') {
    const d = await peticion('GET', '/api/inventario?q=' + encodeURIComponent(q));
    const r = d.productos.map(p => ({
      id: p.id, codigo: p.codigo || '', nombre: p.descripcion, depto: p.departamento || '',
      precio: p.precio, costo: p.costo, stock: p.existencia, minimo: p.minimo, unidad: p.unidad,
    }));
    r.truncado = d.truncado; r.totalReal = d.total;
    return r;
  },

  /** tipo: 'ENTRADA' (+), 'SALIDA' (-, merma) o 'CONTEO' (fija la existencia exacta) */
  async ajustarStock({ id, tipo, cantidad, motivo, proveedor }) {
    const t = tipo === 'ENTRADA' ? 'entrada' : tipo === 'SALIDA' ? 'merma' : 'ajuste';
    const generico = ['ENTRADA', 'SALIDA', 'CONTEO'].includes(motivo);
    const texto = motivo && !generico ? motivo
      : t === 'entrada' ? 'Entrada registrada desde el móvil'
      : t === 'merma' ? 'Merma registrada desde el móvil' : 'Conteo físico desde el móvil';
    const d = await peticion('POST', '/api/inventario/ajuste', { productoId: id, tipo: t, cantidad, motivo: texto, proveedor });
    return { id: d.producto.id, stock: d.producto.existencia };
  },

  /** Entradas de mercancía de un ticket: UNA petición real por línea; devuelve lo aplicado y lo que falló. */
  async aplicarTicket(lineas) {
    const fallidas = [];
    let aplicadas = 0;
    for (const l of lineas) {
      try {
        await api.ajustarStock({ id: l.pid, tipo: 'ENTRADA', cantidad: l.cantidad,
          motivo: 'Entrada por ticket de proveedor (móvil)', proveedor: 'Ticket de proveedor (móvil)' });
        aplicadas++;
      } catch (e) {
        if (e.estado === 401) throw e;
        fallidas.push({ nombre: l.nombre, mensaje: e.message });
      }
    }
    return { aplicadas, fallidas };
  },
};

/* ----------------------------------------------------------------------------
   GANCHO DE OCR  (DEMO: la lectura de la foto NO es real)
   ----------------------------------------------------------------------------
   Contrato: extraerLineas(archivoImagen: File) -> Promise<Array<{
       pid, nombre, unidad, cantidad, costo }>>
   HOY: ignora la imagen e inventa líneas de EJEMPLO con productos reales del
   inventario (los de menor existencia). Nada se aplica sin que el usuario
   marque cada línea. MAÑANA: enviar la foto al servidor y devolver sus líneas. */
const ocr = {
  async extraerLineas(archivoImagen) {
    await espera(1400);   // simula el tiempo de lectura
    const productos = (await api.inventario('')).slice(0, 4);
    const cantidades = [24, 48, 20, 12];
    return productos.map((p, i) => ({ pid: p.id, nombre: p.nombre, unidad: p.unidad, cantidad: cantidades[i], costo: p.costo || 0 }));
  },
};

/* ============================================================================
   3. ESTADO DE SESIÓN Y ARRANQUE
   ============================================================================ */
const raiz = document.getElementById('app');
const E = { sesion: null, vista: 'estadisticas', desfase: 0, temporizador: null, periodo: 'dia' };

function reciente(s) {   // guarda en el teléfono lo que dice el SERVIDOR
  E.sesion = s;
  E.desfase = (s.ahora || Date.now()) - Date.now();
  const actual = sesionLocal.leer() || {};
  sesionLocal.guardar(s.token || actual.token, s.expira, s.permanente);
}

function cerrarLocal(mensaje) {
  sesionLocal.borrar();
  E.sesion = null;
  clearInterval(E.temporizador);
  document.querySelectorAll('.velo').forEach(v => v.remove());
  pantallaLogin(mensaje);
}

document.addEventListener('sesion-terminada', () => {
  if (E.sesion || sesionLocal.leer()) cerrarLocal('Tu sesión terminó. Inicia sesión de nuevo.');
});

async function arrancar() {
  const s = sesionLocal.leer();
  if (!s || !s.token) return pantallaLogin();
  // Comprobación local rápida; la decisión real la toma el servidor.
  if (s.expira && s.expira <= Date.now() + E.desfase) return cerrarLocal('Tu sesión terminó. Inicia sesión de nuevo.');
  raiz.replaceChildren(cargando('Verificando sesión…'));
  try {
    reciente(await api.sesion());
    entrarAlSistema();
  } catch (e) {
    if (e.estado === 401) return;                      // ya manejado por 'sesion-terminada'
    raiz.replaceChildren(h('div', { class: 'login' }, h('div', { class: 'login-caja' },
      h('div', { class: 'aviso-err', role: 'alert' }, e.message),
      h('button', { class: 'btn btn-primario btn-block', onclick: arrancar }, 'Reintentar'))));
  }
}

/** Revalida contra el servidor (permisos al día, caducidad). Devuelve false si ya no hay sesión. */
async function revalidar() {
  try { reciente(await api.sesion()); return true; }
  catch (e) { return e.estado !== 401; }   // sin red o error del servidor: no se cierra la sesión; 401 ya mostró el login
}

/* ============================================================================
   5. PANTALLA DE LOGIN
   ============================================================================ */
function pantallaLogin(mensaje) {
  const error = h('div', { class: mensaje ? 'aviso-err' : 'oculto', role: 'alert' }, mensaje || '');
  const usuario = h('input', { class: 'entrada', id: 'usuario', type: 'text', autocomplete: 'username',
    autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', required: true });
  const clave = h('input', { class: 'entrada', id: 'clave', type: 'password', autocomplete: 'current-password', required: true });
  const ver = h('button', { class: 'btn icono-btn', type: 'button', 'aria-label': 'Mostrar contraseña' }, '👁');
  ver.addEventListener('click', () => {
    clave.type = clave.type === 'password' ? 'text' : 'password';
    ver.setAttribute('aria-label', clave.type === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña');
  });
  const entrar = h('button', { class: 'btn btn-primario btn-block', type: 'submit' }, 'Entrar');
  const form = h('form', { class: 'login-caja', novalidate: true },
    h('div', { class: 'logo', 'aria-hidden': 'true' }, '🛒'),
    h('div', null, h('h1', null, 'Punto de Venta'), h('p', { class: 'sub' }, 'Acceso móvil · inicia sesión con tu usuario')),
    error,
    h('div', { class: 'campo' }, h('label', { for: 'usuario' }, 'Usuario'), usuario),
    h('div', { class: 'campo' }, h('label', { for: 'clave' }, 'Contraseña'), h('div', { class: 'con-boton' }, clave, ver)),
    entrar);
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const u = usuario.value.trim();
    if (!u || !clave.value) { mostrar('Escribe tu usuario y contraseña.'); return; }
    entrar.disabled = true; entrar.textContent = 'Entrando…';
    try {
      const claveUsada = clave.value;   // solo en memoria, para confirmar «mantener abierta»; se descarta al terminar
      const s = await api.login(u, claveUsada, false);
      clave.value = '';
      reciente(s);
      await preguntarMantener(claveUsada);
      entrarAlSistema();
    } catch (e) {
      mostrar(e.message);
      entrar.disabled = false; entrar.textContent = 'Entrar';
    }
  });
  function mostrar(t) { error.className = 'aviso-err'; error.textContent = t; }
  raiz.replaceChildren(h('div', { class: 'login' }, form));
  usuario.focus();
}

/** Pregunta obligatoria tras entrar: Sí = sin caducidad, No = 48 horas */
function preguntarMantener(claveUsada) {
  return new Promise(resolver => {
    const msg = h('div', { class: 'oculto', role: 'alert' });
    const elegir = async permanente => {
      si.disabled = no.disabled = true;
      try {
        if (permanente) reciente(await api.recordar(true, claveUsada));   // por defecto el servidor ya la dejó en 48 h
        h1.cerrar(); resolver();
      } catch (e) {
        msg.className = 'aviso-err'; msg.textContent = e.message; si.disabled = no.disabled = false;
        if (e.estado === 401) { h1.cerrar(); resolver(); }
      }
    };
    const si = h('button', { class: 'btn btn-primario', type: 'button', onclick: () => elegir(true) }, 'Sí, mantenerla abierta');
    const no = h('button', { class: 'btn', type: 'button', onclick: () => elegir(false) }, 'No, que dure 48 horas');
    const h1 = hoja([
      h('h2', null, '¿Mantener la sesión siempre abierta?'),
      h('p', { class: 'sub' }, 'Si eliges Sí, este teléfono no volverá a pedir tu contraseña mientras lo uses al menos una vez cada 60 días o hasta que cierres sesión. Si eliges No, la sesión se cerrará sola a las 48 horas.'),
      msg, h('div', { class: 'acciones' }, si, no),
    ], { cerrable: false });
  });
}

/* ============================================================================
   6. ESTRUCTURA PRINCIPAL (cabecera + vistas + menú inferior)
   ============================================================================ */
const SECCIONES = [   // `permiso` = clave de `secciones` que devuelve el servidor
  { id: 'estadisticas', etiqueta: 'Inicio',     icono: '📊', permiso: 'estadisticas', vista: vistaEstadisticas },
  { id: 'historial',    etiqueta: 'Ventas',     icono: '🧾', permiso: 'historial',    vista: vistaHistorial },
  { id: 'inventario',   etiqueta: 'Inventario', icono: '📦', permiso: 'inventario',   vista: vistaInventario },
  { id: 'escanear',     etiqueta: 'Escanear',   icono: '📷', permiso: 'escanearTicket', vista: vistaEscanear },
  { id: 'config',       etiqueta: 'Ajustes',    icono: '⚙️', permiso: 'configuracion', vista: vistaConfig },
];
const permitidas = () => SECCIONES.filter(s => E.sesion && E.sesion.secciones && E.sesion.secciones[s.permiso]);

let contVista, contNav, tituloCab;

function entrarAlSistema() {
  tituloCab = h('h1');
  contVista = h('main', { class: 'vista', id: 'vista', tabindex: '-1' });
  contNav = h('div', { class: 'nav-int' });
  raiz.replaceChildren(
    h('header', { class: 'cabecera' }, tituloCab, h('span', { class: 'pastilla' }, 'Datos demo')),
    contVista,
    h('nav', { class: 'nav', 'aria-label': 'Secciones' }, contNav));
  const ok = permitidas();
  if (!ok.length) { cerrarLocal('Tu usuario no tiene secciones disponibles.'); return; }
  const inicial = location.hash.replace('#/', '');
  irA(ok.some(s => s.id === inicial) ? inicial : ok[0].id);
  clearInterval(E.temporizador);
  E.temporizador = setInterval(vigilar, 60000);   // revalida cada minuto
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && E.sesion) vigilar(); });
window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#/', '');
  if (E.sesion && id !== E.vista && permitidas().some(s => s.id === id)) irA(id);
});

async function vigilar() {
  if (!E.sesion) return;
  if (E.sesion.expira && E.sesion.expira <= Date.now() + E.desfase) return cerrarLocal('Tu sesión terminó. Inicia sesión de nuevo.');
  await revalidar();   // si el servidor dice 401, 'sesion-terminada' cierra todo
  if (E.sesion) {
    pintarNav();
    if (!permitidas().some(s => s.id === E.vista)) irA(permitidas()[0].id);   // le quitaron un permiso
  }
}

function pintarNav() {
  vaciar(contNav);
  for (const s of permitidas()) {
    contNav.append(h('button', { type: 'button', 'aria-current': s.id === E.vista ? 'page' : null, onclick: () => irA(s.id) },
      h('span', { class: 'ico', 'aria-hidden': 'true' }, s.icono), s.etiqueta));
  }
}

/** Cada cambio de sección vuelve a validar la sesión EN EL SERVIDOR (guardia de ruta). */
async function irA(id) {
  contVista.replaceChildren(cargando());
  if (!(await revalidar())) return;            // 401 => ya se mostró el login
  const s = permitidas().find(x => x.id === id);
  if (!s) {
    contVista.replaceChildren(h('div', { class: 'vacio' }, 'No tienes permiso para ver esta sección.'));
    return;
  }
  E.vista = id;
  history.replaceState(null, '', '#/' + id);
  tituloCab.textContent = s.etiqueta === 'Inicio' ? 'Estadísticas' : s.etiqueta === 'Ventas' ? 'Historial de ventas' : s.etiqueta === 'Ajustes' ? 'Configuración' : s.etiqueta === 'Escanear' ? 'Escanear ticket' : s.etiqueta;
  pintarNav();
  try {
    contVista.replaceChildren(await s.vista());
  } catch (e) {
    if (e.estado === 401) return;
    contVista.replaceChildren(h('div', { class: 'aviso-err', role: 'alert' }, e.message));
  }
  window.scrollTo(0, 0);
}

/* ============================================================================
   7. VISTA: ESTADÍSTICAS  (requiere VER_HISTORIAL)
   ============================================================================ */
async function vistaEstadisticas() {
  const caja = h('div');
  const nombres = { dia: 'Hoy', semana: 'Esta semana', mes: 'Este mes' };
  const seg = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Periodo' });
  const cuerpo = h('div', { class: 'vista-int', style: 'display:grid;gap:1rem' });
  caja.append(seg, h('div', { style: 'height:1rem' }), cuerpo);

  const pintarSeg = () => {
    vaciar(seg);
    for (const [k, t] of Object.entries(nombres)) {
      seg.append(h('button', { type: 'button', 'aria-pressed': String(E.periodo === k),
        onclick: () => { E.periodo = k; pintarSeg(); cargar(); } }, t));
    }
  };
  async function cargar() {
    cuerpo.replaceChildren(cargando());
    try {
      const d = await api.estadisticas(E.periodo);
      const verGanancia = E.sesion.permisos.includes('VER_GANANCIAS');
      const maxTop = Math.max(...d.top.map(t => t.importe), 1);
      const maxFranja = Math.max(...d.franjas.map(x => x.total), 1);
      const pico = d.franjas.reduce((a, b) => b.total > a.total ? b : a, d.franjas[0]);
      const variacion = d.variacion == null ? null :
        h('div', { class: 'var ' + (d.variacion >= 0 ? 'sube' : 'baja') },
          (d.variacion >= 0 ? '▲ ' : '▼ ') + Math.abs(d.variacion * 100).toFixed(0) + '% vs. periodo anterior');
      cuerpo.replaceChildren(
        h('div', { class: 'rejilla' },
          h('div', { class: 'kpi grande' }, h('div', { class: 'e' }, 'Ventas · ' + nombres[E.periodo]), h('div', { class: 'v' }, dinero(d.total)), variacion),
          h('div', { class: 'kpi' }, h('div', { class: 'e' }, 'Tickets'), h('div', { class: 'v' }, String(d.tickets))),
          h('div', { class: 'kpi' }, h('div', { class: 'e' }, 'Ticket promedio'), h('div', { class: 'v' }, dinero(d.promedio))),
          verGanancia && d.ganancia != null ? h('div', { class: 'kpi', style: 'grid-column:1/-1' }, h('div', { class: 'e' }, 'Ganancia estimada'), h('div', { class: 'v' }, dinero(d.ganancia))) : null),
        h('section', { class: 'tarjeta' },
          h('div', { class: 'seccion-t' }, 'Productos más vendidos'),
          d.top.length ? d.top.map((t, i) => h('div', { class: 'top-item' },
            h('div', { class: 'l' }, h('span', null, (i + 1) + '. ' + t.nombre), h('span', null, dinero(t.importe))),
            h('div', { class: 'barra', role: 'img', 'aria-label': t.nombre + ': ' + num(t.cantidad) + ' ' + t.unidad },
              (() => { const b = h('i'); b.style.width = (t.importe / maxTop * 100) + '%'; return b; })()),
            h('div', { class: 'sub' }, num(t.cantidad) + ' ' + t.unidad + ' vendidas')))
            : h('p', { class: 'vacio' }, 'Aún no hay ventas en este periodo.')),
        h('section', { class: 'tarjeta' },
          h('div', { class: 'seccion-t' }, 'Ventas por franja del día'),
          d.total ? [
            d.franjas.map(x => h('div', { class: 'top-item' },
              h('div', { class: 'l' }, h('span', null, x.etiqueta + (x === pico ? ' · la más fuerte' : '')), h('span', null, dinero(x.total))),
              h('div', { class: 'barra', role: 'img', 'aria-label': x.etiqueta + ': ' + dinero(x.total) },
                (() => { const b = h('i'); b.style.width = (x.total / maxFranja * 100) + '%'; return b; })()),
              h('div', { class: 'sub' }, x.transacciones + ' ticket(s)'))),
          ] : h('p', { class: 'vacio' }, 'Aún no hay ventas en este periodo.')));
    } catch (e) { if (e.estado !== 401) cuerpo.replaceChildren(errorConReintento(e, cargar)); }
  }
  pintarSeg(); cargar();
  return caja;
}

/* ============================================================================
   8. VISTA: HISTORIAL DE VENTAS  (requiere VER_HISTORIAL)
   ============================================================================ */
async function vistaHistorial() {
  const hoy = claveDia(new Date());
  const desde = h('input', { class: 'entrada', type: 'date', id: 'desde', value: hoy, max: hoy });
  const hasta = h('input', { class: 'entrada', type: 'date', id: 'hasta', value: hoy, max: hoy });
  const lista = h('div');
  const resumen = h('p', { class: 'sub' });

  const atajo = (t, f) => h('button', { class: 'btn btn-suave', type: 'button', onclick: () => { f(); cargar(); } }, t);
  const ayer = () => claveDia(sumarDias(new Date(), -1));
  const filtros = h('section', { class: 'tarjeta', style: 'display:grid;gap:.8rem' },
    h('div', { class: 'rejilla' },
      h('div', { class: 'campo' }, h('label', { for: 'desde' }, 'Desde'), desde),
      h('div', { class: 'campo' }, h('label', { for: 'hasta' }, 'Hasta'), hasta)),
    h('div', { class: 'rejilla' },
      atajo('Hoy', () => { desde.value = hasta.value = hoy; }),
      atajo('Ayer', () => { desde.value = hasta.value = ayer(); }),
      atajo('Últimos 7 días', () => { desde.value = claveDia(sumarDias(new Date(), -6)); hasta.value = hoy; }),
      atajo('Este mes', () => { const n = new Date(); desde.value = claveDia(new Date(n.getFullYear(), n.getMonth(), 1)); hasta.value = hoy; })));
  desde.addEventListener('change', cargar); hasta.addEventListener('change', cargar);

  async function cargar() {
    if (!desde.value || !hasta.value) return;
    if ((new Date(hasta.value) - new Date(desde.value)) / 86400000 + 1 > 93) { lista.replaceChildren(h('div', { class: 'aviso-err' }, 'El rango máximo es de 93 días.')); return; }
    if (desde.value > hasta.value) { lista.replaceChildren(h('div', { class: 'aviso-err' }, 'La fecha inicial no puede ser posterior a la final.')); return; }
    lista.replaceChildren(cargando());
    try {
      const ventas = await api.ventas({ desde: desde.value, hasta: hasta.value });
      const total = ventas.filter(v => !v.cancelada).reduce((s, v) => s + v.total, 0);
      resumen.textContent = ventas.length + ' venta(s) · ' + dinero(total) + ' (sin canceladas)';
      if (!ventas.length) { lista.replaceChildren(h('div', { class: 'vacio' }, 'No hay ventas en ese rango.')); return; }
      const tope = 80;
      lista.replaceChildren(...ventas.slice(0, tope).map(v =>
        h('button', { class: 'fila', type: 'button', onclick: () => detalleVenta(v) },
          h('div', { class: 'cuerpo' },
            h('div', { class: 't' }, 'Folio ' + v.folio, v.cancelada ? h('span', { class: 'insignia mal', style: 'margin-left:.5rem' }, 'Cancelada') : null),
            h('div', { class: 'd' }, fechaHora(v.fecha) + ' · ' + v.pago + ' · ' + v.cajero)),
          h('div', { class: 'der' }, dinero(v.total)))),
        ventas.length > tope || ventas.truncado ? h('p', { class: 'sub', style: 'text-align:center;margin-top:.8rem' }, 'Se muestran las ' + Math.min(tope, ventas.length) + ' más recientes. Acota las fechas para ver el resto.') : null);
    } catch (e) { if (e.estado !== 401) lista.replaceChildren(errorConReintento(e, cargar)); }
  }
  cargar();
  return h('div', { style: 'display:grid;gap:1rem' }, filtros, resumen, lista);
}

function detalleVenta(v) {
  const h2 = hoja([
    h('h2', null, 'Venta ' + v.folio),
    h('p', { class: 'sub' }, fechaLarga(v.fecha) + ' ' + hora(v.fecha) + ' · ' + v.pago + ' · ' + v.cajero + (v.cancelada ? ' · CANCELADA' : '')),
    h('div', null, v.lineas.map(l => h('div', { class: 'linea' },
      h('div', { class: 'n' }, h('div', null, l.nombre), h('div', { class: 's' }, num(l.cantidad) + ' ' + l.unidad + ' × ' + dinero(l.precio))),
      h('div', null, dinero(l.cantidad * l.precio))))),
    h('div', { class: 'total-fila' }, h('span', null, 'Total'), h('span', null, dinero(v.total))),
    h('button', { class: 'btn btn-block', type: 'button', onclick: () => h2.cerrar() }, 'Cerrar'),
  ]);
}

/* ============================================================================
   9. VISTA: INVENTARIO  (ver: todos · ajustar: AJUSTAR_INVENTARIO)
   ============================================================================ */
async function vistaInventario() {
  let productos = await api.inventario('');
  let filtro = 'todos', texto = '', pendiente = null, secuencia = 0;
  const lista = h('div');
  const busca = h('input', { class: 'entrada', type: 'search', placeholder: 'Buscar producto o código', 'aria-label': 'Buscar producto', autocomplete: 'off' });
  const chips = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Filtrar' });
  const estado = p => p.stock <= 0 ? ['Agotado', 'mal'] : p.stock <= p.minimo ? ['Stock bajo', 'aviso'] : ['En existencia', 'ok'];

  function pintar() {
    vaciar(chips);
    for (const [k, t] of [['todos', 'Todos'], ['bajo', 'Stock bajo'], ['agotado', 'Agotados']]) {
      chips.append(h('button', { type: 'button', 'aria-pressed': String(filtro === k), onclick: () => { filtro = k; pintar(); } }, t));
    }
    const vis = productos.filter(p =>
      filtro === 'todos' || (filtro === 'agotado' ? p.stock <= 0 : p.stock <= p.minimo));
    vaciar(lista);
    if (!vis.length) { lista.append(h('div', { class: 'vacio' }, 'No hay productos con ese filtro.')); return; }
    for (const p of vis) {
      const [et, clase] = estado(p);
      lista.append(h('button', { class: 'fila', type: 'button', onclick: () => hojaAjuste(p, pintar) },
        h('div', { class: 'cuerpo' }, h('div', { class: 't' }, p.nombre), h('div', { class: 'd' }, p.depto + ' · mín. ' + num(p.minimo))),
        h('div', { class: 'der' }, num(p.stock) + ' ' + p.unidad, h('div', null, h('span', { class: 'insignia ' + clase }, et)))));
    }
  }
  async function buscar() {   // la búsqueda la hace el servidor (hasta 200 productos por consulta)
    const mia = ++secuencia;
    lista.replaceChildren(cargando());
    try {
      const nuevos = await api.inventario(texto.trim());
      if (mia !== secuencia) return;   // llegó una búsqueda más reciente
      productos = nuevos; pintar();
      if (productos.truncado) lista.append(h('p', { class: 'sub', style: 'text-align:center;margin-top:.8rem' },
        'Hay ' + productos.totalReal + ' productos; se muestran los primeros ' + productos.length + '. Escribe más letras para acotar.'));
    } catch (e) { if (mia === secuencia && e.estado !== 401) lista.replaceChildren(errorConReintento(e, buscar)); }
  }
  busca.addEventListener('input', () => { texto = busca.value; clearTimeout(pendiente); pendiente = setTimeout(buscar, 300); });
  pintar();
  return h('div', { style: 'display:grid;gap:1rem' }, busca, chips, lista);
}

function hojaAjuste(producto, alGuardar) {
  const puede = E.sesion.secciones.inventarioAjustar;
  const [tit] = [producto.nombre];
  const info = [
    h('h2', null, tit),
    h('p', { class: 'sub' }, producto.depto + ' · código ' + producto.codigo),
    h('div', { class: 'rejilla' },
      h('div', { class: 'kpi' }, h('div', { class: 'e' }, 'Existencia'), h('div', { class: 'v' }, num(producto.stock) + ' ' + producto.unidad)),
      h('div', { class: 'kpi' }, h('div', { class: 'e' }, 'Precio'), h('div', { class: 'v' }, dinero(producto.precio)))),
  ];
  if (!puede) {
    const s = hoja([...info, h('p', { class: 'sub' }, 'Tu usuario no tiene permiso para ajustar el inventario.'),
      h('button', { class: 'btn btn-block', type: 'button', onclick: () => s.cerrar() }, 'Cerrar')]);
    return;
  }
  let tipo = 'ENTRADA';
  const tipos = [['ENTRADA', 'Entrada (+)'], ['SALIDA', 'Merma (−)'], ['CONTEO', 'Conteo']];
  const seg = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Tipo de ajuste' });
  const cant = h('input', { class: 'entrada', id: 'cant', type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: '0' });
  const etCant = h('label', { for: 'cant' });
  const err = h('div', { class: 'oculto', role: 'alert' });
  const guardar = h('button', { class: 'btn btn-primario', type: 'button' }, 'Guardar ajuste');
  const pintarSeg = () => {
    vaciar(seg);
    for (const [k, t] of tipos) seg.append(h('button', { type: 'button', 'aria-pressed': String(tipo === k), onclick: () => { tipo = k; pintarSeg(); } }, t));
    etCant.textContent = tipo === 'CONTEO' ? 'Existencia contada (' + producto.unidad + ')' : 'Cantidad (' + producto.unidad + ')';
  };
  pintarSeg();
  const v = hoja([...info, seg, h('div', { class: 'campo' }, etCant, cant), err,
    h('div', { class: 'acciones dos' }, h('button', { class: 'btn', type: 'button', onclick: () => v.cerrar() }, 'Cancelar'), guardar)]);
  guardar.addEventListener('click', async () => {
    const n = parseFloat(cant.value.replace(',', '.'));
    if (!isFinite(n) || n < 0 || cant.value.trim() === '') { err.className = 'aviso-err'; err.textContent = 'Captura una cantidad válida.'; return; }
    guardar.disabled = true; guardar.textContent = 'Guardando…';
    try {
      const nuevo = await api.ajustarStock({ id: producto.id, tipo, cantidad: n, motivo: tipo });
      producto.stock = nuevo.stock;
      v.cerrar(); vibrar(30); avisar('Inventario actualizado: ' + num(nuevo.stock) + ' ' + producto.unidad);
      alGuardar();
    } catch (e) {
      if (e.estado === 401) { v.cerrar(); return; }
      err.className = 'aviso-err'; err.textContent = e.estado === 403 ? 'Sin permiso. ' + e.message : e.message;
      guardar.disabled = false; guardar.textContent = 'Guardar ajuste';
    }
  });
}

/* ============================================================================
   10. VISTA: ESCANEAR TICKET DE PROVEEDOR (MAQUETA)
       - <input type="file" accept="image/*" capture="environment"> abre la
         cámara trasera del teléfono.
       - "Procesar" simula la lectura (ocr.extraerLineas, DEMO). Las líneas se
         proponen sin marcar: solo las que el usuario marque y confirme se
         aplican de verdad (api.aplicarTicket -> entradas reales de inventario).
   ============================================================================ */
async function vistaEscanear() {
  const caja = h('div', { style: 'display:grid;gap:1rem' });
  let urlPrevia = null;
  const liberar = () => { if (urlPrevia) { URL.revokeObjectURL(urlPrevia); urlPrevia = null; } };

  function inicio() {
    liberar();
    const entrada = h('input', { class: 'entrada-oculta', id: 'foto', type: 'file', accept: 'image/*', capture: 'environment' });
    entrada.addEventListener('change', () => { if (entrada.files && entrada.files[0]) vistaPrevia(entrada.files[0]); });
    caja.replaceChildren(
      h('p', { class: 'sub' }, 'Toma una foto del ticket o factura del proveedor para dar entrada a la mercancía en el inventario.'),
      h('label', { class: 'tomar', for: 'foto' },
        h('div', { class: 'grande', 'aria-hidden': 'true' }, '📷'),
        h('div', { class: 'titulo' }, 'Tomar foto del ticket'),
        h('div', { class: 'sub' }, 'Se abrirá la cámara del teléfono')),
      entrada,
      h('div', { class: 'aviso-ok', style: 'background:var(--warning-subtle);color:var(--warning-text)' },
        'DEMO: la lectura de la foto es simulada. Se mostrarán líneas de ejemplo con productos de tu inventario y NADA se aplica hasta que marques cada línea y confirmes.'));
  }

  function vistaPrevia(archivo) {
    liberar();
    urlPrevia = URL.createObjectURL(archivo);
    const procesar = h('button', { class: 'btn btn-primario btn-block', type: 'button' }, 'Procesar ticket');
    procesar.addEventListener('click', () => procesarTicket(archivo));
    caja.replaceChildren(
      h('img', { class: 'previa', src: urlPrevia, alt: 'Foto del ticket' }),
      procesar,
      h('button', { class: 'btn btn-block', type: 'button', onclick: inicio }, 'Tomar otra foto'));
  }

  async function procesarTicket(archivo) {
    const paso = h('span', null, 'Leyendo el ticket…');
    caja.replaceChildren(h('div', { class: 'tarjeta cargando' }, h('div', { class: 'rueda' }), h('div', { class: 'paso' }, paso)));
    try {
      const lineas = await ocr.extraerLineas(archivo);     // <-- AQUÍ entra el OCR real
      liberar();
      pantallaLineas(lineas);
    } catch (e) {
      caja.replaceChildren(h('div', { class: 'aviso-err', role: 'alert' }, e.message),
        h('button', { class: 'btn btn-block', type: 'button', onclick: inicio }, 'Intentar de nuevo'));
    }
  }
  function pantallaLineas(lineas) {
    const marcas = lineas.map(() => h('input', { type: 'checkbox', style: 'width:1.4rem;height:1.4rem;flex:none' }));
    const aplicar = h('button', { class: 'btn btn-primario btn-block', type: 'button' }, 'Aplicar las líneas marcadas');
    const resumen = h('p', { class: 'sub', role: 'status' });
    const marcadas = () => lineas.filter((l, i) => marcas[i].checked);
    const filas = lineas.map((l, i) => h('label', { class: 'linea', style: 'display:flex;gap:.7rem;align-items:center' },
      marcas[i],
      h('div', { class: 'n', style: 'flex:1' }, h('div', null, l.nombre), h('div', { class: 's' }, '+' + num(l.cantidad) + ' ' + l.unidad + ' (ejemplo)'))));
    aplicar.addEventListener('click', async () => {
      const elegidas = marcadas();
      if (!elegidas.length) { resumen.textContent = 'No marcaste ninguna línea: no se cambió el inventario.'; return; }
      aplicar.disabled = true; aplicar.textContent = 'Aplicando…';
      try {
        const r = await api.aplicarTicket(elegidas);
        caja.replaceChildren(
          r.aplicadas ? h('div', { class: 'aviso-ok', role: 'status' }, r.aplicadas + ' entrada(s) registrada(s) en el inventario') : null,
          r.fallidas.length ? h('div', { class: 'aviso-err', role: 'alert' }, 'No se pudieron aplicar: ' + r.fallidas.map(f => f.nombre + ' (' + f.mensaje + ')').join('; ')) : null,
          h('button', { class: 'btn btn-primario btn-block', type: 'button', onclick: inicio }, 'Escanear otro ticket'));
        if (r.aplicadas) vibrar(40);
      } catch (e) {
        if (e.estado === 401) return;
        aplicar.disabled = false; aplicar.textContent = 'Aplicar las líneas marcadas';
        resumen.textContent = e.estado === 403 ? 'Sin permiso. ' + e.message : e.message;
      }
    });
    caja.replaceChildren(
      h('div', { class: 'aviso-ok', style: 'background:var(--warning-subtle);color:var(--warning-text)' },
        'DEMO: estas líneas son de ejemplo, no salen de tu foto. Marca solo las que quieras registrar como entrada real.'),
      h('section', { class: 'tarjeta' }, h('div', { class: 'seccion-t' }, 'Líneas de ejemplo'),
        lineas.length ? filas : h('p', { class: 'vacio' }, 'No hay productos en el inventario para el ejemplo.')),
      resumen, lineas.length ? aplicar : null,
      h('button', { class: 'btn btn-block', type: 'button', onclick: inicio }, 'Descartar'));
  }
  inicio();
  return caja;
}

/* ============================================================================
   11. VISTA: CONFIGURACIÓN (preferencias + cerrar sesión)
   ============================================================================ */
async function vistaConfig() {
  const s = E.sesion;
  const vence = h('div', { class: 'd' });
  const pintarVence = () => {
    const a = E.sesion;
    vence.textContent = a.permanente ? 'Sesión permanente en este teléfono (se cierra tras 60 días sin usarla).'
      : 'Se cerrará el ' + new Date(a.expira).toLocaleString('es-MX', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + ' (48 horas).';
  };
  pintarVence();
  const segTema = h('div', { class: 'segmentos', role: 'group', 'aria-label': 'Tema' });
  const pintarTema = () => {
    vaciar(segTema);
    const actual = almacen.get('pv.tema') || 'auto';
    for (const [k, t] of [['auto', 'Automático'], ['claro', 'Claro'], ['oscuro', 'Oscuro']]) {
      segTema.append(h('button', { type: 'button', 'aria-pressed': String(actual === k), onclick: () => {
        if (k === 'auto') almacen.del('pv.tema'); else almacen.set('pv.tema', k);
        aplicarPreferencias(); pintarTema();
      } }, t));
    }
  };
  pintarTema();

  const cerrar = h('button', { class: 'btn btn-peligro btn-block', type: 'button' }, 'Cerrar sesión');
  cerrar.addEventListener('click', () => {
    const q = hoja([h('h2', null, '¿Cerrar sesión?'), h('p', { class: 'sub' }, 'Tendrás que escribir tu usuario y contraseña para volver a entrar.'),
      h('div', { class: 'acciones dos' }, h('button', { class: 'btn', type: 'button', onclick: () => q.cerrar() }, 'Cancelar'),
        h('button', { class: 'btn btn-peligro', type: 'button', onclick: async () => {
          try { await api.logout(); } catch (e) { /* aun sin red, se cierra aquí */ }
          q.cerrar(); cerrarLocal();
        } }, 'Cerrar sesión'))]);
  });

  return h('div', { style: 'display:grid;gap:1rem' },
    h('section', { class: 'tarjeta' },
      h('div', { class: 'titulo' }, s.nombre),
      h('div', { class: 'sub' }, s.rolEtiqueta + ' · usuario ' + s.usuario)),
    h('section', { class: 'tarjeta' },
      h('div', { class: 'seccion-t' }, 'Sesión'),
      h('div', { class: 'fila-conf' },
        h('div', null, h('div', { class: 't' }, 'Mantener la sesión siempre abierta'), vence),
        interruptor(s.permanente, async v => {
          const clave = v && !E.sesion.permanente ? await pedirClave() : null;   // subir a permanente exige la contraseña
          if (v && !E.sesion.permanente && clave === null) throw new Error('cancelado');
          reciente(await api.recordar(v, clave)); pintarVence();
        }, 'Mantener la sesión siempre abierta'))),
    h('section', { class: 'tarjeta' },
      h('div', { class: 'seccion-t' }, 'Preferencias'),
      h('div', { class: 'fila-conf', style: 'display:grid' }, h('div', { class: 't' }, 'Tema'), segTema),
      h('div', { class: 'fila-conf' },
        h('div', null, h('div', { class: 't' }, 'Texto grande'), h('div', { class: 'd' }, 'Aumenta el tamaño de letra de toda la página.')),
        interruptor(almacen.get('pv.texto') === 'grande', v => { if (v) almacen.set('pv.texto', 'grande'); else almacen.del('pv.texto'); aplicarPreferencias(); }, 'Texto grande'))),
    h('section', { class: 'tarjeta' },
      h('div', { class: 'seccion-t' }, 'Acerca de'),
      h('p', { class: 'sub' }, 'Interfaz móvil del Punto de Venta. Las ventas, el inventario y las estadísticas vienen del programa de escritorio. Solo la lectura de tickets (cámara) es una demostración.')),
    cerrar);
}

arrancar();
})();
</script>
