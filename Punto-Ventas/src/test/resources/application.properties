# ──────────────────────────────────────────────────
#  Configuración SOLO para pruebas.
#  Reemplaza por completo a src/main/resources/application.properties
#  (mismo nombre en el classpath) para que los tests NUNCA toquen datos.db.
# ──────────────────────────────────────────────────

spring.application.name=PuntoDeVenta-test

# Base de datos SQLite desechable en la carpeta temporal del sistema
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/puntodeventa-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Esquema limpio en cada corrida
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.nombre-tienda=Tienda de pruebas
app.moneda=MXN
app.version=test

# Carpeta "datos" (logotipo) desechable: nunca se toca la del programa
app.datos-dir=${java.io.tmpdir}/puntodeventa-test-datos

# Sin trabajos en segundo plano (agregados al arrancar, clima cada hora):
# las pruebas los invocan a mano y nunca llaman a internet
app.estadisticas.jobs=false
app.movil.autoarranque=false

# Mismos ajustes de SQLite que producción (WAL, busy_timeout, claves foráneas)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.synchronous=NORMAL
spring.datasource.hikari.data-source-properties.busy_timeout=10000
spring.datasource.hikari.data-source-properties.cache_size=-8000
spring.datasource.hikari.data-source-properties.temp_store=MEMORY
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.jpa.open-in-view=false
spring.main.banner-mode=off
