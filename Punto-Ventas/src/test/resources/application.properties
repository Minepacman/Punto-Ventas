# ──────────────────────────────────────────────────
#  Configuración SOLO para pruebas.
#  Reemplaza por completo a src/main/resources/application.properties
#  (mismo nombre en el classpath) para que los tests NUNCA toquen datos.db.
# ──────────────────────────────────────────────────

spring.application.name=PuntoDeVenta-test

# Base de datos SQLite desechable en la carpeta temporal del sistema
spring.datasource.url=jdbc:sqlite:${java.io.tmpdir}/puntodeventa-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Esquema limpio en cada corrida
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.nombre-tienda=Tienda de pruebas
app.moneda=MXN

# Carpeta "datos" (logotipo) desechable: nunca se toca la del programa
app.datos-dir=${java.io.tmpdir}/puntodeventa-test-datos

# Sin trabajos en segundo plano (agregados al arrancar, clima cada hora):
# las pruebas los invocan a mano y nunca llaman a internet
app.estadisticas.jobs=false
app.movil.autoarranque=false
# Las tareas de ApplicationReadyEvent (acceso móvil, proveedores, clima) corren en el acto, no en el hilo diferido
app.arranque.diferido=false

# Pool y pragmas de SQLite: los aplica AjustesPoolPorDialecto, igual que en producción
spring.jpa.open-in-view=false
spring.main.banner-mode=off
